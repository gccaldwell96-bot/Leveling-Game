<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16122a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Derby Dynasty">
<title>Derby Dynasty</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#16122a; --panel:#211c3c; --card:#2b254f; --card2:#363061; --line:#3e3872;
    --text:#f4f0ff; --dim:#a8a0d0; --cash:#7dff9a; --gold:#ffd24a; --fame:#ff9ad8; --bad:#ff5d73; --good:#5be38a; --accent:#ffb347;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  #top{display:flex;align-items:center;gap:6px;padding:8px 12px 6px;flex-wrap:wrap}
  .chip{background:var(--panel);padding:5px 9px;border-radius:999px;font-weight:800;font-size:12.5px;white-space:nowrap}
  #cash{color:var(--cash);font-size:15px}
  #fame{color:var(--fame)}
  #date{margin-left:auto;color:var(--gold)}
  #menuBtn{cursor:pointer}
  #endBtn2{display:none;background:linear-gradient(135deg,#ffb347,#ff5d8a);color:#fff;font-weight:900}
  #endBtn2:disabled{opacity:.45}
  #sceneWrap{position:relative;margin:0 12px;border-radius:14px;overflow:hidden;background:#000;touch-action:manipulation}
  #scene{display:block;width:100%;image-rendering:pixelated}
  #sceneBtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
  #sceneBtns button{background:#000b;color:#fff;font-weight:900;font-size:12px;padding:6px 11px;border-radius:99px}
  #sceneBtns button.go{background:linear-gradient(135deg,#ffb347,#ff5d8a)}
  #endRow{display:flex;gap:8px;align-items:center;padding:8px 12px 2px}
  #endBtn{flex:none;background:linear-gradient(135deg,#ffb347,#ff5d8a);color:#fff;font-weight:900;font-size:15px;padding:11px 16px;border-radius:12px;box-shadow:0 3px 0 #a0305a}
  #endBtn:disabled{opacity:.45}
  #planSum{flex:1;font-size:11.5px;color:var(--dim);line-height:1.35;min-width:0}
  #glance{display:none;background:var(--panel);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--dim);line-height:1.6}
  #glance b{color:var(--text)} #glance h4{margin:0 0 4px;color:var(--gold);font-size:14px}
  #tabs{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;padding:6px 12px 4px}
  @media (max-width:520px){ #tabs{gap:2px;padding:6px 8px 4px} #tabs button{font-size:7.8px;letter-spacing:-.3px} #tabs button b{font-size:15px} }
  .field{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .runner{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:9px;padding:5px 6px}
  .runner.mine{outline:1px solid var(--gold)}
  .runner > i{width:10px;height:22px;border-radius:3px;flex:none}
  .runner .rn{flex:1;min-width:0;font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .runner .rn small{display:block;color:var(--dim);font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
  .ob{flex:none;background:var(--card2);border-radius:7px;padding:5px 4px;font-size:10.5px;font-weight:900;color:var(--gold);min-width:46px}
  #tabs button{background:var(--panel);padding:6px 2px;border-radius:10px;font-weight:800;font-size:10px;position:relative;line-height:1.25}
  #tabs button b{display:block;font-size:17px}
  #tabs button.active{background:var(--accent);color:#2a1400}
  #tabs button .dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
  #tabs button.alert .dot{display:block}
  #panel{flex:1;overflow-y:auto;padding:4px 12px 18px;-webkit-overflow-scrolling:touch}
  .horse{background:var(--panel);border-radius:14px;padding:9px;margin-bottom:8px;border:1px solid transparent}
  .horse.mine{border-color:#ffb34755}
  .horse.racing{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .arr{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px}
  .arr b{min-width:38px}
  .arr .sbtn{min-width:0;padding:5px 9px;font-size:11.5px}
  .mv{display:inline-flex;gap:2px;margin-right:3px;align-items:center}
  .grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--dim);font-size:17px;line-height:1;padding:2px 5px 2px 0}
  .grip:hover{color:var(--gold)}
  .horse.dragging{position:relative;z-index:30;box-shadow:0 10px 30px #000a,0 0 0 2px var(--gold);opacity:.96;cursor:grabbing}
  body.dragmode{user-select:none;-webkit-user-select:none;cursor:grabbing}
  .mv button{background:var(--card2);color:var(--dim);font-size:9px;padding:2px 5px;border-radius:5px;line-height:1}
  .mv button:hover{color:var(--gold)}
  .entered{margin-top:6px;background:linear-gradient(90deg,#4a3410,#2b254f);border-radius:9px;padding:6px 9px;font-size:12px;color:var(--text);line-height:1.4}
  .rtag{font-size:9.5px;font-weight:900;background:var(--gold);color:#2a1400;padding:1px 6px;border-radius:99px;letter-spacing:.3px}
  .hrow{display:flex;gap:9px;align-items:center}
  .por{width:66px;height:52px;flex:none;border-radius:10px;background:linear-gradient(#3a6a3a,#2a5a2a);display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative}
  .d-sprint{background:linear-gradient(#e0603a,#8a2a1a)!important} .d-mile{background:linear-gradient(#4a86e0,#1e3f86)!important} .d-long{background:linear-gradient(#46a85a,#1e5a2a)!important}
  .por .dt{position:absolute;left:3px;top:2px;font-size:11px;line-height:1;filter:drop-shadow(0 1px 1px #000)}
  .pimg{display:inline-grid;place-items:center;border-radius:9px;flex:none;position:relative;overflow:hidden}
  .pimg img{image-rendering:pixelated}
  .pimg .dt{position:absolute;left:3px;top:2px;font-size:10px;line-height:1;filter:drop-shadow(0 1px 1px #000)}
  .por img{width:62px;image-rendering:pixelated}
  .hinfo{flex:1;min-width:0}
  .hname{font-weight:900;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
  .hname .st{color:var(--gold);font-size:11px;letter-spacing:-1px}
  .hsub{font-size:11px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stats{display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;font-size:10.5px;font-weight:800;color:var(--dim);margin-top:4px}
  .sb{position:relative;height:7px;background:#0d0a1e;border-radius:9px;overflow:hidden}
  .sb i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
  .sb i.pot{background:#ffffff22}
  .sb i.cur{background:linear-gradient(90deg,#4ad6a0,#7dff9a)}
  .sb i.cur.sta{background:linear-gradient(90deg,#4aa0ff,#8ad0ff)}
  .sb i.cur.acc{background:linear-gradient(90deg,#ff9a3d,#ffd24a)}
  .sb i.cur.form{background:linear-gradient(90deg,#ff5d8a,#ffb0d0)}
  .plans{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .pickbox{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:7px;padding:7px 10px;border-radius:9px;background:var(--card2);color:var(--text);font-size:13px;font-weight:800;text-align:left}
  .pickbox .cb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;border:2px solid var(--dim);font-size:14px;font-weight:900;color:#2a1400}
  .pickbox.on{background:#2f4a2a}.pickbox.on .cb{background:#7dff9a;border-color:#7dff9a}
  .horse.picked{outline:2px solid #7dff9a}
  .sellbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#1d3a24;border:2px solid #7dff9a;border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:13px;box-shadow:0 4px 14px #0008}
  .sellbar span{flex:1;min-width:150px}.sellbar button{padding:7px 11px;border-radius:9px;font-weight:900;font-size:12px;background:var(--card);color:var(--text)}
  .sellbar button.go{background:#7dff9a;color:#10301a}.sellbar button:disabled{opacity:.4}
  .plans button{background:var(--card);padding:5px 8px;border-radius:8px;font-size:11px;font-weight:800;color:var(--dim)}
  .plans button.on{background:var(--accent);color:#2a1400}
  .plans .note{font-size:11px;color:var(--dim);font-weight:700;padding:4px 2px}
  .item{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:7px}
  .item.done{opacity:.5}
  .item .ic{font-size:24px;width:42px;height:42px;display:grid;place-items:center;background:var(--card);border-radius:10px;flex:none}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:800;font-size:14px}
  .item .ds{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.35}
  .sbtn{flex:none;padding:8px 10px;border-radius:10px;background:var(--card);font-size:12px;font-weight:800;min-width:74px;line-height:1.25;color:var(--dim)}
  .sbtn.can{background:linear-gradient(135deg,#ffd24a,#ff9a3d);color:#2a1400}
  .sbtn.on{background:var(--good);color:#06240f}
  .card{background:var(--panel);border-radius:14px;padding:13px;margin-bottom:8px;font-size:13px;line-height:1.5;color:var(--dim)}
  .card h3{margin:0 0 6px;color:var(--text);font-size:15px}
  .card b{color:var(--text)}
  .sec{font-size:11px;font-weight:900;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin:12px 2px 6px;display:flex;justify-content:space-between;align-items:center}
  .stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .stat:last-child{border:0}
  .stat b{color:var(--text)}
  .race{background:var(--panel);border-radius:12px;padding:9px 10px;margin-bottom:6px;font-size:12px;color:var(--dim)}
  .race b{color:var(--text);font-size:13px}
  .race.big{border:1px solid var(--gold);background:linear-gradient(135deg,#3a2a10,#2a1c40)}
  .race.crown,.pick button.crown,.entered.crown{border:2px solid #ffd54a;background:linear-gradient(135deg,#5a1f7a,#7a4a0a 55%,#5a1f7a);box-shadow:0 0 14px #ffc83c80,inset 0 0 10px #ffd54a33;animation:tcglow 2.4s ease-in-out infinite}
  @keyframes tcglow{50%{box-shadow:0 0 22px #ffc83ccc,inset 0 0 14px #ffd54a55}}
  .tcwin{text-align:center;margin:6px 0 10px;padding:14px 10px;border-radius:14px;border:2px solid #ffd54a;background:radial-gradient(circle at 50% 30%,#8a5a10,#4a1a6a 70%);box-shadow:0 0 24px #ffc83caa;animation:tcglow 2.4s ease-in-out infinite}
  .tcwin h3{margin:6px 0 2px;font-size:20px;letter-spacing:1.5px;color:#ffe27a;text-shadow:0 2px 0 #0008}
  .tcwin .big{font-size:22px;font-weight:900;color:#fff}
  .tcwin .legs{margin-top:8px;font-size:12px;color:#ffe9b0;line-height:1.7}
  .tc{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.8px;padding:2px 7px;border-radius:99px;background:linear-gradient(90deg,#ffe27a,#f5a623);color:#3a1600;margin-right:4px;vertical-align:1px;white-space:nowrap}
  .tag{display:inline-block;font-size:10px;font-weight:900;padding:1px 6px;border-radius:99px;background:var(--card2);color:var(--text);margin-left:4px}
  .tag.win{background:var(--gold);color:#2a1400}
  .tag.bad{background:var(--bad)}
  #modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}
  #modal[hidden]{display:none}
  #modalBox{background:var(--panel);border-radius:18px;padding:18px;max-width:380px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;border:1px solid var(--line)}
  #modalBox h2{margin:0 0 8px;font-size:20px}
  #modalBox p{color:var(--dim);font-size:14px;line-height:1.5;margin:6px 0}
  .btn{display:block;width:100%;margin-top:9px;padding:12px;border-radius:12px;font-weight:900;font-size:15px;background:linear-gradient(135deg,#ffb347,#ff5d8a);color:#fff}
  .btn.ghost{background:var(--card);color:var(--text)}
  .btn.danger{background:#5a2333;color:#ffd0d8}
  .btn:disabled{opacity:.4}
  .ledger{text-align:left;font-size:13px;margin:8px 0}
  .ledger div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .pick{display:flex;flex-direction:column;gap:6px;margin-top:8px;text-align:left}
  .pick button{background:var(--card);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:700;text-align:left;color:var(--text)}
  .pick button small{display:block;color:var(--dim);font-weight:600;font-size:11.5px;margin-top:2px}
  .pick button.on{outline:2px solid var(--accent)}
  .swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;display:inline-block;margin:3px}
  .swatch.on{border-color:#fff}
  @media (min-width:900px){ /* desktop: race view top-left, controls beside it, cards side by side below */
    #app{max-width:1800px;display:grid;grid-template-columns:minmax(0,min(56vw,820px)) minmax(0,1fr);grid-template-rows:auto auto auto auto;
      grid-template-areas:"top top" "scene end" "scene tabs" "panel panel";column-gap:18px;padding:0 18px 10px;height:auto;min-height:100vh} /* the whole page scrolls: the ranch scrolls away, horses get the screen */
    html,body{height:auto}
    #top{grid-area:top;position:sticky;top:0;z-index:15;background:var(--bg);padding:10px 0 8px;box-shadow:0 6px 12px -8px #0008} #sceneWrap{grid-area:scene;margin:0;align-self:start}
    #endRow{grid-area:end;padding:4px 0;align-self:start;flex-direction:column;align-items:stretch;gap:10px}
    #endRow #planSum{font-size:14px;background:var(--panel);border-radius:12px;padding:12px 14px;line-height:1.55}
    #glance{display:block!important}
    body.scrolled #endBtn2{display:inline-block} /* End Month stays reachable in the pinned top bar */
    #endBtn{font-size:19px;padding:15px 22px}
    #tabs{grid-area:tabs;padding:0 0 4px;align-self:end;gap:6px}
    #tabs button{font-size:12px;padding:9px 2px} #tabs button b{font-size:21px}
    #panel{grid-area:panel;min-height:0;overflow:visible;padding:10px 2px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:0 12px;align-content:start;align-items:start}
    #panel > .sec, #panel > .card, #panel > p{grid-column:1 / -1}
    #panel > .horse, #panel > .item, #panel > .race{margin-bottom:12px}
    .chip{font-size:14px;padding:6px 12px} #cash{font-size:17px}
  }
  #toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-130%);background:#0c0a1cee;color:#fff;padding:9px 16px;border-radius:999px;font-weight:800;font-size:13px;transition:transform .25s;z-index:30;max-width:92%;text-align:center;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="chip" id="cash">$0</span><span class="chip" id="fame">⭐ 0</span><span class="chip" id="rank">🏆 #6</span><span class="chip" id="date">Jan, Y1</span><button class="chip" id="endBtn2" title="End Month">End Month ▶</button><button class="chip" id="menuBtn" title="Menu">⚙️</button>
  </div>
  <div id="sceneWrap"><canvas id="scene"></canvas><div id="sceneBtns"></div></div>
  <div id="endRow"><div id="planSum"></div><button id="endBtn">End Month ▶</button><div id="glance"></div></div>
  <nav id="tabs">
    <button data-tab="stable"><b>🐎</b>Stable<i class="dot"></i></button>
    <button data-tab="nursery"><b>🍼</b>Nursery<i class="dot"></i></button>
    <button data-tab="pasture"><b>🌾</b>Pasture<i class="dot"></i></button>
    <button data-tab="races"><b>🏁</b>Races<i class="dot"></i></button>
    <button data-tab="bets"><b>🎟️</b>Bets<i class="dot"></i></button>
    <button data-tab="breed"><b>💞</b>Breeding<i class="dot"></i></button>
    <button data-tab="market"><b>🛒</b>Market<i class="dot"></i></button>
    <button data-tab="ranch"><b>🏗️</b>Ranch<i class="dot"></i></button>
    <button data-tab="ranks"><b>🏆</b>Rankings<i class="dot"></i></button>
  </nav>
  <div id="panel"></div>
</div>
<div id="modal" hidden><div id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
// =====================================================================
//  DERBY DYNASTY: a turn-based horse breeding & racing tycoon.
//  Every turn is one month: give each horse a plan, then End Month.
// =====================================================================
const SAVE_KEY = 'derby-dynasty-v1';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => { let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
function fmt(n){ const neg = n < 0; n = Math.abs(n); let s;
  if(n < 1000) s = String(Math.round(n)); else { let i = 0; while(n >= 1000 && i < SUF.length - 1){ n /= 1000; i++; } s = (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.round(n)) + SUF[i]; }
  return (neg ? '-' : '') + s; }
const money = n => (n < 0 ? '-$' : '$') + fmt(Math.abs(n));
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const monthName = t => MONTHS[t % 12] + ', Y' + (Math.floor(t / 12) + 1);
// racing age, like real racing: every horse officially turns a year older on January 1, whatever month it was born
const raceAge = (h, t = S.t) => Math.floor(t / 12) - Math.floor((S.t - h.age) / 12); // birth month = S.t - age; t can be a future month
function ageTxt(m){ const y = Math.floor(m / 12), mo = m % 12; return y ? `${y}y${mo ? ' ' + mo + 'm' : ''}` : `${mo}m`; }
function hash(a){ a = (a ^ 61) ^ (a >>> 16); a = a + (a << 3); a = a ^ (a >>> 4); a = Math.imul(a, 0x27d4eb2d); a = a ^ (a >>> 15); return (a >>> 0) / 4294967296; }
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
function shade(hex, k){ const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))));
  return '#' + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1); }
function mix(a, b, k){ const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const f = s => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return '#' + ((1 << 24) + (f(16) << 16) + (f(8) << 8) + f(0)).toString(16).slice(1); }

// =====================================================================
//  DATA
// =====================================================================
const COATS = [
  {id:'bay',       n:'Bay',         c:'#8a4a22', m:'#1e1410', pt:'#1e1410', w:28},
  {id:'chestnut',  n:'Chestnut',    c:'#b0602a', m:'#8a3a18', w:24},
  {id:'black',     n:'Black',       c:'#2c2832', m:'#141018', w:12},
  {id:'grey',      n:'Dapple Grey', c:'#a8a8b4', m:'#e8e8f0', w:12, dapple:true},
  {id:'palomino',  n:'Palomino',    c:'#e0b050', m:'#fff4d8', w:8},
  {id:'buckskin',  n:'Buckskin',    c:'#d8b070', m:'#1e1410', pt:'#1e1410', w:7},

function addRace(card, o){ const yr = Math.floor(S.t / 12); let k = card.length; while(card.some(r => r.id === 'r' + S.t + '_' + k)) k++; o.id = 'r' + S.t + '_' + k; o.fee = Math.max(100, Math.round(o.purse * 0.02 / 50) * 50); const tough = (o.crown ? 1.13 : o.big ? 1.10 : o.cls >= 3 ? 1.13 : o.cls === 2 ? 1.07 : o.cls === 1 ? 1.02 : 1) * (1 + 0.045 * Math.min(yr, 12)) * (o.big || o.cls >= 3 ? legendBoost() : 1); o.lo *= tough; o.hi *= tough; /* tougher fields higher up, and every year */ o.field0 = makeField(o); card.push(o); }

}

  CLS.forEach((c, ci) => { const ds = dists.slice().sort(() => Math.random() - 0.5).slice(0, ci === 6 ? 1 : 2);
    for(const d of ds) add({cls:ci, cn:c.n, n:ci < 3 ? `${c.n} ${DIST[d].n}` : `${names.pop()} ${ci === 3 ? 'Stakes' : pick(['Stakes', 'Handicap', 'Cup'])}`, dist:d, lo:c.lo, hi:c.hi, purse:c.purse, fame:c.fame, req:c.req || 0, maiden:ci === 0}); });

function makeField(race){ // the other 8 runners are known in advance, so you can study the field and bet

    const pref = q < 0.55 ? race.dist : q < 0.92 ? pick(near) : ['sprint', 'mile', 'long'].find(d => Math.abs(DORD[d] - DORD[race.dist]) === 2) || race.dist; // trainers mostly enter horses at a distance they like

    const w = S.rivals.map(r => 0.55 * Math.exp(-Math.pow(raw - r.lvl, 2) / 162)); let roll = Math.random() * (1 + w.reduce((a, b) => a + b, 0)), ri = -1;

function runnersFor(race){ return S.horses.filter(h => h.plan.t === 'race' && h.plan.r === race.id && canRace(h)); }
function eligible(h, race){

  if(race.age3 && raceAge(h) !== 3) return '3-year-olds only (racing age)';
  if(race.age2 && raceAge(h) !== 2) return '2-year-olds only (racing age)';
  if(race.sex === 'F' && h.sex !== 'F') return 'Fillies & mares only';
  if(race.vet && raceAge(h) < 7) return 'Ages 7+ only (racing age)';

}
function oddsTxt(h, race){ const r = rating(h, race.dist), mid = (race.lo + race.hi) / 2;
  return r >= race.hi ? ['Favorite', 'pos'] : r >= mid + 3 ? ['Strong chance', 'pos'] : r >= mid - 3 ? ['Contender', ''] : r >= race.lo ? ['Long shot', 'neg'] : ['Outclassed', 'neg']; }

}
function runRace(race){

const tcWinner = h => (h.crown || []).some(c => c.startsWith('3@') && h.crown.includes('1@' + c.slice(2)) && h.crown.includes('2@' + c.slice(2))); // swept all three in one year

const ODDS = new Map();
function fieldOdds(race, extra){ // simulate the real race model 1000×, then take a 15% cut

        rep.notes.push(`📈 Classic winner: ${h.name}'s ${h.sex === 'M' ? `stud fee is now <b>${money(studFee(h))}</b>/mare` : `value is now <b>${money(value(h))}</b>`}.`); }
      if(race.crown && f.place > 1){ const yr = Math.floor(S.t / 12); if(race.crown > 1 && [...Array(race.crown - 1)].every((_, i) => h.crown.includes((i + 1) + '@' + yr))) rep.notes.push(`💔 ${h.name} finished ${ord(f.place)} in the ${race.n}: the Triple Crown dream is over this year.`); }

      if(Math.random() < injuryRisk(h, true)){ h.inj = irand(1, 3); fresh.add(h); rep.notes.push(`🤕 ${h.name} came back sore: out ${h.inj} month${h.inj > 1 ? 's' : ''}.`); }

  S.bets = [];
  // ---- training / rest / stud ----

  for(const h of S.horses){

    if(p.t === 'train' && h.age >= 6){

  }

    if(!sire){ if(h.rebreed){ h.rebreed = false; rep.notes.push(`🔁 ${h.name}: ${h.plan.sn} is no longer available, so continuous breeding stopped.`); } h.plan = {t:'rest'}; continue; }

  // ---- rivals ----
  // ---- advance ----

function snapshot(h){ return {name:h.name, breed:h.breed, pot:{...h.pot}, coat:h.coat, mark:h.mark, socks:h.socks, id:h.id, pref:h.pref}; }
function injuryRisk(h, racing){ const base = racing ? 0.05 : 0.015; return base * (h.form < 40 ? 2.5 : h.form < 60 ? 1.4 : 1) * (h.age > 96 ? 1.6 : 1) * Math.max(0.2, 1 - 0.08 * S.fac.vet); }
// ---- big race & Triple Crown notices ----
const CROWN = FEATURES.filter(f => f.crown).sort((a, b) => a.crown - b.crown); // Derby (May), Royal Stakes (Jun), Crown Classic (Jul)
function crownWatch(){ // your horses chasing the Triple Crown this year
  const yr = Math.floor(S.t / 12), m = S.t % 12;
  return S.horses.map(h => ({h, won:CROWN.filter(c => h.crown.includes(c.crown + '@' + yr))})).filter(x => x.won.length && x.won.length < 3)
    .map(({h, won}) => { const next = CROWN[won.length], alive = won.every((c, i) => c.crown === i + 1) && next && next.m >= m;
      return alive ? `👑 <b>${h.name}</b> has won ${won.length} of 3 Triple Crown races. Next: <b>${next.n}</b> (${MONTHS[next.m]}${next.m === m ? ', this month!' : ''}).` : null; }).filter(Boolean);
}
function bigNotice(){
  const m = S.t % 12, big = S.card.filter(r => r.big), nxt = FEATURES.filter(f => f.m === (m + 1) % 12);
  return `<div class="card" style="text-align:left;margin-top:8px;border:1px solid var(--gold)"><h3>📣 Big races in ${monthName(S.t)}</h3>${big.map(r => { const n = S.horses.filter(h => !eligible(h, r)).length;
      return `${r.crown ? `<b>${RN(r)}</b>` : `👑 <b>${r.n}</b>`} · ${DIST[r.dist].n} · ${money(r.purse)}${r.age3 ? ' · 3yo' : r.age2 ? ' · 2yo' : r.sex ? ' · fillies & mares' : r.vet ? ' · 7+' : ''} · <span class="${n ? 'pos' : 'neg'}">${n ? `${n} of yours can enter` : (r.req && S.fame < r.req ? `needs ⭐ ${r.req}` : 'none of yours eligible')}</span>`; }).join('<br>')}
    ${crownWatch().map(x => `<br>${x}`).join('')}
    ${nxt.length ? `<br><span style="opacity:.85">🔜 Next month: ${nxt.map(f => `<b>${f.n}</b>${f.crown ? ` (Triple Crown ${f.crown}/3${f.age3 ? ', 3-year-olds' : ''})` : f.age3 ? ' (3-year-olds)' : f.age2 ? ' (2-year-olds)' : ''}`).join(', ')}: rest your runners so they're in top form.</span>` : ''}</div>`;
}
const mutChance = (l = S.fac.barn) => 0.10 + 0.04 * l; // per stat: 10% → 50% at barn level 10
function foal(dam, sire){
  const mut = mutChance(), pot = {};

  const legend = legendPair(dam, sire), cap = legend ? LEGEND_CAP : POT_CAP;
  for(const s of STATS){ let v = (dam.pot[s] + sire.pot[s]) / 2 * rand(0.95, 1.08) + gauss() * 2.5;
    if(Math.random() < mut){ v += rand(6, 14); prodigy = true; } pot[s] = Math.round(clamp(v, 10, cap)); }
  const coat = Math.random() < 0.06 + 0.01 * S.fac.barn ? randCoat(true) : Math.random() < 0.5 ? dam.coat : sire.coat;
  let better = avgPot(dam) >= avgPot({pot:sire.pot}) ? dam.breed : sire.breed;
  if(legend) better = 'legend'; else if(better === 'legend') better = dam.breed === 'legend' ? sire.breed : dam.breed; // a Legend needs both parents at 150 in the same stat
  const h = newHorse({breed:better, age:0, pot:[pot.spd, pot.sta, pot.acc]});
  h.pref = Math.random() < 0.1 ? pick(['sprint', 'mile', 'long']) : Math.random() < 0.5 ? (dam.pref || 'mile') : (sire.pref || 'mile');
  Object.assign(h, {coat, mark:Math.random() < 0.5 ? dam.mark : sire.mark, socks:Math.random() < 0.5 ? dam.socks : sire.socks, gen:(dam.gen || 0) + 1, dam:dam.name, sire:sire.name, plan:{t:'rest'}, prodigy});
  for(const s of STATS) h.st[s] = Math.round(h.pot[s] * 0.18);
  S.horses.push(h); S.stats.foals++;
  goal('foal1'); if(grade(h) >= 4) goal('foal4'); if(COAT[h.coat].rare) goal('rare');
  return h;
}
function yearSummary(){
  const yr = Math.floor((S.t - 1) / 12) + 1, me = {n:'You', earn:S.yearEarn, wins:S.yearWins || 0, me:true};
  const table = [...S.rivals.map(r => ({n:r.n, earn:r.earn, wins:r.wins || 0})), me].sort((a, b) => b.earn - a.earn);
  const pos = table.findIndex(x => x.me) + 1, bonus = pos === 1 ? 500000 : pos === 2 ? 150000 : pos === 3 ? 50000 : 0;
  if(bonus){ S.cash += bonus; } if(pos === 1) goal('champ');
  const hoty = S.horses.slice().sort((a, b) => (b.earned - (b._ye || 0)) - (a.earned - (a._ye || 0)))[0];
  for(const h of S.horses) h._ye = h.earned;
  S.lastYear = {yr, table, pos};
  for(const r of S.rivals){ r.earn = 0; r.wins = 0; r.lvl += irand(3, 5); } S.yearEarn = 0; S.yearWins = 0;

const GEM_ODDS = 0.35, JACKPOT_ODDS = 0.05; // mystery yearling: 35% gem, 5% of gems are a jackpot (one stat at 150)
function makeEvent(){
  const hs = S.horses.filter(h => isAdult(h)), h = hs.length ? pick(hs) : null, y = Math.pow(1.4, Math.floor(S.t / 12));
  const E = [
    () => h && {t:`💼 A buyer wants ${h.name}`, d:`An oil baron offers <b>${money(Math.round(value(h) * 1.5))}</b> for ${h.name} (worth about ${money(value(h))}).`, h:h.id, offer:Math.round(value(h) * 1.5), choices:[['Sell!', 'sell'], ['Not for sale', 'no']]},
    () => ({t:'📰 Magazine feature', d:'Racing Weekly profiles your stable. Fans love it.', fx:'fame', v:irand(5, 15) + Math.floor(S.fame * 0.05), choices:[['Great', 'ok']]}),
    () => ({t:'🌧️ Storm damage', d:`A storm wrecked the fences. Repairs cost <b>${money(Math.round(3000 * y))}</b>.`, fx:'cash', v:-Math.round(3000 * y), choices:[['Pay up', 'ok']]}),
    () => ({t:'🤝 Sponsorship deal', d:`A feed company wants your silks on their ads: <b>${money(Math.round(8000 * y + S.fame * 40))}</b>.`, fx:'cash', v:Math.round(8000 * y + S.fame * 40), choices:[['Sign it', 'ok']]}),
    () => h && {t:'🍀 Good spirits', d:`${h.name} is full of energy this month (form maxed).`, fx:'form', h:h.id, choices:[['Nice', 'ok']]},
    () => h && {t:'🧑‍🏫 Famous trainer visits', d:`A legendary trainer offers a private session with ${h.name} for <b>${money(Math.round(5000 * y))}</b>: +4 to every stat (up to potential).`, h:h.id, cost:Math.round(5000 * y), choices:[['Book it', 'train'], ['No thanks', 'no']]},
    () => ({t:'🎰 Mystery yearling', d:`A shady dealer offers a yearling "with royal blood" for <b>${money(Math.round(12000 * y))}</b>. Could be a gem… or a dud.<br><small style="color:var(--dim)">💎 Gem 35%: Akhal-Teke or Thoroughbred, close to your best horses' level · 🌟 Jackpot ${Math.round(GEM_ODDS * JACKPOT_ODDS * 1000) / 10}%: a gem with a 150 stat · 🥔 Dud 65%: Mustang or Quarter Horse</small>`, cost:Math.round(12000 * y), choices:[['Gamble', 'mystery'], ['Walk away', 'no']]}),
    () => ({t:'🌾 Hay shortage', d:`Feed prices spike: <b>${money(Math.round(250 * S.horses.length * y))}</b> extra this month.`, fx:'cash', v:-Math.round(250 * S.horses.length * y), choices:[['Ouch', 'ok']]}),
    () => h && {t:'🎥 Film crew', d:`A movie studio wants to film ${h.name} for <b>${money(Math.round(4000 * y))}</b>, but filming tires them out (form −30).`, h:h.id, v:Math.round(4000 * y), choices:[['Lights, camera!', 'film'], ['No thanks', 'no']]},
    () => ({t:'🏆 Charity gala', d:`Donate <b>${money(Math.round(6000 * y))}</b> to the retired racehorse charity for +${irand(15, 30)} fame?`, cost:Math.round(6000 * y), v:irand(15, 30), choices:[['Donate', 'donate'], ['Skip', 'no']]}),
  ];
  for(let k = 0; k < 10; k++){ const e = pick(E)(); if(e) return e; }
  return null;
}
function showEvent(){
  const e = S.pending; if(!e){ return; }
  showModal(`<h2>${e.t}</h2><p>${e.d}</p>${e.choices.map(([l, a]) => `<button class="btn ${a === 'no' ? 'ghost' : ''}" data-ev="${a}">${l}</button>`).join('')}`);
}
function resolveEvent(a){
  const e = S.pending; if(!e) return; const h = e.h && S.horses.find(x => x.id === e.h);
  if(e.cost && a !== 'no' && S.cash < e.cost){ toast('💸 Not enough cash'); return; }
  if(a === 'mystery' && usedStalls() >= capacity()){ stablesFull('No free stall for the yearling'); return; }
  S.pending = null; $('modal').hidden = true;
  if(a === 'ok'){ if(e.fx === 'cash') S.cash += e.v; if(e.fx === 'fame') S.fame += e.v; if(e.fx === 'form' && h) h.form = 100; }
  if(a === 'sell' && h){ S.cash += e.offer; S.horses = S.horses.filter(x => x !== h); S.stats.sold++; toast(`💰 Sold ${h.name} for ${money(e.offer)}`); }
  if(a === 'train' && h){ S.cash -= e.cost; for(const s of STATS) h.st[s] = Math.min(h.pot[s], h.st[s] + 4); toast(`📈 ${h.name} +4 all stats`); }
  if(a === 'mystery'){ S.cash -= e.cost;
    const gem = Math.random() < GEM_ODDS, jackpot = gem && Math.random() < JACKPOT_ODDS, b = gem ? (Math.random() < 0.4 ? 'akhal' : 'thoroughbred') : pick(['mustang', 'quarter']);
    const nh = newHorse({breed:b, age:irand(12, 18)});
    if(gem){ const best = Math.min(POT_CAP, Math.max(0, ...S.horses.filter(x => x.breed !== 'legend').map(avgPot))); // gems keep up with your stable
      for(const s of STATS) nh.pot[s] = Math.min(POT_CAP, Math.max(Math.round(nh.pot[s] * 1.12), Math.round(best * rand(0.8, 0.95))));
      if(jackpot) nh.pot[pick(STATS)] = POT_CAP;
      for(const s of STATS) nh.st[s] = Math.min(nh.st[s], nh.pot[s]); }
    S.horses.push(nh);
    showModal(`<h2>${jackpot ? '🌟 JACKPOT!' : gem ? '💎 A gem!' : '🥔 A dud…'}</h2><p>You got <b>${nh.name}</b>, a ${BREEDS[b].n} (${stars(grade(nh))}).</p><p>Potential ${nh.pot.spd}/${nh.pot.sta}/${nh.pot.acc}${jackpot ? '<br><b style="color:#d6a8ff">A 150 stat: Legend breeding material!</b>' : ''}</p><button class="btn" data-close>OK</button>`); }
  if(a === 'film' && h){ S.cash += e.v; h.form = clamp(h.form - 30, 0, 100); }
  if(a === 'donate'){ S.cash -= e.cost; S.fame += e.v; }
  persist(); renderPanel();
}

//  PIXEL SPRITES (horses drawn once per pose, cached, upscaled crisp)
// =====================================================================
const SPR = new Map(), OLS = '#1a1028', PO = [26, 16, 40];
function sprite(key, sc, box, draw){
  let s = SPR.get(key); if(s) return s;
  if(SPR.size > 900) SPR.clear();
  const [x0, y0, x1, y1] = box, ox = Math.round(2 - x0 * sc), oy = Math.round(2 - y0 * sc);
  const w = Math.ceil((x1 - x0) * sc) + 4, h = Math.ceil((y1 - y0) * sc) + 4;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', {willReadFrequently:true});
  g.setTransform(sc, 0, 0, sc, ox, oy); g.lineJoin = 'round'; g.lineCap = 'round'; g.lineWidth = 0.95 / sc; g.strokeStyle = OLS;
  draw(g);
  const d = g.getImageData(0, 0, w, h), a = d.data;
  for(let i = 0; i < a.length; i += 4){ if(a[i+3] > 100){ a[i+3] = 255; for(let k = 0; k < 3; k++) a[i+k] = Math.min(255, Math.round(a[i+k] / 16) * 16); } else a[i+3] = 0; }
  const o = new Uint8Array(w * h);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){ const i = y * w + x; if(a[i*4+3]) continue;
    if((x > 0 && a[i*4-1]) || (x < w-1 && a[i*4+7]) || (y > 0 && a[(i-w)*4+3]) || (y < h-1 && a[(i+w)*4+3])) o[i] = 1; }
  for(let i = 0; i < w * h; i++) if(o[i]){ a[i*4] = PO[0]; a[i*4+1] = PO[1]; a[i*4+2] = PO[2]; a[i*4+3] = 255; }
  g.putImageData(d, 0, 0);

function drawRaceOverlay(){

    cg.font = '900 11px system-ui'; cg.strokeText('▼ ' + f.name, x, y); cg.fillStyle = '#ffd24a'; cg.fillText('▼ ' + f.name, x, y); }

    cg.textAlign = 'center'; cg.fillStyle = '#ffd24a'; cg.font = '900 15px system-ui'; cg.fillText(`👑 TRIPLE CROWN · RACE ${race.crown} OF 3 👑`, CW / 2, by3 + 18);
    cg.fillStyle = '#fff'; cg.font = '800 11px system-ui'; cg.fillText(race.crown === 3 ? 'The final leg: $5M bonus for a sweep!' : `${race.n}: win all three for a $5M bonus`, CW / 2, by3 + 33);
    cg.textAlign = 'left'; cg.font = '900 11px system-ui'; cg.lineWidth = 3; cg.strokeStyle = 'rgba(0,0,0,.75)'; }
  if(P.res.bets && !P.done){ const bt = '🎟️ ' + P.res.bets.map(b => `${money(b.amt)} ${BET_T[b.t].n} @ ${xs(b.x)}`).join(', '); cg.textAlign = 'right'; cg.strokeText(bt, CW - 8, 38); cg.fillStyle = '#ffd24a'; cg.fillText(bt, CW - 8, 38); cg.textAlign = 'left'; cg.fillStyle = '#fff'; }
  const bw = CW - 16; cg.fillStyle = 'rgba(0,0,0,.45)'; cg.fillRect(8, 20, bw, 6);
  for(const f of P.field){ const p = Math.min(1, posOf(f, t)); cg.fillStyle = f.mine ? '#ffd24a' : f.silk; cg.fillRect(8 + p * (bw - 6), 19, 6, 8); }
  if(P.t < 0){ cg.textAlign = 'center'; cg.font = '900 22px system-ui'; const s = P.t < -0.8 ? 'Ready…' : 'And they\'re off!'; const ry = CH * (race.crown ? 0.62 : 0.45); cg.strokeText(s, CW / 2, ry); cg.fillStyle = '#fff'; cg.fillText(s, CW / 2, ry); }
  else if(!P.done){ // commentary

    cg.font = '800 11px system-ui'; cg.textAlign = 'left'; cg.strokeText(line, 8, CH - 10); cg.fillStyle = '#fff'; cg.fillText(line, 8, CH - 10);
  } else { // results board
    const bx = CW * 0.12, by = CH * 0.16, bw2 = CW * 0.76, bh = CH * 0.7;

      cg.fillText(`${i + 1}. ${f.name}${f.mine ? ' ★' : ''}`, bx + 10, y); cg.textAlign = 'right'; cg.fillText(f.prize ? money(f.prize) : '', bx + bw2 - 10, y); cg.textAlign = 'left'; });

  if(d.sellconfirm){ const hs = S.horses.filter(h => R.sell && R.sell.has(h.id)); if(!hs.length) return; const tot = hs.reduce((a, h) => a + sellPrice(h), 0);
    showModal(`<h2>💰 Sell ${hs.length} horse${hs.length > 1 ? 's' : ''}?</h2><div class="ledger">${hs.map(h => `<div><span>${h.sex === 'M' ? '♂' : '♀'} ${h.name} <small style="color:var(--dim)">${ageTxt(h.age)}</small></span><b class="pos">${sellPrice(h) ? money(sellPrice(h)) : 'rehome'}</b></div>`).join('')}<div><span><b>Total</b></span><b class="pos">${money(tot)}</b></div></div>
      <p>This can't be undone. Any bets on them are refunded.</p><button class="btn" data-sellall="1">✅ Confirm sale</button><button class="btn ghost" data-close>Go back</button>`); return; }
  if(d.sellall){ const hs = S.horses.filter(h => R.sell && R.sell.has(h.id)); let tot = 0;
    for(const h of hs){ refundBets(h); freeMares(h); const v = sellPrice(h); tot += v; S.cash += v; if(!v) S.fame += 1; S.stats.sold++; S.horses = S.horses.filter(x => x !== h); }
    R.sell = null; $('modal').hidden = true; toast(`💰 Sold ${hs.length} horse${hs.length > 1 ? 's' : ''} for ${money(tot)}`); persist(); renderPanel(); return; }
  if(d.sell){ const h = S.horses.find(x => x.id === +d.sell); if(!h) return;
    const v = sellPrice(h), up = Math.round(UPKEEP * (1 - 0.05 * S.fac.pasture));
    showModal(v ? `<h2>Sell ${h.name}?</h2><p>You'll get <b>${money(v)}</b>${h.age >= 144 ? (breedable(h) ? ' as breeding stock' : '') : ''} and save ${money(up)}/month upkeep.</p><button class="btn" data-sellyes="${h.id}">Sell</button><button class="btn ghost" data-close>Keep</button>`
      : `<h2>🏡 Rehome ${h.name}?</h2><p>${h.name} is past racing and breeding, so nobody will pay for them. A retirement farm will give them a happy home for free.</p><p>You save <b>${money(up)}/month</b> upkeep and gain +1 ⭐.</p><button class="btn" data-sellyes="${h.id}">Rehome</button><button class="btn ghost" data-close>Keep</button>`); return; }
  if(d.sellyes){ const h = S.horses.find(x => x.id === +d.sellyes); if(!h) return; refundBets(h); freeMares(h); const v = sellPrice(h); S.cash += v; S.horses = S.horses.filter(x => x !== h); S.stats.sold++;
    if(!v) S.fame += 1; $('modal').hidden = true; toast(v ? `💰 Sold ${h.name} for ${money(v)}` : `🏡 ${h.name} went to a retirement farm. Happy trails!`); persist(); renderPanel(); return; }
  if(d.retire){ const h = S.horses.find(x => x.id === +d.retire); if(!h) return; refundBets(h); freeMares(h); S.hall.push({name:h.name, coat:h.coat, mark:h.mark, socks:h.socks, age:h.age, wins:h.wins, earned:h.earned, gw:h.gw});
    S.horses = S.horses.filter(x => x !== h); S.fame += 10 + h.wins * 2; $('modal').hidden = true; toast(`🏅 ${h.name} enters the Hall of Fame! +${10 + h.wins * 2} ⭐`); persist(); renderPanel(); return; }
  if(d.retstud){ const h = S.horses.find(x => x.id === +d.retstud); if(!h) return;
    showModal(`${pimg(h, 110)}<h2>🎓 Retire ${h.name} to stud?</h2><p>He stops racing for good and stands at stud every month automatically (<b>${money(studFee(h))}</b>/mare now). He moves to the stud barn, so he no longer uses a stall, and your mares can still use him as a sire.</p><p style="color:var(--gold)">⚠️ This can't be undone.</p><button class="btn" data-retstudyes="${h.id}">🎓 Retire to stud</button><button class="btn ghost" data-close>Keep racing</button>`); return; }
  if(d.retstudyes){ const h = S.horses.find(x => x.id === +d.retstudyes); if(!h) return; refundBets(h); h.retired = true; h.plan = {t:'stud'}; $('modal').hidden = true; toast(`🎓 ${h.name} retired to stud`); persist(); renderPanel(); return; }
  if(d.doc){ const h = S.horses.find(x => x.id === +d.doc); if(!h || !h.inj || h.doc) return; if(R.freeze){ toast('🏁 Finish watching the races first (or tap Skip)'); return; }
    const c = docCost(h); if(S.cash < c){ toast('💸 Not enough cash'); return; }
    showModal(`<h2>🩺 Call the doctor for ${h.name}?</h2><p>The doctor fixes the injury today, so ${h.name} can train, race or breed this month instead of resting ${h.inj} more month${h.inj > 1 ? 's' : ''}.</p><p>Cost <b>${money(c)}</b><br><small style="color:var(--dim)">Price depends on the months left, the horse's potential and its stud value.</small></p><p style="color:var(--gold)">⚠️ Each horse can see the doctor only <b>once</b> in its life.</p><button class="btn" data-docyes="${h.id}">🩺 Pay ${money(c)}</button><button class="btn ghost" data-close>Not now</button>`); return; }
  if(d.docyes){ const h = S.horses.find(x => x.id === +d.docyes); if(!h || !h.inj || h.doc) return; const c = docCost(h); if(S.cash < c) return;
    S.cash -= c; h.inj = 0; h.doc = true; h.plan = canRace(h) ? {t:'train', f:'bal'} : {t:'rest'}; $('modal').hidden = true; toast(`🩺 ${h.name} is fit again! (−${money(c)})`); persist(); updateTop(); renderPanel(); return; }
  if(d.edit){ const h = S.horses.find(x => x.id === +d.edit); if(h) editHorse(h); return; }
  if(d.ed){ const h = S.horses.find(x => x.id === +d.h); if(h) doEdit(h, d.ed, d.v); return; }
  if(d.fac){ const f = FAC.find(x => x.id === d.fac), l = S.fac[f.id], c = facCost(f, l); if(S.cash < c){ toast('💸 Need ' + money(c)); return; }
    S.cash -= c; S.fac[f.id]++; toast(`${f.icon} ${f.n} upgraded to Lv ${S.fac[f.id]}!`); persist(); renderPanel(); return; }
  if(d.silk){ S.silk = +d.silk; SPR.clear(); persist(); renderPanel(); return; }
  if(d.sort){ S.sortBy = d.sort; persist(); renderPanel(); return; }
  if(d.nsort){ S.nSort = d.nsort; persist(); renderPanel(); return; }
  if(d.nfilter){ S.nFilter = d.nfilter; persist(); renderPanel(); return; }
  if(d.filter){ const a = activeFilters(); S.filters = d.filter === 'all' ? [] : a.includes(d.filter) ? a.filter(x => x !== d.filter) : [...a, d.filter]; delete S.filterBy; persist(); renderPanel(); return; }
  if(d.mv){ const L = stableList(), i = L.findIndex(x => x.id === +d.mv), j = i + +d.dir; if(i < 0 || j < 0 || j >= L.length) return;
    const a = S.horses.indexOf(L[i]), b = S.horses.indexOf(L[j]); [S.horses[a], S.horses[b]] = [S.horses[b], S.horses[a]]; persist(); renderPanel(); return; }
  if(d.silk2){ S.silk2 = +d.silk2; SPR.clear(); persist(); renderPanel(); return; }
  if(d.silkpat){ S.silkPat = d.silkpat; SPR.clear(); persist(); renderPanel(); return; }
  if(t.id === 'menuBtn'){ showModal(`<h2>⚙️ Menu</h2><p>${monthName(S.t)} · net worth ${money(netWorth())}</p>
    <button class="btn ghost" id="howBtn">❓ How to play</button><button class="btn ghost" id="xferBtn">💾 Move save to another device</button>${S.rewound ? '' : '<button class="btn ghost" id="rewBtn">⏪ Go back to May (one time)</button>'}<button class="btn danger" id="wipeBtn">🔄 New game (reset)</button><button class="btn" data-close>Back to the ranch</button>`); return; }
  if(t.id === 'howBtn'){ showModal(HOWTO); return; }
  if(t.id === 'rewBtn'){ const k = (S.t % 12 - 4 + 12) % 12; if(!k){ toast("📅 It's already May"); return; }
    showModal(`<h2>⏪ Go back to May?</h2><p style="text-align:left">A one-time rewind for the racing-age update. The calendar goes back <b>${k} month${k > 1 ? 's' : ''}</b> to <b>${monthName(S.t - k)}</b> and every horse gets ${k} month${k > 1 ? 's' : ''} younger, so you can run the Triple Crown again under the new rules.<br><br>You keep your money, fame, wins and foals. This year's Triple Crown results are cleared, and open bets are refunded.</p><p style="color:var(--gold)">⚠️ You can only do this once.</p><button class="btn" id="rewYes">⏪ Go back to May</button><button class="btn ghost" data-close>Cancel</button>`); return; }
  if(t.id === 'rewYes'){ const k = (S.t % 12 - 4 + 12) % 12; if(!k || S.rewound) return;
    for(const b of S.bets || []) S.cash += b.amt; S.bets = []; S.pending = null;
    S.t -= k; const yr = Math.floor(S.t / 12);
    for(const h of S.horses){ h.age = Math.max(0, h.age - k); h.crown = (h.crown || []).filter(c => !c.endsWith('@' + yr)); if(h.plan.t === 'race') h.plan = canRace(h) ? {t:'train', f:'bal'} : {t:'rest'}; }
    S.rewound = true; makeCard(); refreshMarket(); refreshStuds(); autoStud(); persist(); $('modal').hidden = true; R.walkers = []; updateTop(); renderPanel(); toast(`⏪ Back to ${monthName(S.t)}! Good luck in the Triple Crown`); return; }
  if(t.id === 'xferBtn'){ persist(); showModal(`<h2>💾 Move your save</h2><p style="text-align:left">Your game is saved in this browser only. To play on another device:<br>1. Here: <b>copy the save code</b> (or save it as a file) and send it to yourself (text, email, notes…).<br>2. On the other device: open Derby Dynasty → ⚙️ → 💾 → paste the code (or open the file) → <b>Load</b>.</p>
    <div class="sec">📤 From this device</div><button class="btn" id="xCopy">📋 Copy save code</button>${navigator.share ? '<button class="btn ghost" id="xShare">📨 Share save code…</button>' : ''}<button class="btn ghost" id="xFile">⬇️ Save as file</button>
    <div class="sec">📥 Load a save from another device</div><textarea id="xCode" rows="3" placeholder="Paste a save code here" style="width:100%;border-radius:10px;padding:8px;background:var(--card2);color:var(--text);border:1px solid var(--line);font-size:12px"></textarea>
    <button class="btn" id="xLoad">📥 Load save code</button><label class="btn ghost" style="display:block;text-align:center;cursor:pointer">📂 Open save file<input type="file" id="xOpen" accept=".txt,.json,text/plain,application/json" hidden></label>
    <p style="font-size:11px;color:var(--dim)">⚠️ Loading replaces the game on this device.</p><button class="btn ghost" data-close>Close</button>`); return; }
  if(t.id === 'xCopy'){ saveCode().then(c => navigator.clipboard.writeText(c).then(() => toast('📋 Save code copied! Paste it on your other device.'), () => { $('xCode').value = c; $('xCode').select(); toast('Select the code in the box and copy it'); })); return; }
  if(t.id === 'xShare'){ saveCode().then(c => navigator.share({title:'Derby Dynasty save', text:c}).catch(() => {})); return; }
  if(t.id === 'xFile'){ saveCode().then(c => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], {type:'text/plain'})); a.download = `derby-dynasty-${monthName(S.t).replace(/[ ,]+/g, '-')}.txt`; document.body.appendChild(a); a.click(); a.remove(); toast('⬇️ Save file downloaded'); }); return; }
  if(t.id === 'xLoad'){ loadCode($('xCode').value); return; }
  if(t.id === 'linkYes'){ loadCode(R.linked); return; }
  if(t.id === 'linkNo'){ $('modal').hidden = true; history.replaceState(null, '', location.pathname); return; }
  if(t.id === 'wipeBtn'){ showModal(`<h2>Start over?</h2><p>This deletes your whole stable, money and progress. It can't be undone.</p><button class="btn danger" id="wipeYes">Yes, new game</button><button class="btn ghost" data-close>Cancel</button>`); return; }
  if(t.id === 'wipeYes'){ localStorage.removeItem(SAVE_KEY); freshSave(); S.seen = true; persist(); R.walkers = []; R.play = null; R.queue = []; REPORT = null; setSceneBtns(); tab = 'stable'; renderPanel(); showModal(HOWTO); toast('🔄 New game started'); return; }
  if(t.hasAttribute('data-close')){ $('modal').hidden = true; R.betWin = false; R.betHorse = null; return; }
});

const HOWTO = `<h2>🐎 Derby Dynasty</h2><p>Build a racing dynasty, one month at a time.</p>
    <p style="text-align:left">🏋️ Give each horse a <b>plan</b>: train a stat, rest, race or breed.<br>▶ Press <b>End Month</b> to see what happens: races, foals, bills and surprises.<br>💞 Build a <b>Breeding Barn</b> to breed better and better horses.<br>🏆 Beat the rival stables and win the <b>Triple Crown</b>!</p>
    <p>You start with $30K and two horses. Watch your bills!</p><button class="btn" data-close>Let's ride</button>`;
// =====================================================================
//  MAIN LOOP
// =====================================================================
let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; R.time += dt;
  if(!CW) resize();
  updateWalkers(dt); updatePlay(dt); render();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
load(); resize(); renderPanel(); linkedSave();
if(S.pending) showEvent();
if(!S.seen){ S.seen = true; persist();
  showModal(HOWTO); }
requestAnimationFrame(frame);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
