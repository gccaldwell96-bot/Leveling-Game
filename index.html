<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Power Surge">
<title>Power Surge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#120f24; --panel:#1c1836; --card:#262047; --card2:#2f2858; --line:#3a3366;
    --text:#f2eeff; --dim:#a79fcc; --gold:#ffcf4a; --soul:#9be7ff; --good:#5be38a; --bad:#ff5d73; --accent:#a77bff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  #top{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
  .res{display:flex;align-items:center;gap:6px;background:var(--panel);padding:5px 10px;border-radius:999px;font-weight:700;font-size:14px}
  #gold{color:var(--gold)} #souls{color:var(--soul)}
  #giftBtn{margin-left:auto;background:var(--panel);padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px}
  #giftBtn.ready{background:linear-gradient(135deg,#ff8a3d,#ff3d8a);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  #stagebar{display:flex;align-items:center;gap:10px;padding:0 12px 6px}
  #stageInfo{flex:1;min-width:0}
  #stageTxt{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stageSub{font-size:11px;color:var(--dim)}
  .bar{height:7px;background:#0b0918;border-radius:99px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .15s}
  #farmBtn{padding:8px 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
  #farmBtn.on{background:#21533a;color:#bfffd6}
  #farmBtn.off{background:#5a2333;color:#ffd0d8}
  #battle{position:relative;height:42vh;min-height:250px;max-height:420px;margin:0 12px;border-radius:16px;overflow:hidden;background:#000;touch-action:manipulation}
  #cv{width:100%;height:100%;display:block}
  #tapHint{position:absolute;top:8px;right:10px;font-size:11px;color:#fff;opacity:.75;pointer-events:none;text-shadow:0 1px 2px #000}
  #herobar{display:flex;align-items:center;gap:10px;padding:8px 12px 4px;font-size:13px}
  #herobar .bar{flex:1;margin:0;height:9px}
  #herobar .bar i{background:linear-gradient(90deg,#5bd1ff,#a77bff)}
  #buildTag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--card);color:var(--dim);white-space:nowrap}
  #buildTag.on{background:linear-gradient(135deg,#7a4dff,#ff4da6);color:#fff}
  #spBadge{background:var(--accent);color:#fff;font-weight:800;font-size:11px;padding:3px 8px;border-radius:99px;white-space:nowrap}
  #spBadge:empty{display:none}
  #tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 12px}
  #tabs button{background:var(--panel);padding:6px 2px;border-radius:10px;font-weight:700;font-size:10.5px;position:relative;line-height:1.25}
  #tabs button b{display:block;font-size:17px}
  #tabs button.active{background:var(--accent);color:#fff}
  #tabs button .dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
  #tabs button.alert .dot{display:block}
  #buyRow{display:flex;gap:6px;align-items:center;padding:6px 12px 0;font-size:12px;color:var(--dim)}
  #buyRow button{background:var(--panel);padding:5px 10px;border-radius:8px;font-weight:700;font-size:12px}
  #buyRow button.active{background:var(--card2);color:var(--gold)}
  #panel{flex:1;overflow-y:auto;padding:8px 12px 16px;-webkit-overflow-scrolling:touch}
  .item{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:8px;border:1px solid transparent}
  .item .ic{font-size:24px;width:42px;height:42px;display:grid;place-items:center;background:var(--card);border-radius:10px;flex:none;border:2px solid transparent;position:relative}
  .item .ic.evo{border-color:var(--gold);box-shadow:0 0 12px #ffcf4a88}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:800;font-size:14px}
  .item .nm small{color:var(--dim);font-weight:600;margin-left:4px}
  .item .ds{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.35}
  .item .ds .up{color:var(--good)} .item .ds .dn{color:var(--bad)}
  .item .ds .evo{color:var(--gold);font-weight:700}
  .item.locked{opacity:.5}
  .pips{display:flex;gap:2px;margin-top:4px}
  .pips i{flex:1;height:4px;border-radius:2px;background:var(--card2)}
  .pips i.on{background:var(--accent)}
  .pips.evo i.on{background:var(--gold)}
  .buy{background:var(--card2);border-radius:10px;padding:8px 10px;min-width:84px;text-align:center;font-weight:800;font-size:13px;line-height:1.15}
  .buy small{display:block;font-weight:600;font-size:11px;color:var(--dim)}
  .buy.can{background:linear-gradient(135deg,#3b8f5a,#2a6e44);color:#fff}
  .buy.can small{color:#d4ffe2}
  .buy.evo{background:linear-gradient(135deg,#ffb02e,#ff4d6d);color:#fff}
  .buy.evo small{color:#fff}
  .buy:disabled{cursor:default}
  .buy.max{background:var(--card);color:var(--gold)}
  .btns{display:flex;flex-direction:column;gap:5px}
  .sbtn{background:var(--card2);border-radius:9px;padding:7px 10px;font-weight:800;font-size:12px;white-space:nowrap}
  .sbtn.go{background:linear-gradient(135deg,#3b8f5a,#2a6e44);color:#fff}
  .sbtn.warn{background:#4a2333;color:#ffc2cc}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px;font-weight:800;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .sec:first-child{margin-top:4px}
  .card{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5}
  .card h3{margin:0 0 6px;font-size:16px}
  .card .big{font-size:28px;font-weight:900;color:var(--soul)}
  .buildcard{background:linear-gradient(135deg,#3a2470,#5a1f4f);border:1px solid #7a4dff}
  .buildcard.none{background:var(--panel);border-color:var(--line)}
  .build{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel);margin-bottom:6px;font-size:12px;color:var(--dim)}
  .build b{color:var(--text);font-size:13px}
  .build.active{background:linear-gradient(135deg,#3a2470,#5a1f4f);color:#e9dcff}
  .build .bi{font-size:22px}
  .loadouts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .lo{background:var(--panel);border-radius:12px;padding:8px;text-align:center;font-size:12px}
  .lo .lic{font-size:20px;min-height:26px}
  .lo .row{display:flex;gap:4px;margin-top:6px}
  .lo .row button{flex:1;padding:6px 0}
  .btn{display:block;width:100%;padding:12px;border-radius:12px;font-weight:800;font-size:15px;background:var(--accent);color:#fff;margin-top:10px}
  .btn:disabled{background:var(--card);color:var(--dim)}
  .btn.danger{background:#5a2333}
  .stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
  .stat:last-child{border:0}
  .stat b{color:var(--text)}
  .look-top{display:flex;gap:12px;align-items:center}
  #lookCv{width:150px;height:150px;border-radius:16px;background:#1a2b1a;flex:none}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;position:relative}
  .sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .chip{background:var(--card);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;border:2px solid transparent}
  .chip.sel{border-color:var(--accent);background:var(--card2)}
  .chip.lock,.sw.lock{opacity:.4}
  .chip small{display:block;font-weight:600;color:var(--dim);font-size:10px}
  #modal{position:fixed;inset:0;background:rgba(5,3,15,.75);display:grid;place-items:center;z-index:10;padding:20px}
  #modal[hidden]{display:none}
  #modalBox{background:var(--panel);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center;border:1px solid var(--line)}
  #modalBox h2{margin:0 0 8px}
  #modalBox p{color:var(--dim);margin:6px 0}
  #modalBox .reward{font-size:22px;font-weight:900;margin:12px 0}
  #toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:#000d;padding:9px 14px;border-radius:12px;
    font-weight:700;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="res" title="Gold"><span>🪙</span><b id="gold">0</b></div>
    <div class="res" title="Souls (permanent bonus)"><span>👻</span><b id="souls">0</b></div>
    <button id="giftBtn">🎁 <span id="giftTxt"></span></button>
  </header>
  <div id="stagebar">
    <div id="stageInfo">
      <div id="stageTxt">Stage 1</div>
      <div class="bar"><i id="stageFill"></i></div>
      <div id="stageSub"></div>
    </div>
    <button id="farmBtn" class="on">⏩ Auto</button>
  </div>
  <div id="battle"><canvas id="cv"></canvas><div id="tapHint">Tap to blast enemies!</div></div>
  <div id="herobar">
    <span>Lv <b id="lvl">1</b></span>
    <div class="bar"><i id="xpFill"></i></div>
    <span id="buildTag"></span>
    <span id="spBadge"></span>
  </div>
  <nav id="tabs">
    <button data-tab="upg" class="active"><b>⚔️</b>Upgrade<span class="dot"></span></button>
    <button data-tab="pow"><b>✨</b>Powers<span class="dot"></span></button>
    <button data-tab="gear"><b>🎒</b>Gear<span class="dot"></span></button>
    <button data-tab="look"><b>🎨</b>Look<span class="dot"></span></button>
    <button data-tab="asc"><b>👻</b>Ascend<span class="dot"></span></button>
    <button data-tab="stats"><b>📊</b>Stats<span class="dot"></span></button>
  </nav>
  <div id="buyRow">Buy:
    <button data-amt="1" class="active">x1</button><button data-amt="10">x10</button><button data-amt="max">Max</button>
  </div>
  <div id="panel"></div>
</div>
<div id="modal" hidden><div id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
// =====================================================================
//  SAVE DATA
// =====================================================================
const SAVE_KEY = 'powersurge-idle-v1';
const OFFLINE_CAP = 12 * 3600;      // seconds of offline progress that count
const GIFT_EVERY = 2 * 3600 * 1000; // free gift cooldown (ms)
const ENEMIES_PER_STAGE = 10;
const BOSS_TIME = 30;
const BAG_SIZE = 40;
const PW_MAX = 10;                  // power level where it evolves

function freshSave(){
  return {v:2, gold:0, souls:0, stage:1, maxStage:1, bestStage:1, kills:0, farm:false,
    heroLvl:1, xp:0, sp:0, up:{}, pw:{}, last:Date.now(), giftAt:0,
    totalKills:0, totalGold:0, bossKills:0, ascensions:0, played:0, buyAmt:'1',
    inv:[], eq:{weapon:null, armor:null}, uid:1, autoSalvage:-1, itemsFound:0,
    look:{skin:0, head:0, cape:0, aura:0, dye:-1}, loadouts:[null, null, null]};
}
let S = freshSave();
try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) S = Object.assign(freshSave(), JSON.parse(raw)); }catch(e){}
// migrate v1 saves
if(S.pw.frost){ S.pw.nova = S.pw.frost; delete S.pw.frost; }
S.v = 2;
function persist(){ S.last = Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

// =====================================================================
//  FORMATTING
// =====================================================================
const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  let i = 0;
  while(n >= 1000 && i < SUF.length - 1){ n /= 1000; i++; }
  if(n >= 1000) return n.toExponential(2);
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + SUF[i];
}
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if(h) return h + 'h ' + m + 'm';
  if(m) return m + 'm ' + s + 's';
  return s + 's';
}
const pct = v => Math.round(v * 100) + '%';
const x1 = n => (Math.round(n * 10) / 10).toString();
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

// =====================================================================
//  GEAR: weapons, armor, rarities, builds
// =====================================================================
const RAR = [
  {n:'Common',    c:'#c9c9d6', blade:'#dfe6f2'},
  {n:'Rare',      c:'#4da3ff', blade:'#9fd0ff'},
  {n:'Epic',      c:'#b067ff', blade:'#d6a8ff'},
  {n:'Legendary', c:'#ffb02e', blade:'#ffd36b'},
  {n:'Mythic',    c:'#ff4d6d', blade:'#ff8fa3'},
];
const RAR_MAIN = [15, 35, 70, 130, 220];
const WT = {
  sword: {n:'Sword',      icon:'🗡️', reach:54, arc:2.3, aps:1.0, dmg:1.0,  crit:0,    info:'Balanced arc slash'},
  axe:   {n:'Battle Axe', icon:'🪓', reach:50, arc:7,   aps:0.7, dmg:1.4,  crit:0,    info:'Slow 360° spin, hits everything around you'},
  spear: {n:'Spear',      icon:'🔱', reach:88, arc:0.9, aps:1.0, dmg:1.1,  crit:0,    info:'Long reach thrust'},
  dagger:{n:'Twin Daggers',icon:'🔪',reach:44, arc:1.8, aps:1.7, dmg:0.6,  crit:0.10, info:'Very fast, +10% crit'},
  bow:   {n:'Longbow',    icon:'🏹', range:270, aps:1.1, dmg:0.8, crit:0.05, info:'Ranged piercing arrows'},
  staff: {n:'Staff',      icon:'🪄', range:240, aps:0.8, dmg:0.95,crit:0,    info:'Ranged exploding orbs'},
};
const AT = {
  plate:  {n:'Plate Armor',   icon:'🛡️', color:'#a3adc4', info:'+10% damage reduction'},
  leather:{n:'Leather Armor', icon:'🧥', color:'#9a6a3e', info:'+8% attack speed, +3% crit'},
  robe:   {n:'Mage Robe',     icon:'👘', color:'#5a49c9', info:'+20% power damage, -8% cooldowns'},
  shadow: {n:'Shadow Garb',   icon:'🥷', color:'#30304a', info:'+40% crit damage, +1% lifesteal'},
};
const AFX = {
  crit:   {r:[0.02,0.04],  f:v=>`+${x1(v*100)}% crit chance`},
  critDmg:{r:[0.15,0.30],  f:v=>`+${pct(v)} crit damage`},
  aps:    {r:[0.04,0.08],  f:v=>`+${x1(v*100)}% attack speed`},
  power:  {r:[0.10,0.20],  f:v=>`+${pct(v)} power damage`},
  cdr:    {r:[0.03,0.06],  f:v=>`-${x1(v*100)}% cooldowns`},
  ls:     {r:[0.005,0.01], f:v=>`+${x1(v*100)}% lifesteal`},
  gold:   {r:[0.10,0.20],  f:v=>`+${pct(v)} gold`},
  hp:     {r:[0.10,0.20],  f:v=>`+${pct(v)} max HP`},
  aoe:    {r:[0.06,0.12],  f:v=>`+${pct(v)} area size`},
};
const ADJ = ['Worn','Fine','Enchanted','Legendary','Mythic'];
const EPITHET = ['of Embers','of Storms','of the Void','of Kings','of Frost','of the Phoenix','of Ruin','of Dawn'];
const BUILDS = [
  {id:'jugg',  n:'Juggernaut', icon:'🏰', w:['sword','axe','spear'], a:'plate',
    info:'+30% HP, attackers take 2× ATK thorns damage', apply:g=>{ g.hp += 0.3; g.thorns += 2; }},
  {id:'arch',  n:'Archmage',   icon:'🔮', w:['staff'], a:'robe',
    info:'+40% power damage, -10% cooldowns, +15% area', apply:g=>{ g.power += 0.4; g.cdr += 0.1; g.aoe += 0.15; }},
  {id:'ranger',n:'Ranger',     icon:'🎯', w:['bow','spear'], a:'leather',
    info:'+15% attack speed, +8% crit, arrows pierce +2', apply:g=>{ g.aps += 0.15; g.crit += 0.08; g.pierce += 2; }},
  {id:'assn',  n:'Assassin',   icon:'🗡️', w:['dagger','sword'], a:'shadow',
    info:'+60% crit damage, +3% lifesteal', apply:g=>{ g.critDmg += 0.6; g.ls += 0.03; }},
  {id:'reaper',n:'Reaper',     icon:'💀', w:['axe','staff'], a:'shadow',
    info:'+20% damage, every kill heals 3% HP', apply:g=>{ g.atk += 0.2; g.killHeal += 0.03; }},
  {id:'bers',  n:'Berserker',  icon:'🩸', w:['axe','dagger'], a:'leather',
    info:'+25% damage, +10% attack speed', apply:g=>{ g.atk += 0.25; g.aps += 0.1; }},
  {id:'spell', n:'Spellblade', icon:'⚡', w:['sword','spear','dagger'], a:'robe',
    info:'+20% power damage, hits can trigger mini lightning', apply:g=>{ g.power += 0.2; g.spellblade = 1; }},
];

function makeItem(slot, type, r, lvl){
  const it = {uid:S.uid++, slot, type, r, lvl,
    main: Math.round(RAR_MAIN[r] * rand(0.85, 1.15) * (1 + lvl * 0.03)), afx:[]};
  const keys = Object.keys(AFX).sort(() => Math.random() - 0.5).slice(0, r);
  for(const k of keys){ const [a, b] = AFX[k].r; it.afx.push([k, +(rand(a, b) * (1 + 0.35 * r)).toFixed(4)]); }
  const base = slot === 'weapon' ? WT[type].n : AT[type].n;
  it.name = ADJ[r] + ' ' + base + (r >= 3 ? ' ' + pick(EPITHET) : '');
  return it;
}
function rollDrop(boss){
  const w = boss ? [0, 50, 35, 12, 3] : [70, 22, 6, 1.6, 0.4];
  let roll = Math.random() * w.reduce((a, b) => a + b), r = 0;
  while(roll >= w[r]){ roll -= w[r]; r++; }
  const slot = Math.random() < 0.5 ? 'weapon' : 'armor';
  return makeItem(slot, pick(Object.keys(slot === 'weapon' ? WT : AT)), r, S.stage);
}
if(!S.eq.weapon){ S.eq.weapon = makeItem('weapon', 'sword', 0, 1); S.eq.weapon.name = 'Rusty Sword'; S.eq.weapon.main = 10; }
if(!S.eq.armor){ S.eq.armor = makeItem('armor', 'leather', 0, 1); S.eq.armor.name = "Traveler's Tunic"; S.eq.armor.main = 10; }

const wtype = () => WT[S.eq.weapon.type];
function activeBuild(){ const w = S.eq.weapon.type, a = S.eq.armor.type; return BUILDS.find(b => b.w.includes(w) && b.a === a) || null; }

let GS = null; // cached gear stats
function gear(){
  if(GS) return GS;
  const g = {atk:0, hp:0, crit:0, critDmg:0, aps:0, power:0, cdr:0, ls:0, gold:0, aoe:0, dr:0, thorns:0, killHeal:0, pierce:0, spellblade:0};
  g.atk += S.eq.weapon.main / 100;
  g.hp += S.eq.armor.main / 100;
  for(const it of [S.eq.weapon, S.eq.armor]) for(const [k, v] of it.afx) g[k] += v;
  const a = S.eq.armor.type;
  if(a === 'plate') g.dr += 0.10;
  if(a === 'leather'){ g.aps += 0.08; g.crit += 0.03; }
  if(a === 'robe'){ g.power += 0.2; g.cdr += 0.08; }
  if(a === 'shadow'){ g.critDmg += 0.4; g.ls += 0.01; }
  const b = activeBuild(); if(b) b.apply(g);
  g.cdr = Math.min(0.5, g.cdr);
  return GS = g;
}
const gearChanged = () => { GS = null; };

// =====================================================================
//  UPGRADES (gold)
// =====================================================================
const UPG = [
  {id:'atk',   name:'Sharpen Blade', icon:'⚔️', base:8,  g:1.15, desc:()=>`Attack: ${fmt(atk())}`},
  {id:'hp',    name:'Toughen Up',    icon:'❤️', base:10, g:1.15, desc:()=>`Max HP: ${fmt(maxHp())}`},
  {id:'spd',   name:'Quick Hands',   icon:'💨', base:25, g:1.22, max:80, desc:()=>`Attacks/sec: ${aps().toFixed(2)}`},

const soulMul = () => 1 + 0.1 * S.souls;
const lvlMul  = () => Math.pow(1.03, S.heroLvl - 1);
function atk(){ const l = up('atk'); return 5 * (1 + l) * Math.pow(1.05, l) * soulMul() * lvlMul() * (1 + gear().atk) * (R.rage > 0 && evo('rage') ? 1.5 : 1); }
function maxHp(){ const l = up('hp'); return 60 * (1 + 0.6*l) * Math.pow(1.05, l) * lvlMul() * (1 + 0.05*S.souls) * (1 + gear().hp); }
function aps(){
  let a = (1 + 0.05 * up('spd')) * wtype().aps * (1 + gear().aps);
  if(R.rage > 0) a *= evo('rage') ? 3 : 1 + (50 + 10*pw('rage'))/100;
  return a;
}
function critCh(){ return Math.min(0.8, 0.05 + 0.01 * up('crit') + gear().crit + wtype().crit); }
function critMul(){ return 2.5 + gear().critDmg; }
function regenPct(){ return 0.02 + 0.0025 * up('regen'); }
function tapDmg(){ return atk() * 0.25 * (1 + up('tap')); }
function goldMul(){ return (1 + 0.1*up('greed')) * (1 + (evo('midas') ? 2.5 : 0.15*pw('midas'))) * (1 + gear().gold) * soulMul(); }
const powerMul = () => 1 + gear().power;
const cdMul = () => 1 - gear().cdr;
const aoeMul = () => 1 + gear().aoe;
const lifesteal = () => (evo('vamp') ? 0.2 : 0.015 * pw('vamp')) + gear().ls;
const dmgTaken = () => Math.max(0.2, 1 - (evo('shield') ? 0.5 : 0.05 * pw('shield')) - gear().dr);
const thorns = () => gear().thorns + (evo('shield') ? 3 : 0);
const xpNeed = L => 8 * Math.pow(1.22, L - 1);
const pDmg = m => atk() * m * powerMul();

function edgePoint(){ return [VX1 + rand(15, 45), rand(-HH * 0.85, HH * 0.85)]; }
function spawnEnemy(kind, boss, minion){

}
function pickKind(){

}

function hurt(e, amt, o = {}){
  if(e.dead) return;
  let crit = false;
  if(o.crit !== false && Math.random() < critCh()){ amt *= critMul(); crit = true; }
  e.hp -= amt; e.flash = 0.1;
  if(o.kb){
    const d = Math.hypot(e.x - (o.kx||0), e.y - (o.ky||0)) || 1, f = e.boss ? 0.15 : 1;
    e.kx += (e.x - (o.kx||0)) / d * o.kb * f; e.ky += (e.y - (o.ky||0)) / d * o.kb * f;
  }
  const ls = lifesteal();
  if(ls) R.hp = Math.min(maxHp(), R.hp + Math.min(amt * ls, maxHp() * 0.04));
  if(!o.quiet || crit) addText(fmt(amt), e.x + rand(-6, 6), e.y - e.r - 4, o.color || (crit ? '#ffe14d' : '#fff'), crit ? 15 : 11, crit);
  if(e.hp <= 0) killE(e);
}
function aoe(x, y, r, dmg, o = {}){
  for(const e of E) if(!e.dead && Math.hypot(e.x - x, e.y - y) < r + e.r) hurt(e, dmg, Object.assign({kx:x, ky:y, quiet:true}, o));
}
function killE(e){
  e.dead = true; e.die = 0.3;
  const g = e.gold * goldMul();
  S.gold += g; S.totalGold += g; S.totalKills++;
  addXp(e.xp);
  const hue = ZONES[zoneIdx(S.stage)].hue;
  burst(e.x, e.y, e.boss ? 60 : 14, `hsl(${hue},90%,60%)`, e.boss ? 160 : 90, 3.5);
  for(let i = 0; i < (e.boss ? 12 : 2); i++) FX.parts.push({x:e.x, y:e.y, vx:rand(-60,60), vy:rand(-80,-20), life:0.9, max:0.9, size:3.5, color:'#ffcf4a', coin:true});
  if(evo('vamp')) R.hp = Math.min(maxHp(), R.hp + maxHp() * 0.02);
  if(gear().killHeal) R.hp = Math.min(maxHp(), R.hp + maxHp() * gear().killHeal);
  // loot
  if(e.boss || Math.random() < 0.035){
    const it = rollDrop(e.boss);
    FX.loot.push({x:e.x, y:e.y, t:0, it});
  }
  if(e.boss){
    S.bossKills++; S.sp++;
    R.shake = 0.5; flash('#ffffff', 0.5);
    toast('👑 Boss defeated! +1 Skill Point');
    for(const m of E) if(!m.dead){ m.dead = true; m.die = 0.3; burst(m.x, m.y, 10, '#fff', 80, 3); }
    stageClear();
  } else if(!e.minion){
    S.kills++;
    if(S.kills >= ENEMIES_PER_STAGE) stageClear();
  }
}
function collectLoot(it){
  S.itemsFound++;
  if(it.r <= S.autoSalvage || S.inv.length >= BAG_SIZE){
    const g = salvageValue(it); S.gold += g; S.totalGold += g;
    if(it.r >= 2) toast(`🎒 Bag full: salvaged ${RAR[it.r].n} for ${fmt(g)} 🪙`);
    return;
  }
  S.inv.push(it); invVer++;
  if(it.r >= 2) toast(`${RAR[it.r].n.toUpperCase()}! ${it.name}`);
}
function salvageValue(it){ return enemyStats(it.lvl, false).gold * 4 * Math.pow(3, it.r); }
function stageClear(){
  if(!S.farm){
    S.stage++;
    if(S.stage > S.maxStage) S.maxStage = S.stage;
    if(S.stage > S.bestStage) S.bestStage = S.stage;
    if((S.stage - 1) % 10 === 0) setTimeout(() => toast('🗺️ ' + zoneName(S.stage)), 400);
  }
  R.hp = Math.min(maxHp(), R.hp + maxHp() * 0.3);
  R.pendingStage = 0.9;
}
function heroHurt(d, src){
  if(R.immune > 0) return;
  d *= dmgTaken();
  R.hp -= d; R.hurt = 0.15; R.shake = Math.max(R.shake, 0.12);
  addText('-' + fmt(d), rand(-8, 8), -HERO_R - 10, '#ff5d73', 11);
  if(src && thorns()) hurt(src, atk() * thorns(), {crit:false, color:'#c9d2e8', quiet:true});
  if(R.hp <= 0) fail('💀 Defeated! Farming the previous stage.');
}
function fail(msg){
  toast(msg);
  S.farm = true;
  if(S.stage > 1) S.stage--;
  S.kills = 0; E.length = 0; R.rage = 0; R.pendingStage = 0;
  R.dead = 1.6; R.hp = 0;
  burst(0, 0, 40, '#ff5d73', 120, 4);
}
function addXp(x){
  S.xp += x;
  while(S.xp >= xpNeed(S.heroLvl)){
    S.xp -= xpNeed(S.heroLvl); S.heroLvl++; S.sp++;
    R.hp = maxHp();
    ring(0, 0, 0, 90, 0.5, '#9be7ff', 6);
    toast('⭐ Hero level ' + S.heroLvl + '! +1 Skill Point');
    const unlocked = PW.find(p => p.req === S.heroLvl);
    if(unlocked) setTimeout(() => toast('✨ New power unlocked: ' + unlocked.icon + ' ' + unlocked.name), 1600);
  }
}

// ---------- targeting helpers ----------
const alive = () => E.filter(e => !e.dead);
function nearest(x = 0, y = 0, exclude){
  let best = null, bd = Infinity;
  for(const e of E){ if(e.dead || (exclude && exclude.has(e))) continue; const d = Math.hypot(e.x - x, e.y - y); if(d < bd){ bd = d; best = e; } }
  return best;
}
function cluster(){ // the enemy with the most neighbours (best AoE target)
  let best = null, bn = -1;
  for(const e of E){ if(e.dead || e.x > VX1 || Math.abs(e.y) > HH) continue;
    let n = 0; for(const o of E) if(!o.dead && Math.hypot(o.x - e.x, o.y - e.y) < 60) n++;
    if(n > bn){ bn = n; best = e; } }
  return best || nearest();
}

// ---------- basic attack ----------
function heroAttack(dt){
  const w = wtype(), t = nearest();
  R.atkT = Math.min(R.atkT + dt * aps(), 3);
  if(!t) return;
  const d = Math.hypot(t.x, t.y);
  const reach = w.range || (w.reach + t.r + HERO_R);
  const ang = Math.atan2(t.y, t.x);
  R.face = ang;
  if(d > reach){ R.atkT = Math.min(R.atkT, 1); return; }
  while(R.atkT >= 1){
    R.atkT -= 1; R.swing = 0.22;
    const dmg = atk() * w.dmg, rc = RAR[S.eq.weapon.r].blade;
    if(w.range){
      if(S.eq.weapon.type === 'bow') FX.projs.push({kind:'arrow', x:Math.cos(ang)*16, y:Math.sin(ang)*16, a:ang, spd:560, dmg, pierce:1 + gear().pierce, hit:new Set(), life:0.7, c:rc});
      else FX.projs.push({kind:'orb', x:Math.cos(ang)*18, y:Math.sin(ang)*18, tx:t.x, ty:t.y, a:ang, spd:340, dmg, r:32*aoeMul(), c:rc, life:1.2});
    } else {
      const rr = (w.reach + HERO_R) * (1 + gear().aoe * 0.5);
      FX.slashes.push({a:ang, arc:w.arc, r:rr, life:0.2, max:0.2, c:rc, spin:w.arc > 6});
      for(const e of E){
        if(e.dead) continue;
        const ed = Math.hypot(e.x, e.y);
        if(ed > rr + e.r) continue;
        let da = Math.abs(((Math.atan2(e.y, e.x) - ang + Math.PI*3) % (Math.PI*2)) - Math.PI);
        if(da <= w.arc/2 + 0.2) hurt(e, dmg, {kb:120, kx:0, ky:0});
      }
    }
    if(gear().spellblade && Math.random() < 0.15) chainLightning(1.5, 2, false);
  }
}

function castPower(id){
  const l = pw(id), ev = l >= PW_MAX;
  const live = alive();
  if(id === 'heal'){
    if(R.hp > maxHp() * 0.7) return false;
    const h = ev ? maxHp() : maxHp() * (15 + 5*l) / 100;
    R.hp = Math.min(maxHp(), R.hp + h);
    if(ev){ R.immune = 3; flash('#fff6c0', 0.35); }
    addText('+' + fmt(h), 0, -HERO_R - 16, '#5be38a', 14, true);
    ring(0, 0, 10, 70, 0.6, '#5be38a', 8);
    for(let i = 0; i < 30; i++) FX.parts.push({x:rand(-20,20), y:rand(-10,20), vx:rand(-10,10), vy:rand(-90,-40), life:1, max:1, size:rand(3,6), color:'#7dffb0'});
    return true;
  }
  if(id === 'rage'){ R.rage = ev ? 8 : 6; ring(0, 0, 0, 60, 0.4, '#ff5a2a', 10); addText(ev ? 'GODLIKE FURY!' : 'BERSERK!', 0, -HERO_R - 18, '#ff7a45', 14, true); return true; }
  if(!live.length) return false;

  if(id === 'fireball'){
    const dmg = pDmg(3 + 1.2*l);
    if(ev){
      const targets = [cluster(), pick(live), pick(live)];
      targets.forEach((t, i) => FX.meteors.push({x:t.x + rand(-10,10), y:t.y + rand(-10,10), t:-i*0.18, dur:0.55, r:72*aoeMul(), dmg}));
    } else {
      const t = cluster();
      FX.projs.push({kind:'fire', x:0, y:0, tx:t.x, ty:t.y, spd:330, dmg, r:(34+3*l)*aoeMul(), life:2});
    }
    return true;
  }
  if(id === 'lightning'){ chainLightning(2 + 0.8*l, ev ? 10 : 2 + Math.floor(l/2), ev); return true; }
  if(id === 'nova'){
    const r = (ev ? Math.hypot(VX1, HH) : 70 + 8*l) * aoeMul(), dmg = pDmg(2 + 0.8*l);
    ring(0, 0, 10, r, 0.45, '#9be7ff', ev ? 22 : 14);
    ring(0, 0, 0, r * 0.7, 0.35, '#ffffff', 6);
    flash('#bfefff', ev ? 0.45 : 0.18);
    for(let i = 0; i < (ev ? 90 : 40); i++){ const a = rand(0, 6.3), s = rand(r*0.8, r*1.8); FX.parts.push({x:0, y:0, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.6, max:0.6, size:rand(3,6), color:'#bfefff', drag:3, shard:true, a}); }
    for(const e of E){
      if(e.dead || Math.hypot(e.x, e.y) > r + e.r) continue;
      e.slow = 2.5;
      if(ev){ e.stun = 2; e.frozen = 2; }
      hurt(e, dmg, {color:'#9be7ff', kb:ev ? 0 : 180, kx:0, ky:0, quiet:true});
    }
    if(ev) R.shake = 0.35;
    return true;
  }
  if(id === 'poison'){
    const n = ev ? 3 : 1;
    for(let i = 0; i < n; i++){
      const t = i ? pick(live) : cluster();
      FX.clouds.push({x:t.x, y:t.y, r:(38 + 3*l + (ev ? 25 : 0)) * aoeMul(), life:4.5, max:4.5, dps:pDmg(0.7 + 0.35*l), tick:0, seed:Math.random()*9});
    }
    return true;
  }
  if(id === 'beam'){
    const t = nearest(), base = Math.atan2(t.y, t.x), n = ev ? 6 : 1;
    const w = (10 + 1.2*l) * aoeMul() * (ev ? 1.5 : 1), dmg = pDmg(3 + l);
    for(let i = 0; i < n; i++){
      const a = base + (i - (n - 1) / 2) * 0.32, cx = Math.cos(a), cy = Math.sin(a);
      FX.beams.push({a, w, life:0.45, max:0.45});
      for(const e of E){
        if(e.dead) continue;
        const along = e.x*cx + e.y*cy; if(along < 0) continue;
        const perp = Math.abs(-e.x*cy + e.y*cx);
        if(perp < w/2 + e.r) hurt(e, dmg, {color:'#fff6b0', kb:90, kx:0, ky:0, quiet:true});
      }
      for(let k = 0; k < 18; k++){ const d = rand(20, 380); FX.parts.push({x:cx*d, y:cy*d, vx:rand(-30,30), vy:rand(-30,30), life:0.5, max:0.5, size:rand(2,5), color:'#fff3a0'}); }
    }
    flash('#fff6c0', ev ? 0.35 : 0.12); R.shake = Math.max(R.shake, ev ? 0.3 : 0.1);
    return true;
  }
  if(id === 'hole'){
    const t = cluster();
    FX.holes.push({x:t.x, y:t.y, r:(ev ? 150 : 85 + 5*l) * aoeMul(), life:2.6, max:2.6, dps:pDmg(1 + 0.45*l), tick:0, boom: ev ? pDmg(8 + 2*l) : 0});
    return true;
  }
  if(id === 'quake'){
    const dmg = pDmg(4 + 1.5*l);
    quake(dmg, 1);
    if(ev){ FX.later.push({t:0.6, fn:() => quake(dmg, 0.8)}); FX.later.push({t:1.2, fn:() => quake(dmg, 1.2)}); }
    return true;
  }
  return false;
}
function chainLightning(mult, n, ev){
  const dmg = pDmg(mult), hit = new Set();
  let px = 0, py = 0, t = nearest();
  for(let i = 0; i < n && t; i++){
    hit.add(t);
    FX.bolts.push({pts:jag(px, py, t.x, t.y), life:0.3, max:0.3, w: ev ? 4 : 3});
    t.stun = Math.max(t.stun, ev ? 1 : 0.4);
    if(ev){
      FX.bolts.push({pts:jag(t.x + rand(-30,30), -HH - 20, t.x, t.y), life:0.35, max:0.35, w:6});
      explode(t.x, t.y, 34*aoeMul(), dmg * 0.5, '#bfe9ff', 0.4);
    }
    hurt(t, dmg, {color:'#9be7ff'});
    for(let k = 0; k < 8; k++) FX.parts.push({x:t.x, y:t.y, vx:rand(-120,120), vy:rand(-120,120), life:0.35, max:0.35, size:rand(2,4), color:'#d7f4ff'});
    px = t.x; py = t.y;
    const nx = nearest(px, py, hit);
    t = nx && Math.hypot(nx.x - px, nx.y - py) < 160 ? nx : null;
  }
  flash('#cfefff', ev ? 0.3 : 0.1);
}
function quake(dmg, scale){
  R.shake = Math.max(R.shake, 0.5 * scale);
  ring(0, 0, 10, Math.hypot(VX1, HH), 0.7, '#ffb36b', 16 * scale);
  ring(0, 0, 0, VX1 * 0.8, 0.5, '#7a4a2a', 26 * scale);
  for(let i = 0; i < 7; i++){
    const a = rand(0, 6.3), pts = [[0,0]]; let x = 0, y = 0;
    for(let k = 0; k < 8; k++){ const aa = a + rand(-0.4, 0.4); x += Math.cos(aa)*rand(18,32); y += Math.sin(aa)*rand(18,32); pts.push([x, y]); }
    FX.decals.push({kind:'crack', pts, life:3, max:3});
  }
  for(let i = 0; i < 50; i++) FX.parts.push({x:rand(VX0,VX1), y:rand(-HH,HH), vx:rand(-20,20), vy:rand(-70,-20), life:0.8, max:0.8, size:rand(3,7), color:'#c8a27a', dust:true});
  for(const e of E) if(!e.dead){ e.stun = Math.max(e.stun, 0.7); hurt(e, dmg, {color:'#ffb36b', quiet:true}); }
}
function explode(x, y, r, dmg, color, shake = 0.2){
  aoe(x, y, r, dmg, {kb:140});
  ring(x, y, 4, r, 0.35, color, 10);
  ring(x, y, 0, r * 0.6, 0.25, '#ffffff', 5);
  burst(x, y, 26, color, r * 3, 5);
  FX.parts.push({x, y, vx:0, vy:0, life:0.25, max:0.25, size:r * 1.3, color});
  FX.decals.push({kind:'scorch', x, y, r:r * 0.8, life:4, max:4});
  R.shake = Math.max(R.shake, shake);
}

function burst(x, y, n, color, spd = 90, size = 3){

function ring(x, y, r0, r1, life, color, w){ FX.rings.push({x, y, r0, r1, life, max:life, color, w}); }
function flash(c, a){ R.flashC = c; R.flash = Math.max(R.flash, a); }
function jag(x1, y1, x2, y2){
  const pts = [[x1, y1]], n = Math.max(4, Math.floor(Math.hypot(x2-x1, y2-y1) / 14));
  const nx = -(y2-y1), ny = x2-x1, nl = Math.hypot(nx, ny) || 1;
  for(let i = 1; i < n; i++){ const t = i/n, o = rand(-10, 10); pts.push([x1 + (x2-x1)*t + nx/nl*o, y1 + (y2-y1)*t + ny/nl*o]); }
  pts.push([x2, y2]);
  return pts;
}

function updateFx(dt){
  for(const p of FX.parts){
    p.life -= dt;
    if(p.coin){ // coins arc then fly to hero
      if(p.life < 0.6){ const d = Math.hypot(p.x, p.y) || 1; p.vx = -p.x/d*320; p.vy = -p.y/d*320; if(d < 10) p.life = 0; }
      else p.vy += 200*dt;
    }
    if(p.drag){ const k = Math.max(0, 1 - p.drag*dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  FX.parts = FX.parts.filter(p => p.life > 0);
  if(FX.parts.length > 700) FX.parts.splice(0, FX.parts.length - 700);
  for(const k of ['rings','bolts','beams','texts','decals','slashes']){ for(const o of FX[k]) o.life -= dt; FX[k] = FX[k].filter(o => o.life > 0); }
  for(const t of FX.texts) t.y -= dt * 28;
  for(const l of FX.later){ l.t -= dt; if(l.t <= 0){ l.fn(); l.done = true; } }
  FX.later = FX.later.filter(l => !l.done);
  for(const L of FX.loot){
    L.t += dt;
    if(L.t > 0.9){ const d = Math.hypot(L.x, L.y) || 1; L.x -= L.x/d*Math.min(d, 400*dt); L.y -= L.y/d*Math.min(d, 400*dt); if(d < 12){ L.done = true; collectLoot(L.it); } }
  }
  FX.loot = FX.loot.filter(l => !l.done);
}

function tick(dt){
  S.played += dt; R.time += dt;
  R.swing = Math.max(0, R.swing - dt); R.hurt = Math.max(0, R.hurt - dt);
  R.shake = Math.max(0, R.shake - dt); R.flash = Math.max(0, R.flash - dt*1.6);
  R.banner = Math.max(0, R.banner - dt);
  updateFx(dt);

  if(R.dead > 0){
    R.dead -= dt;
    if(R.dead <= 0){ R.hp = maxHp(); startStage(); }
    return;
  }
  const mh = maxHp();
  R.hp = Math.min(mh, R.hp + mh * regenPct() * dt);
  R.rage = Math.max(0, R.rage - dt); R.immune = Math.max(0, R.immune - dt);

  if(R.pendingStage > 0){ R.pendingStage -= dt; if(R.pendingStage <= 0) startStage(); }
  if(R.pause > 0){ R.pause -= dt; return; }

  // ---- spawning ----
  const boss = isBoss(S.stage), nAlive = E.filter(e => !e.dead).length;
  R.spawnT -= dt;
  if(R.spawnT <= 0 && !(R.pendingStage > 0)){
    if(boss){ if(nAlive < 5){ spawnEnemy(pickKind(), false, true); } R.spawnT = 1.4; }
    else if(R.spawned < ENEMIES_PER_STAGE && nAlive < Math.min(10, 4 + Math.floor(S.stage/8))){ spawnEnemy(pickKind()); R.spawned++; R.spawnT = 0.45; }
  }

  // ---- enemies ----
  for(const e of E){
    if(e.dead){ e.die -= dt; continue; }
    e.flash -= dt; e.stun -= dt; e.slow -= dt; e.frozen -= dt; e.bladeCd -= dt; e.lunge -= dt;
    const kd = Math.max(0, 1 - 7*dt); e.x += e.kx*dt; e.y += e.ky*dt; e.kx *= kd; e.ky *= kd;
    if(e.stun > 0) continue;
    const d = Math.hypot(e.x, e.y) || 1, reach = HERO_R + e.r + 1;
    if(d > reach){
      const sp = e.spd * (e.slow > 0 ? 0.45 : 1) * (e.x > VX1 ? 2 : 1);
      e.x -= e.x/d*sp*dt; e.y -= e.y/d*sp*dt;
    } else {
      e.atkT += dt * (e.slow > 0 ? 0.5 : 1);
      if(e.atkT >= 1.4){ e.atkT = 0; e.lunge = 0.15; heroHurt(e.dmg, e); if(R.dead > 0) return; }
    }
  }
  // separation
  for(let i = 0; i < E.length; i++){ const a = E[i]; if(a.dead) continue;
    for(let j = i+1; j < E.length; j++){ const b = E[j]; if(b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
      if(d < m && d > 0.01){ const p = (m - d) / 2, ux = dx/d, uy = dy/d, wa = a.boss ? 0.1 : 1, wb = b.boss ? 0.1 : 1;
        a.x -= ux*p*wa; a.y -= uy*p*wa; b.x += ux*p*wb; b.y += uy*p*wb; } } }
  for(let i = E.length - 1; i >= 0; i--) if(E[i].dead && E[i].die <= 0) E.splice(i, 1);

  // ---- hero ----
  heroAttack(dt);

  // ---- projectiles ----
  for(const p of FX.projs){
    p.life -= dt;
    if(p.kind === 'arrow'){
      p.x += Math.cos(p.a)*p.spd*dt; p.y += Math.sin(p.a)*p.spd*dt;
      for(const e of E){ if(e.dead || p.hit.has(e)) continue;
        if(Math.hypot(e.x - p.x, e.y - p.y) < e.r + 4){ p.hit.add(e); hurt(e, p.dmg, {kb:60, kx:0, ky:0}); burst(p.x, p.y, 4, p.c, 60, 2); if(--p.pierce <= 0){ p.life = 0; break; } } }
    } else {
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), step = p.spd * dt;
      if(p.kind === 'fire') FX.parts.push({x:p.x, y:p.y, vx:rand(-20,20), vy:rand(-20,20), life:0.35, max:0.35, size:rand(4,8), color:'#ff8a2a'});
      if(p.kind === 'orb') FX.parts.push({x:p.x, y:p.y, vx:0, vy:0, life:0.2, max:0.2, size:5, color:p.c});
      if(d <= step){
        p.life = 0;
        if(p.kind === 'fire') explode(p.tx, p.ty, p.r, p.dmg, '#ff8a2a', 0.22);
        else { aoe(p.tx, p.ty, p.r, p.dmg, {kb:60, quiet:false}); ring(p.tx, p.ty, 2, p.r, 0.25, p.c, 5); burst(p.tx, p.ty, 10, p.c, 80, 3); }
      } else { p.x += dx/d*step; p.y += dy/d*step; }
    }
  }
  FX.projs = FX.projs.filter(p => p.life > 0);

  // meteors
  for(const m of FX.meteors){
    m.t += dt;
    if(m.t >= m.dur && !m.done){ m.done = true; explode(m.x, m.y, m.r, m.dmg, '#ff6a1a', 0.4); flash('#ffb070', 0.2);
      for(let i = 0; i < 20; i++) FX.parts.push({x:m.x, y:m.y, vx:rand(-200,200), vy:rand(-200,200), life:0.8, max:0.8, size:rand(2,4), color:'#ffcf6a', drag:2}); }
  }
  FX.meteors = FX.meteors.filter(m => !m.done);

  // clouds
  for(const c of FX.clouds){
    c.life -= dt; c.tick -= dt;
    if(c.tick <= 0){ c.tick = 0.3; aoe(c.x, c.y, c.r, c.dps * 0.3, {crit:false, color:'#9cff6a'}); }
    if(Math.random() < dt * 30) FX.parts.push({x:c.x + rand(-c.r, c.r)*0.8, y:c.y + rand(-c.r, c.r)*0.8, vx:0, vy:-20, life:0.7, max:0.7, size:rand(3,6), color:'#7dff4a'});
  }
  FX.clouds = FX.clouds.filter(c => c.life > 0);

  // black holes
  for(const h of FX.holes){
    h.life -= dt; h.tick -= dt;
    for(const e of E){ if(e.dead) continue; const dx = h.x - e.x, dy = h.y - e.y, d = Math.hypot(dx, dy);
      if(d < h.r && d > 2){ const f = (e.boss ? 15 : 110) * (1 - d/h.r) + 20; e.x += dx/d*f*dt; e.y += dy/d*f*dt; } }
    if(h.tick <= 0){ h.tick = 0.25; aoe(h.x, h.y, h.r * 0.6, h.dps * 0.25, {crit:false, color:'#d7a8ff'}); }
    if(Math.random() < dt * 60){ const a = rand(0, 6.3); FX.parts.push({x:h.x + Math.cos(a)*h.r, y:h.y + Math.sin(a)*h.r, vx:-Math.cos(a)*h.r*1.6 - Math.sin(a)*90, vy:-Math.sin(a)*h.r*1.6 + Math.cos(a)*90, life:0.55, max:0.55, size:rand(2,4), color:'#c58bff'}); }
    if(h.life <= 0 && h.boom){ explode(h.x, h.y, h.r * 0.9, h.boom, '#c58bff', 0.45); flash('#e4c8ff', 0.3); }
  }
  FX.holes = FX.holes.filter(h => h.life > 0);

  // orbit blades
  if(pw('blades')){
    const l = pw('blades'), ev = l >= PW_MAX, n = ev ? 8 : 2 + Math.floor(l/3), r = (ev ? 74 : 52) * aoeMul();
    R.bladeA += dt * (ev ? 4.5 : 3.2);
    const dmg = pDmg(0.5 + 0.22*l);
    for(let i = 0; i < n; i++){
      const a = R.bladeA + i * Math.PI * 2 / n, bx = Math.cos(a)*r, by = Math.sin(a)*r;
      for(const e of E){ if(e.dead || e.bladeCd > 0) continue;
        if(Math.hypot(e.x - bx, e.y - by) < e.r + (ev ? 14 : 9)){ e.bladeCd = 0.3; hurt(e, dmg, {color:'#a6f0ff', kb:90, kx:0, ky:0, quiet:true}); burst(bx, by, 4, '#a6f0ff', 80, 2); } }
    }
  }

  // ---- powers auto-cast ----
  for(const p of PW){
    if(!p.cd || !pw(p.id)) continue;
    const full = p.cd(pw(p.id)) * cdMul();
    R.cd[p.id] = Math.min(R.cd[p.id] ?? full, full) - dt;
    if(R.cd[p.id] <= 0) R.cd[p.id] = castPower(p.id) ? full : 0;
    if(R.dead > 0) return;
  }

  // ---- boss timer ----
  if(boss && !(R.pendingStage > 0)){
    R.bossT -= dt;
    if(R.bossT <= 0){ fail('⏱️ Out of time! Get stronger, then try again.'); R.dead = 0.8; }
  }
}

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  const r = cv.getBoundingClientRect(); DPR = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  K = Math.min(W, H) / 300; VX0 = -W*HERO_SX/K; VX1 = W*(1 - HERO_SX)/K; HH = H/2/K;
}
addEventListener('resize', resize);

const glowCache = new Map();
function glow(color){
  let c = glowCache.get(color);
  if(!c){
    c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowCache.set(color, c);
  }
  return c;
}
function dglow(color, x, y, r, a = 1){ ctx.globalAlpha = a; ctx.drawImage(glow(color), x - r, y - r, r*2, r*2); }

const groundCache = new Map();
function groundPattern(i){
  if(groundCache.has(i)) return groundCache.get(i);
  const z = ZONES[i], c = document.createElement('canvas'); c.width = c.height = 160;
  const g = c.getContext('2d');
  g.fillStyle = z.base; g.fillRect(0, 0, 160, 160);
  let seed = i * 999 + 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for(let k = 0; k < 140; k++){
    const x = rnd()*160, y = rnd()*160;
    g.fillStyle = rnd() < 0.5 ? z.a : z.b;
    if(z.kind === 'grass'){ g.fillRect(x, y, 2, 5); g.fillRect(x+3, y+1, 2, 4); }
    else if(z.kind === 'sand'){ g.globalAlpha = 0.5; g.fillRect(x, y, 6, 1.5); g.globalAlpha = 1; }
    else if(z.kind === 'snow'){ g.beginPath(); g.arc(x, y, rnd()*2.5, 0, 7); g.fill(); }
    else if(z.kind === 'lava'){ if(k % 14 === 0){ g.strokeStyle = 'rgba(255,90,26,.55)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd()*30-15, y + rnd()*30-15); g.lineTo(x + rnd()*40-20, y + rnd()*40-20); g.stroke(); } else g.fillRect(x, y, 4, 4); }
    else { if(k % 4 === 0){ g.fillStyle = '#ffffff'; g.globalAlpha = rnd(); g.fillRect(x, y, 1.5, 1.5); g.globalAlpha = 1; } else g.fillRect(x, y, 3, 3); }
  }
  const p = ctx.createPattern(c, 'repeat'); groundCache.set(i, p); return p;
}

// ---------- hero ----------
function heroLook(){
  const L = S.look;
  return {
    skin: LOOK.skin[L.skin]?.c || LOOK.skin[0].c,
    head: L.head, cape: LOOK.cape[L.cape]?.c,
    aura: LOOK.aura[L.aura]?.c || null,
    armorType: S.eq.armor.type, armorR: S.eq.armor.r,
    body: (LOOK.dye[L.dye + 1]?.c) || AT[S.eq.armor.type].color,
    weapon: S.eq.weapon.type, weaponR: S.eq.weapon.r,
  };
}
function drawWeapon(g, type, r, len = 1){
  const bc = RAR[r].blade;
  if(type === 'sword'){
    g.fillStyle = '#6b4a2b'; g.fillRect(-6, -1.5, 7, 3);
    g.fillStyle = '#ffcf4a'; g.fillRect(0, -5, 3, 10);
    g.fillStyle = bc; g.beginPath(); g.moveTo(3, -2.5); g.lineTo(26*len, -2); g.lineTo(30*len, 0); g.lineTo(26*len, 2); g.lineTo(3, 2.5); g.fill();
  } else if(type === 'axe'){
    g.fillStyle = '#6b4a2b'; g.fillRect(-6, -1.5, 28, 3);
    g.fillStyle = bc; g.beginPath(); g.moveTo(16, -1); g.quadraticCurveTo(22, -14, 30, -12); g.quadraticCurveTo(26, 0, 30, 12); g.quadraticCurveTo(22, 14, 16, 1); g.fill();
  } else if(type === 'spear'){
    g.fillStyle = '#7a5530'; g.fillRect(-10, -1.3, 38, 2.6);
    g.fillStyle = bc; g.beginPath(); g.moveTo(28, -4); g.lineTo(40, 0); g.lineTo(28, 4); g.fill();
    g.fillStyle = '#d94a4a'; g.fillRect(25, -3, 3, 6);
  } else if(type === 'dagger'){
    g.fillStyle = '#3a2a1a'; g.fillRect(-3, -1.5, 5, 3);
    g.fillStyle = bc; g.beginPath(); g.moveTo(2, -2); g.lineTo(14, 0); g.lineTo(2, 2); g.fill();
  } else if(type === 'bow'){
    g.strokeStyle = '#8a5a2b'; g.lineWidth = 3; g.beginPath(); g.arc(-4, 0, 14, -1.2, 1.2); g.stroke();
    g.strokeStyle = bc; g.lineWidth = 1; g.beginPath(); g.moveTo(-4 + Math.cos(-1.2)*14, Math.sin(-1.2)*14); g.lineTo(-4 + Math.cos(1.2)*14, Math.sin(1.2)*14); g.stroke();
  } else if(type === 'staff'){
    g.fillStyle = '#5a3a20'; g.fillRect(-8, -1.5, 32, 3);
    g.globalCompositeOperation = 'lighter'; g.drawImage(glow(bc), 18, -10, 20, 20); g.globalCompositeOperation = 'source-over';
    g.fillStyle = bc; g.beginPath(); g.arc(28, 0, 4.5, 0, 7); g.fill();
  }
  if(r >= 3 && type !== 'bow'){ g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.5 + 0.3*Math.sin(R.time*6); g.drawImage(glow(bc), 4, -10, 28, 20); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
}
function drawHero(g, lk, st){
  // st: {face, swing, t, rage, immune, hurt, dead}
  const t = st.t;
  g.save();
  // aura
  if(lk.aura || st.rage){
    g.globalCompositeOperation = 'lighter';
    const col = st.rage ? '#ff4a1a' : lk.aura === 'rainbow' ? `hsl(${(t*120)%360},100%,60%)` : lk.aura;
    g.globalAlpha = 0.55 + 0.2*Math.sin(t*5);
    g.drawImage(glow(col), -34, -34, 68, 68);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  // shadow
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(0, 6, 15, 8, 0, 0, 7); g.fill();
  g.rotate(st.face);
  if(st.hurt > 0) g.translate(rand(-1.5, 1.5), rand(-1.5, 1.5));
  // cape
  if(lk.cape){
    const fl = Math.sin(t*7) * 2.5;
    g.fillStyle = lk.cape; g.beginPath(); g.moveTo(-2, -9); g.quadraticCurveTo(-16, -12 - fl, -22, -8 + fl); g.lineTo(-22, 8 + fl); g.quadraticCurveTo(-16, 12 - fl, -2, 9); g.fill();
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(-20, -1, 16, 2);
  }
  // weapon (held in right hand = +y side)
  const w = WT[lk.weapon], sw = st.swing > 0 ? 1 - st.swing/0.22 : -1;
  const melee = !w.range;
  g.save();
  if(melee){
    const arc = Math.min(w.arc, 2.6);
    const a = sw < 0 ? 0.9 : (w.arc > 6 ? sw * Math.PI * 2 + 0.9 : arc/2 - sw * arc);
    g.translate(2, 0); g.rotate(a); g.translate(9, 0);
  } else { g.translate(10, 4); if(lk.weapon === 'bow') g.translate(sw > 0 ? -2*(1-sw) : 0, 0); }
  drawWeapon(g, lk.weapon, lk.weaponR);
  g.restore();
  if(lk.weapon === 'dagger'){ g.save(); g.translate(6, -11); g.rotate(-0.6 + (sw > 0 ? Math.sin(sw*Math.PI)*0.8 : 0)); drawWeapon(g, 'dagger', lk.weaponR); g.restore(); }
  // body
  const at = lk.armorType;
  g.fillStyle = st.hurt > 0 ? '#ff8a9a' : lk.body;
  g.beginPath(); g.ellipse(0, 0, at === 'robe' ? 10 : 8, at === 'robe' ? 13 : 12, 0, 0, 7); g.fill();
  if(at === 'plate'){ g.fillStyle = '#d5dbe8'; g.beginPath(); g.arc(0, -11, 5, 0, 7); g.arc(0, 11, 5, 0, 7); g.fill(); g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1; g.beginPath(); g.moveTo(-6, 0); g.lineTo(6, 0); g.stroke(); }
  if(at === 'leather'){ g.strokeStyle = '#4a2f18'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(-6, -9); g.lineTo(6, 9); g.stroke(); }
  if(at === 'robe'){ g.strokeStyle = '#ffcf4a'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(0, 0, 10, 13, 0, 0, 7); g.stroke(); }
  if(at === 'shadow'){ g.fillStyle = '#b02a3a'; g.beginPath(); g.moveTo(-2, -4); g.lineTo(-16, -6 + Math.sin(t*9)*3); g.lineTo(-15, -1); g.fill(); }
  if(lk.armorR >= 3){ g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.3; g.drawImage(glow(RAR[lk.armorR].c), -16, -18, 32, 36); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
  // head
  g.fillStyle = lk.skin; g.beginPath(); g.arc(2, 0, 6.5, 0, 7); g.fill();
  drawHead(g, lk, t);
  g.restore();
  if(st.immune > 0){ g.globalCompositeOperation = 'lighter'; g.strokeStyle = 'rgba(255,230,140,.8)'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 20 + Math.sin(t*10)*1.5, 0, 7); g.stroke(); g.globalCompositeOperation = 'source-over'; }
}
function drawHead(g, lk, t){
  const h = lk.head;
  if(h === 0){ // knight helm
    g.fillStyle = '#b8c2d8'; g.beginPath(); g.arc(1, 0, 7, 0, 7); g.fill();
    g.fillStyle = '#1b1530'; g.fillRect(5, -4, 2, 8);
    g.fillStyle = '#d94a4a'; g.fillRect(-7, -1.2, 8, 2.4);
  } else if(h === 1){ // spiky hair
    g.fillStyle = '#3a2416'; g.beginPath();
    for(let i = 0; i < 9; i++){ const a = Math.PI*0.45 + i/8*Math.PI*1.1; g.lineTo(Math.cos(a)*10, Math.sin(a)*10); g.lineTo(Math.cos(a + 0.18)*5, Math.sin(a + 0.18)*5); }
    g.fill();
  } else if(h === 2){ // hood
    g.fillStyle = '#2f2a3d'; g.beginPath(); g.arc(0, 0, 8, Math.PI*0.35, Math.PI*1.65); g.fill();
  } else if(h === 3){ // wizard hat
    g.fillStyle = '#3b2a8a'; g.beginPath(); g.arc(0, 0, 10.5, 0, 7); g.fill();
    g.fillStyle = '#5a45c9'; g.beginPath(); g.arc(-2, 0, 5.5, 0, 7); g.fill();
    g.fillStyle = '#ffcf4a'; g.beginPath(); g.arc(-4, 0, 1.6, 0, 7); g.fill();
  } else if(h === 4){ // horned helm
    g.fillStyle = '#8a8f9c'; g.beginPath(); g.arc(1, 0, 7, 0, 7); g.fill();
    g.fillStyle = '#efe6d0';
    g.beginPath(); g.moveTo(0, -5); g.quadraticCurveTo(2, -14, 9, -16); g.quadraticCurveTo(4, -10, 3, -4); g.fill();
    g.beginPath(); g.moveTo(0, 5); g.quadraticCurveTo(2, 14, 9, 16); g.quadraticCurveTo(4, 10, 3, 4); g.fill();
  } else if(h === 5){ // kabuto
    g.fillStyle = '#7a1f1f'; g.beginPath(); g.arc(0, 0, 8, 0, 7); g.fill();
    g.fillStyle = '#ffcf4a'; g.beginPath(); g.moveTo(4, 0); g.lineTo(10, -9); g.lineTo(7, 0); g.lineTo(10, 9); g.fill();
  } else if(h === 6){ // crown
    g.fillStyle = '#5a3a20'; g.beginPath(); g.arc(0, 0, 6, 0, 7); g.fill();
    g.fillStyle = '#ffcf4a';
    for(let i = 0; i < 6; i++){ const a = i/6*Math.PI*2 + t*0.5; g.beginPath(); g.arc(Math.cos(a)*6, Math.sin(a)*6, 2.2, 0, 7); g.fill(); }
    g.strokeStyle = '#ffcf4a'; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 6, 0, 7); g.stroke();
  } else if(h === 7){ // halo
    g.fillStyle = '#f0d070'; g.beginPath(); g.arc(1, 0, 6, 0, 7); g.fill();
    g.globalCompositeOperation = 'lighter'; g.strokeStyle = '#fff3b0'; g.lineWidth = 2.5; g.beginPath(); g.arc(0, 0, 10, 0, 7); g.stroke();
    g.drawImage(glow('#fff3b0'), -16, -16, 32, 32); g.globalCompositeOperation = 'source-over';
  }
}

// ---------- enemies ----------
function drawEnemy(e, t){
  const hue = (ZONES[zoneIdx(S.stage)].hue + e.seed * 9) % 360;
  const body = e.flash > 0 ? '#ffffff' : `hsl(${hue},65%,${e.boss ? 42 : 52}%)`, dark = `hsl(${hue},60%,28%)`;
  ctx.save(); ctx.translate(e.x, e.y);
  let sc = Math.min(1, (R.time - e.born) / 0.25);
  if(e.dead){ sc *= Math.max(0, e.die / 0.3); ctx.globalAlpha = Math.max(0, e.die / 0.3); }
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, e.r*0.55, e.r*1.05*sc, e.r*0.5*sc, 0, 0, 7); ctx.fill();
  ctx.scale(sc, sc);
  const face = Math.atan2(-e.y, -e.x);
  if(e.lunge > 0) ctx.translate(Math.cos(face)*6, Math.sin(face)*6);
  const r = e.r, fx = Math.cos(face), fy = Math.sin(face);
  const eyes = (d, sp, er, col = '#fff') => {
    const px = -fy, py = fx;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(fx*d + px*sp, fy*d + py*sp, er, 0, 7); ctx.arc(fx*d - px*sp, fy*d - py*sp, er, 0, 7); ctx.fill();
    if(col === '#fff'){ ctx.fillStyle = '#1b1530'; ctx.beginPath(); ctx.arc(fx*(d+er*0.4) + px*sp, fy*(d+er*0.4) + py*sp, er*0.5, 0, 7); ctx.arc(fx*(d+er*0.4) - px*sp, fy*(d+er*0.4) - py*sp, er*0.5, 0, 7); ctx.fill(); }
  };
  if(e.kind === 'slime'){
    const w = 1 + Math.sin(t*6 + e.seed)*0.08;
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 0, r*w, r/w, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-r*0.3, -r*0.35, r*0.35, r*0.2, -0.5, 0, 7); ctx.fill();
    eyes(r*0.35, r*0.35, r*0.24);
  } else if(e.kind === 'bat'){
    const fl = Math.sin(t*22 + e.seed) * 0.5 + 1;
    ctx.fillStyle = dark;
    ctx.save(); ctx.rotate(face);
    ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(-6, -r*1.6*fl); ctx.lineTo(-2, -r*0.9*fl); ctx.lineTo(-8, -r*1.1*fl); ctx.lineTo(-2, -3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(-6, r*1.6*fl); ctx.lineTo(-2, r*0.9*fl); ctx.lineTo(-8, r*1.1*fl); ctx.lineTo(-2, 3); ctx.fill();
    ctx.restore();
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, 0, r*0.8, 0, 7); ctx.fill();
    eyes(r*0.35, r*0.3, r*0.18, '#ff3b3b');
  } else if(e.kind === 'goblin'){
    ctx.save(); ctx.rotate(face);
    ctx.fillStyle = '#8a8a8a'; ctx.fillRect(0, r*0.6, r*1.8, 2.5);
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(0, -r*0.6); ctx.lineTo(-r*0.5, -r*1.5); ctx.lineTo(r*0.3, -r*0.7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, r*0.6); ctx.lineTo(-r*0.5, r*1.5); ctx.lineTo(r*0.3, r*0.7); ctx.fill();
    ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(-2, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(1, 0, r*0.75, 0, 7); ctx.fill();
    ctx.restore();
    eyes(r*0.4, r*0.28, r*0.18, '#ffe14d');
  } else if(e.kind === 'golem'){
    ctx.save(); ctx.rotate(face + Math.sin(t*3 + e.seed)*0.08);
    ctx.fillStyle = dark; ctx.fillRect(-r*0.3, -r*1.35, r*0.9, r*0.6); ctx.fillRect(-r*0.3, r*0.75, r*0.9, r*0.6);
    ctx.fillStyle = body; ctx.beginPath(); ctx.moveTo(-r, -r*0.8); ctx.lineTo(r*0.6, -r); ctx.lineTo(r, 0); ctx.lineTo(r*0.6, r); ctx.lineTo(-r, r*0.8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-r*0.5, -r*0.5); ctx.lineTo(0, 0); ctx.lineTo(-r*0.3, r*0.5); ctx.stroke();
    ctx.restore();
    ctx.globalCompositeOperation = 'lighter'; dglow('#ffcc33', fx*r*0.55, fy*r*0.55, r*0.6, 0.8); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  } else { // boss
    ctx.globalCompositeOperation = 'lighter'; dglow('#ff2a4a', 0, 0, r*2.2, 0.35 + 0.15*Math.sin(t*4)); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = dark;
    for(let i = 0; i < 12; i++){ const a = i/12*Math.PI*2 + t*0.8; ctx.beginPath(); ctx.moveTo(Math.cos(a-0.15)*r*0.9, Math.sin(a-0.15)*r*0.9); ctx.lineTo(Math.cos(a)*r*1.35, Math.sin(a)*r*1.35); ctx.lineTo(Math.cos(a+0.15)*r*0.9, Math.sin(a+0.15)*r*0.9); ctx.fill(); }
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.arc(0, 0, r*0.7, 0, 7); ctx.fill();
    ctx.save(); ctx.rotate(face);
    ctx.fillStyle = '#ffcf4a'; ctx.beginPath();
    ctx.moveTo(-r*0.5, -r*0.35); ctx.lineTo(-r*0.85, -r*0.4); ctx.lineTo(-r*0.6, -r*0.15); ctx.lineTo(-r*0.95, 0); ctx.lineTo(-r*0.6, r*0.15); ctx.lineTo(-r*0.85, r*0.4); ctx.lineTo(-r*0.5, r*0.35); ctx.fill();
    ctx.restore();
    eyes(r*0.45, r*0.3, r*0.16, '#ff3030');
    ctx.globalCompositeOperation = 'lighter'; dglow('#ff3030', fx*r*0.45 - fy*r*0.3, fy*r*0.45 + fx*r*0.3, 8, 0.8); dglow('#ff3030', fx*r*0.45 + fy*r*0.3, fy*r*0.45 - fx*r*0.3, 8, 0.8); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  if(e.frozen > 0){ ctx.fillStyle = 'rgba(180,235,255,.55)'; ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 7); ctx.fill(); ctx.strokeStyle = '#e8fbff'; ctx.lineWidth = 1.5; ctx.stroke(); }
  else if(e.slow > 0){ ctx.strokeStyle = 'rgba(150,220,255,.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, r + 2, 0, 7); ctx.stroke(); }
  if(e.stun > 0 && e.frozen <= 0){ ctx.fillStyle = '#ffe14d'; for(let i = 0; i < 3; i++){ const a = t*6 + i*2.1; ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.7, -r - 4 + Math.sin(a)*2, 1.8, 0, 7); ctx.fill(); } }
  ctx.restore();
}

function render(now){
  if(!W) resize();
  const t = R.time;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  let sx = 0, sy = 0; if(R.shake > 0){ const m = Math.min(R.shake, 0.6) * 22; sx = rand(-m, m); sy = rand(-m, m); }
  ctx.save();
  ctx.translate(W*HERO_SX + sx, H/2 + sy); ctx.scale(K, K);
  // ground
  ctx.fillStyle = groundPattern(zoneIdx(S.stage)); ctx.fillRect(VX0 - 30, -HH - 30, VX1 - VX0 + 60, HH*2 + 60);
  // decals
  for(const d of FX.decals){
    const a = Math.min(1, d.life / d.max * 2);
    if(d.kind === 'scorch'){ ctx.globalAlpha = a * 0.5; ctx.fillStyle = '#120804'; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r*0.8, 0, 0, 7); ctx.fill(); }
    else { ctx.globalAlpha = a * 0.7; ctx.strokeStyle = '#1a0f08'; ctx.lineWidth = 3; ctx.beginPath(); d.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#ff7a2a'; ctx.lineWidth = 1; ctx.globalAlpha = a * 0.6; ctx.stroke(); ctx.globalCompositeOperation = 'source-over'; }
  }
  ctx.globalAlpha = 1;
  // poison clouds
  for(const c of FX.clouds){
    const a = Math.min(1, c.life, (c.max - c.life) * 4);
    for(let i = 0; i < 6; i++){ const ang = c.seed + i + t*0.6, d = c.r*0.45; ctx.globalAlpha = 0.28 * a; ctx.fillStyle = i % 2 ? '#4fd12a' : '#7dff4a';
      ctx.beginPath(); ctx.arc(c.x + Math.cos(ang)*d, c.y + Math.sin(ang)*d, c.r*0.6, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // black holes
  for(const h of FX.holes){
    const a = Math.min(1, h.life * 3, (h.max - h.life) * 4), rr = h.r * 0.35 * a;
    ctx.globalCompositeOperation = 'lighter';
    dglow('#9b4dff', h.x, h.y, h.r * 1.1, 0.45 * a);
    ctx.strokeStyle = '#d8b0ff'; ctx.lineWidth = 3;
    for(let i = 0; i < 3; i++){ ctx.globalAlpha = 0.7 * a; ctx.beginPath(); ctx.arc(h.x, h.y, rr * (1.3 + i*0.35), t*(4 + i) + i*2, t*(4 + i) + i*2 + 2.2); ctx.stroke(); }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(h.x, h.y, rr, 0, 7); ctx.fill();
  }
  // meteor shadows
  for(const m of FX.meteors){ const p = Math.max(0, m.t / m.dur); ctx.fillStyle = `rgba(0,0,0,${0.15 + p*0.35})`; ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 0.5 * p + 4, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(255,90,30,${p})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.stroke(); }

  // enemies (sorted by y) + hero
  const sorted = E.slice().sort((a, b) => a.y - b.y);
  let heroDrawn = false;
  const drawH = () => {
    if(R.dead > 0){ ctx.globalAlpha = 0.3; }
    drawHero(ctx, heroLook(), {face:R.face, swing:R.swing, t, rage:R.rage > 0, immune:R.immune, hurt:R.hurt});
    ctx.globalAlpha = 1; heroDrawn = true;
  };
  for(const e of sorted){ if(!heroDrawn && e.y > 0) drawH(); drawEnemy(e, t); }
  if(!heroDrawn) drawH();

  // loot beams
  for(const L of FX.loot){
    const c = RAR[L.it.r].c;
    ctx.globalCompositeOperation = 'lighter';
    if(L.t < 0.9){ ctx.globalAlpha = 0.5; ctx.fillStyle = c; ctx.fillRect(L.x - 3, L.y - 70, 6, 70); }
    dglow(c, L.x, L.y, 14 + Math.sin(t*10)*2, 1);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(L.it.slot === 'weapon' ? WT[L.it.type].icon : AT[L.it.type].icon, L.x, L.y);
  }

  // ---- additive FX layer ----
  ctx.globalCompositeOperation = 'lighter';
  // slashes
  for(const s of FX.slashes){
    const p = 1 - s.life / s.max, a = s.life / s.max;
    const span = s.spin ? Math.PI * 2 : s.arc;
    const start = s.a - span/2, sweep = span * Math.min(1, p * 1.6);
    for(let k = 0; k < 3; k++){
      ctx.globalAlpha = a * (0.5 - k*0.13); ctx.strokeStyle = k ? s.c : '#ffffff'; ctx.lineWidth = (10 - k*3);
      ctx.beginPath(); ctx.arc(0, 0, s.r * (0.82 + k*0.1), start, start + sweep); ctx.stroke();
    }
  }
  // orbit blades
  if(pw('blades')){
    const l = pw('blades'), ev = l >= PW_MAX, n = ev ? 8 : 2 + Math.floor(l/3), r = (ev ? 74 : 52) * aoeMul(), sz = ev ? 14 : 9;
    for(let i = 0; i < n; i++){
      const a = R.bladeA + i * Math.PI * 2 / n;
      ctx.globalAlpha = 0.35; ctx.strokeStyle = ev ? '#ffd36b' : '#7fe0ff'; ctx.lineWidth = sz;
      ctx.beginPath(); ctx.arc(0, 0, r, a - 0.6, a); ctx.stroke();
      const bx = Math.cos(a)*r, by = Math.sin(a)*r;
      dglow(ev ? '#ffd36b' : '#7fe0ff', bx, by, sz*1.8, 0.9);
      ctx.globalAlpha = 1; ctx.save(); ctx.translate(bx, by); ctx.rotate(t*14);
      ctx.fillStyle = '#ffffff'; ctx.beginPath();
      for(let k = 0; k < 4; k++){ const q = k*Math.PI/2; ctx.lineTo(Math.cos(q)*sz, Math.sin(q)*sz); ctx.lineTo(Math.cos(q + 0.5)*sz*0.3, Math.sin(q + 0.5)*sz*0.3); }
      ctx.fill(); ctx.restore();
    }
  }
  // projectiles
  for(const p of FX.projs){
    if(p.kind === 'arrow'){ ctx.globalAlpha = 1; ctx.strokeStyle = p.c; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - Math.cos(p.a)*16, p.y - Math.sin(p.a)*16); ctx.stroke(); dglow(p.c, p.x, p.y, 8, 0.8); }
    else if(p.kind === 'fire'){ dglow('#ff6a1a', p.x, p.y, 26, 0.9); dglow('#ffe08a', p.x, p.y, 10, 1); }
    else { dglow(p.c, p.x, p.y, 16, 0.9); dglow('#ffffff', p.x, p.y, 6, 1); }
  }
  // meteors (falling)
  for(const m of FX.meteors){
    if(m.t < 0) continue;
    const p = m.t / m.dur, mx = m.x - (1-p)*70, my = m.y - (1-p)*300;
    ctx.globalAlpha = 0.7; ctx.strokeStyle = '#ff7a2a'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mx - 30, my - 120); ctx.stroke();
    dglow('#ff5a1a', mx, my, 34, 1); dglow('#fff0b0', mx, my, 14, 1);
  }
  // beams
  for(const b of FX.beams){
    const a = b.life / b.max, cx = Math.cos(b.a), cy = Math.sin(b.a), L = 520;
    ctx.lineCap = 'round';
    [[b.w*3, '#ffd36b', 0.25], [b.w, '#fff3a0', 0.8], [b.w*0.35, '#ffffff', 1]].forEach(([w, c, al]) => {
      ctx.globalAlpha = al * a; ctx.strokeStyle = c; ctx.lineWidth = w * (0.6 + a*0.4);
      ctx.beginPath(); ctx.moveTo(cx*14, cy*14); ctx.lineTo(cx*L, cy*L); ctx.stroke();
    });
    ctx.lineCap = 'butt';
    dglow('#fff3a0', cx*16, cy*16, b.w*2.5, a);
  }
  // lightning
  for(const b of FX.bolts){
    const a = b.life / b.max;
    const path = () => { ctx.beginPath(); b.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); };
    ctx.globalAlpha = 0.35 * a; ctx.strokeStyle = '#6fd0ff'; ctx.lineWidth = b.w * 4; path(); ctx.stroke();
    ctx.globalAlpha = a; ctx.strokeStyle = '#e8f8ff'; ctx.lineWidth = b.w; path(); ctx.stroke();
    const [ex, ey] = b.pts[b.pts.length - 1]; dglow('#9be7ff', ex, ey, 22, a);
  }
  // rings
  for(const r of FX.rings){
    const p = 1 - r.life / r.max, rad = r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - p, 3)), a = r.life / r.max;
    ctx.globalAlpha = a * 0.35; ctx.strokeStyle = r.color; ctx.lineWidth = r.w * 2.2; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 7); ctx.stroke();
    ctx.globalAlpha = a; ctx.lineWidth = r.w * 0.5; ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 7); ctx.stroke();
  }
  // particles
  for(const p of FX.parts){
    const a = Math.min(1, p.life / p.max * 1.5);
    if(p.dust){ ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a * 0.6; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size); ctx.globalCompositeOperation = 'lighter'; continue; }
    if(p.shard){ ctx.globalAlpha = a; ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - Math.cos(p.a)*p.size*2.5, p.y - Math.sin(p.a)*p.size*2.5); ctx.stroke(); continue; }
    dglow(p.color, p.x, p.y, p.size * 2, a);
  }
  // hero aura sparks
  const lk = S.look; const auraC = LOOK.aura[lk.aura]?.c;
  if(auraC && R.dead <= 0 && Math.random() < 0.5){
    const c = auraC === 'rainbow' ? `hsl(${Math.floor(rand(0,360))},100%,60%)` : auraC;
    FX.parts.push({x:rand(-12,12), y:rand(-6,10), vx:rand(-8,8), vy:rand(-50,-25), life:0.7, max:0.7, size:rand(1.5,3), color:c});
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  // enemy hp bars
  for(const e of E){
    if(e.dead || e.hp >= e.maxHp) continue;
    const w = e.boss ? 60 : e.r * 2.2, y = e.y - e.r - (e.boss ? 18 : 8);
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(e.x - w/2 - 1, y - 1, w + 2, e.boss ? 6 : 4);
    ctx.fillStyle = e.boss ? '#ff3b6b' : '#ff6b7d'; ctx.fillRect(e.x - w/2, y, w * Math.max(0, e.hp / e.maxHp), e.boss ? 4 : 2);
  }
  // hero hp
  { const w = 34, y = HERO_R + 10; ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(-w/2 - 1, y - 1, w + 2, 5);
    const f = Math.max(0, R.hp) / maxHp(); ctx.fillStyle = f > 0.3 ? '#5be38a' : '#ff5d73'; ctx.fillRect(-w/2, y, w * f, 3); }

  // floating text
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  for(const tx of FX.texts){
    const a = Math.min(1, tx.life * 3), age = 0.9 - tx.life, s = tx.pop ? 1 + Math.max(0, 0.15 - age) * 4 : 1;
    ctx.globalAlpha = a; ctx.font = `900 ${tx.size * s}px system-ui`;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(tx.txt, tx.x, tx.y);
    ctx.fillStyle = tx.color; ctx.fillText(tx.txt, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // ---- screen-space overlay ----
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W, H)*0.35, W/2, H/2, Math.max(W, H)*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if(R.flash > 0){ ctx.globalAlpha = Math.min(0.6, R.flash); ctx.fillStyle = R.flashC; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if(R.hurt > 0){ ctx.globalAlpha = R.hurt * 2; ctx.strokeStyle = '#ff2a4a'; ctx.lineWidth = 10; ctx.strokeRect(0, 0, W, H); ctx.globalAlpha = 1; }

  ctx.textAlign = 'center';
  if(isBoss(S.stage) && R.dead <= 0 && !(R.pendingStage > 0)){
    ctx.fillStyle = '#000a'; rr(W/2 - 72, 8, 144, 24, 12); ctx.fill();
    ctx.fillStyle = R.bossT < 8 ? '#ff5d73' : '#ffcf4a'; ctx.font = '800 13px system-ui';
    ctx.fillText('👑 BOSS  ' + Math.max(0, R.bossT).toFixed(1) + 's', W/2, 25);
  }
  if(R.banner > 0){
    const a = Math.min(1, R.banner * 2, (1.6 - R.banner) * 4);
    ctx.globalAlpha = a; ctx.font = '900 26px system-ui'; ctx.lineWidth = 5; ctx.strokeStyle = '#000';
    ctx.strokeText(R.bannerTxt, W/2, H*0.32); ctx.fillStyle = isBoss(S.stage) ? '#ff5d73' : '#fff'; ctx.fillText(R.bannerTxt, W/2, H*0.32);
    ctx.globalAlpha = 1;
  }
  if(R.dead > 0){
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '800 18px system-ui'; ctx.fillText('Recovering…', W/2, H/2);
  }
  // power cooldown icons
  let ix = 8, iy = H - 38;
  for(const p of PW){
    if(!p.cd || !pw(p.id)) continue;
    const full = p.cd(pw(p.id)) * cdMul(), frac = Math.max(0, Math.min(1, (R.cd[p.id] ?? full) / full)), ev = evo(p.id);
    ctx.fillStyle = '#000b'; rr(ix, iy, 30, 30, 8); ctx.fill();
    if(ev){ ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 2; rr(ix, iy, 30, 30, 8); ctx.stroke(); }
    ctx.font = '16px system-ui'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(ev ? p.eicon : p.icon, ix + 15, iy + 16);
    if(frac > 0){ ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(ix, iy + 30*(1 - frac), 30, 30*frac); }
    if(p.id === 'rage' && R.rage > 0){ ctx.strokeStyle = '#ff7a45'; ctx.lineWidth = 2; rr(ix, iy, 30, 30, 8); ctx.stroke(); }
    ix += 34;
    if(ix > W - 40){ ix = 8; iy -= 34; }
  }
  ctx.textBaseline = 'alphabetic';
}
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function buyPlan(u){
  const lvl = up(u.id), cap = u.max ?? Infinity;
  const want = S.buyAmt === 'max' ? Infinity : +S.buyAmt;
  let n = 0, cost = 0;
  while(n < want && lvl + n < cap && n < 1000){
    const c = upCost(u, lvl + n);
    if(S.buyAmt === 'max' && cost + c > S.gold) break;
    cost += c; n++;
  }
  if(S.buyAmt === 'max' && n === 0 && lvl < cap){ n = 1; cost = upCost(u, lvl); }
  return {n, cost, maxed: lvl >= cap};
}

  const base = it.slot === 'weapon' ? WT[it.type].info : AT[it.type].info;
  const lines = [`<b style="color:var(--text)">+${it.main}% ${it.slot === 'weapon' ? 'Attack' : 'Max HP'}</b>${delta}`, base, ...it.afx.map(([k, v]) => AFX[k].f(v))];

}

function findItem(uid){ return S.eq.weapon.uid === uid ? S.eq.weapon : S.eq.armor.uid === uid ? S.eq.armor : S.inv.find(i => i.uid === uid); }

function updatePanel(){
  if(tab === 'upg'){
    for(const u of UPG){
      const d = document.querySelector(`[data-desc="${u.id}"]`); if(d) d.textContent = u.desc();
      const lv = document.querySelector(`[data-uplv="${u.id}"]`); if(lv) lv.textContent = `Lv ${up(u.id)}${u.max ? '/' + u.max : ''}`;

      const {n, cost, maxed} = buyPlan(u);
      if(maxed){ b.className = 'buy max'; setHTML(b, 'MAX'); b.disabled = true; continue; }
      b.disabled = false;
      b.className = 'buy' + (S.gold >= cost ? ' can' : '');
      setHTML(b, `🪙 ${fmt(cost)}<small>+${n} level${n > 1 ? 's' : ''}</small>`);
    }
  } else if(tab === 'pow'){
    for(const p of PW){
      const l = pw(p.id), locked = S.heroLvl < p.req, ev = l >= PW_MAX;
      const row = document.querySelector(`[data-pwrow="${p.id}"]`); if(!row) continue;
      row.classList.toggle('locked', locked);
      row.querySelector('.ic').textContent = ev ? p.eicon : p.icon;
      row.querySelector('.ic').classList.toggle('evo', ev);
      setHTML(row.querySelector('[data-pwname]'), ev ? `<span style="color:var(--gold)">${p.evo}</span>` : p.name);
      row.querySelector('[data-pwlv]').textContent = locked ? `Unlocks at hero Lv ${p.req}` : ev ? 'EVOLVED' : `Lv ${l}/${PW_MAX}`;
      let desc = l ? p.info(l) : p.info(1);
      if(l && !ev) desc += `<br><span class="up">Next: ${p.info(l + 1)}</span>`;
      if(!ev && l < PW_MAX - 1) desc += `<br><span class="evo">At Lv ${PW_MAX} evolves → ${p.eicon} ${p.evo}</span>`;
      setHTML(row.querySelector('[data-pwdesc]'), desc);
      const pips = row.querySelector('[data-pips]'); pips.classList.toggle('evo', ev);
      setHTML(pips, Array.from({length:PW_MAX}, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join(''));
      const b = row.querySelector('.buy');

      else if(locked){ b.className = 'buy'; setHTML(b, '🔒'); b.disabled = true; }

        b.disabled = false;

  } else if(tab === 'stats'){
    const b = activeBuild();

      ['Current stage', S.stage], ['Best stage ever', S.bestStage], ['Enemies defeated', fmt(S.totalKills)],
      ['Bosses defeated', fmt(S.bossKills)], ['Items found', fmt(S.itemsFound)], ['Gold earned (all time)', fmt(S.totalGold)], ['Ascensions', S.ascensions],
      ['Build', b ? b.icon + ' ' + b.n : '—'],
      ['Attack', fmt(atk())], ['Attacks/sec', aps().toFixed(2)], ['Crit', `${Math.round(critCh()*100)}% ×${critMul().toFixed(1)}`],
      ['Power damage', '+' + pct(powerMul() - 1)], ['Cooldowns', '-' + pct(1 - cdMul())], ['Damage taken', pct(dmgTaken())],
      ['Gold/sec (approx)', fmt(farmRate().gps)], ['Time played', fmtTime(S.played)],
    ];
    setHTML($('statList'), rows.map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join(''));

function drawLookPreview(){

  const sw = (t % 1.6) < 0.22 ? 0.22 - (t % 1.6) : 0;
