<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Power Surge">
<title>Power Surge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#120f24; --panel:#1c1836; --card:#262047; --card2:#2f2858; --line:#3a3366;
    --text:#f2eeff; --dim:#a79fcc; --gold:#ffcf4a; --soul:#9be7ff; --good:#5be38a; --bad:#ff5d73; --accent:#a77bff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  #top{display:flex;align-items:center;gap:8px;padding:8px 12px}
  .res{display:flex;align-items:center;gap:6px;background:var(--panel);padding:6px 10px;border-radius:999px;font-weight:700}
  #gold{color:var(--gold)} #souls{color:var(--soul)}
  #giftBtn{margin-left:auto;background:var(--panel);padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px}
  #giftBtn.ready{background:linear-gradient(135deg,#ff8a3d,#ff3d8a);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  #stagebar{display:flex;align-items:center;gap:10px;padding:0 12px 8px}
  #stageInfo{flex:1;min-width:0}
  #stageTxt{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stageSub{font-size:12px;color:var(--dim)}
  .bar{height:8px;background:#0b0918;border-radius:99px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .15s}
  #farmBtn{background:var(--card);padding:8px 10px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap}
  #farmBtn.on{background:#21533a;color:#bfffd6}
  #farmBtn.off{background:#5a2333;color:#ffd0d8}
  #battle{position:relative;height:38vh;min-height:220px;max-height:340px;margin:0 12px;border-radius:16px;overflow:hidden;background:#000;touch-action:manipulation}
  #cv{width:100%;height:100%;display:block}
  #tapHint{position:absolute;bottom:8px;right:10px;font-size:11px;color:#fff;opacity:.75;pointer-events:none;text-shadow:0 1px 2px #000}
  #herobar{display:flex;align-items:center;gap:10px;padding:10px 12px 6px;font-size:14px}
  #herobar .bar{flex:1;margin:0;height:10px}
  #herobar .bar i{background:linear-gradient(90deg,#5bd1ff,#a77bff)}
  #spBadge{background:var(--accent);color:#fff;font-weight:800;font-size:12px;padding:3px 8px;border-radius:99px}
  #spBadge:empty{display:none}
  #tabs{display:flex;gap:6px;padding:4px 12px}
  #tabs button{flex:1;background:var(--panel);padding:10px 4px;border-radius:12px;font-weight:700;font-size:13px;position:relative}
  #tabs button.active{background:var(--accent);color:#fff}
  #tabs button .dot{position:absolute;top:5px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
  #tabs button.alert .dot{display:block}
  #buyRow{display:flex;gap:6px;align-items:center;padding:6px 12px 0;font-size:12px;color:var(--dim)}
  #buyRow button{background:var(--panel);padding:5px 10px;border-radius:8px;font-weight:700;font-size:12px}
  #buyRow button.active{background:var(--card2);color:var(--gold)}
  #panel{flex:1;overflow-y:auto;padding:8px 12px 16px;-webkit-overflow-scrolling:touch}
  .item{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:8px}
  .item .ic{font-size:26px;width:40px;height:40px;display:grid;place-items:center;background:var(--card);border-radius:10px;flex:none}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:800;font-size:14px}
  .item .nm small{color:var(--dim);font-weight:600;margin-left:4px}
  .item .ds{font-size:12px;color:var(--dim);margin-top:2px}
  .item.locked{opacity:.5}
  .buy{background:var(--card2);border-radius:10px;padding:8px 10px;min-width:84px;text-align:center;font-weight:800;font-size:13px;line-height:1.15}
  .buy small{display:block;font-weight:600;font-size:11px;color:var(--dim)}
  .buy.can{background:linear-gradient(135deg,#3b8f5a,#2a6e44);color:#fff}
  .buy.can small{color:#d4ffe2}
  .buy:disabled{cursor:default}
  .buy.max{background:var(--card);color:var(--dim)}
  .card{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5}
  .card h3{margin:0 0 6px;font-size:16px}
  .card .big{font-size:28px;font-weight:900;color:var(--soul)}
  .btn{display:block;width:100%;padding:12px;border-radius:12px;font-weight:800;font-size:15px;background:var(--accent);color:#fff;margin-top:10px}
  .btn:disabled{background:var(--card);color:var(--dim)}
  .btn.danger{background:#5a2333}
  .stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
  .stat:last-child{border:0}
  .stat b{color:var(--text)}
  #modal{position:fixed;inset:0;background:rgba(5,3,15,.75);display:grid;place-items:center;z-index:10;padding:20px}
  #modal[hidden]{display:none}
  #modalBox{background:var(--panel);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center;border:1px solid var(--line)}
  #modalBox h2{margin:0 0 8px}
  #modalBox p{color:var(--dim);margin:6px 0}
  #modalBox .reward{font-size:22px;font-weight:900;margin:12px 0}
  #toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:#000c;padding:10px 16px;border-radius:12px;
    font-weight:700;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="res" title="Gold"><span>🪙</span><b id="gold">0</b></div>
    <div class="res" title="Souls (permanent bonus)"><span>👻</span><b id="souls">0</b></div>
    <button id="giftBtn">🎁 <span id="giftTxt"></span></button>
  </header>
  <div id="stagebar">
    <div id="stageInfo">
      <div id="stageTxt">Stage 1</div>
      <div class="bar"><i id="stageFill"></i></div>
      <div id="stageSub"></div>
    </div>
    <button id="farmBtn" class="on">⏩ Auto</button>
  </div>
  <div id="battle"><canvas id="cv"></canvas><div id="tapHint">Tap to strike!</div></div>
  <div id="herobar">
    <span>Hero Lv <b id="lvl">1</b></span>
    <div class="bar"><i id="xpFill"></i></div>
    <span id="spBadge"></span>
  </div>
  <nav id="tabs">
    <button data-tab="upg" class="active">⚔️ Upgrades<span class="dot"></span></button>
    <button data-tab="pow">✨ Powers<span class="dot"></span></button>
    <button data-tab="asc">👻 Ascend<span class="dot"></span></button>
    <button data-tab="stats">📊 Stats<span class="dot"></span></button>
  </nav>
  <div id="buyRow">Buy:
    <button data-amt="1" class="active">x1</button><button data-amt="10">x10</button><button data-amt="max">Max</button>
  </div>
  <div id="panel"></div>
</div>
<div id="modal" hidden><div id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
// ---------- Save data ----------
const SAVE_KEY = 'powersurge-idle-v1';
const OFFLINE_CAP = 12 * 3600;      // seconds of offline progress that count
const GIFT_EVERY = 2 * 3600 * 1000; // free gift cooldown (ms)
const ENEMIES_PER_STAGE = 10;
const BOSS_TIME = 30;

function freshSave(){
  return {v:1, gold:0, souls:0, stage:1, maxStage:1, bestStage:1, kills:0, farm:false,
    heroLvl:1, xp:0, sp:0, up:{}, pw:{}, last:Date.now(), giftAt:0,
    totalKills:0, totalGold:0, bossKills:0, ascensions:0, played:0, buyAmt:'1'};
}
let S = freshSave();
try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) S = Object.assign(freshSave(), JSON.parse(raw)); }catch(e){}
function persist(){ S.last = Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

// ---------- Number formatting ----------
const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  let i = 0;
  while(n >= 1000 && i < SUF.length - 1){ n /= 1000; i++; }
  if(n >= 1000) return n.toExponential(2);
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + SUF[i];
}
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if(h) return h + 'h ' + m + 'm';
  if(m) return m + 'm ' + s + 's';
  return s + 's';
}

// ---------- Upgrades (bought with gold) ----------
const UPG = [
  {id:'atk',   name:'Sharpen Blade', icon:'⚔️', base:8,  g:1.15, desc:()=>`Attack: ${fmt(atk())}`},
  {id:'hp',    name:'Toughen Up',    icon:'❤️', base:10, g:1.15, desc:()=>`Max HP: ${fmt(maxHp())}`},
  {id:'spd',   name:'Quick Hands',   icon:'💨', base:25, g:1.22, max:80, desc:()=>`Attacks/sec: ${baseAps().toFixed(2)}`},
  {id:'crit',  name:'Keen Eye',      icon:'🎯', base:50, g:1.2,  max:55, desc:()=>`Crit chance: ${Math.round(critCh()*100)}% (x${CRIT_MUL} dmg)`},
  {id:'regen', name:'Second Wind',   icon:'🌿', base:30, g:1.18, max:40, desc:()=>`Regen: ${(regenPct()*100).toFixed(2)}% HP/sec`},
  {id:'tap',   name:'Mighty Tap',    icon:'👆', base:15, g:1.15, desc:()=>`Tap damage: ${fmt(tapDmg())}`},
  {id:'greed', name:'Greed',         icon:'🪙', base:40, g:1.17, desc:()=>`Gold bonus: +${Math.round((goldMul()/soulMul()-1)*100)}%`},
];
const up = id => S.up[id] || 0;
const upCost = (u, lvl) => u.base * Math.pow(u.g, lvl);

// ---------- Powers (bought with skill points from hero levels) ----------
const PW = [
  {id:'fireball', name:'Fireball',     icon:'🔥', req:1,  max:10, cd:7,  active:true,
    desc:l=>`Every 7s blast the enemy for ${4+2*l}× Attack.`},
  {id:'lightning',name:'Lightning',    icon:'⚡', req:2,  max:10, cd:5,  active:true,
    desc:l=>`Every 5s strike for ${2+l}× Attack and stun for 1.2s.`},
  {id:'heal',     name:'Healing Light',icon:'💚', req:4,  max:10, cd:12, active:true,
    desc:l=>`When hurt, heal ${15+5*l}% HP (every 12s).`},
  {id:'vamp',     name:'Vampiric Edge',icon:'🩸', req:6,  max:10,
    desc:l=>`Heal ${(1.5*l).toFixed(1)}% of damage dealt.`},
  {id:'frost',    name:'Frost Aura',   icon:'❄️', req:9,  max:8,
    desc:l=>`Enemies attack ${8*l}% slower.`},
  {id:'rage',     name:'Berserk',      icon:'😤', req:12, max:10, cd:25, active:true,
    desc:l=>`Every 25s go berserk: +${50+10*l}% attack speed for 6s.`},
  {id:'shield',   name:'Iron Skin',    icon:'🛡️', req:16, max:8,
    desc:l=>`Take ${6*l}% less damage.`},
  {id:'midas',    name:'Midas Touch',  icon:'💰', req:20, max:10,
    desc:l=>`+${15*l}% gold from every enemy.`},
];
const pw = id => S.pw[id] || 0;

// ---------- Hero stats ----------
const CRIT_MUL = 2.5;
const soulMul = () => 1 + 0.1 * S.souls;
const lvlMul  = () => Math.pow(1.03, S.heroLvl - 1);
function atk(){ const l = up('atk'); return 5 * (1 + l) * Math.pow(1.05, l) * soulMul() * lvlMul(); }
function maxHp(){ const l = up('hp'); return 60 * (1 + 0.6*l) * Math.pow(1.05, l) * lvlMul() * (1 + 0.05*S.souls); }
function baseAps(){ return 1 + 0.05 * up('spd'); }
function aps(){ return baseAps() * (R.rage > 0 ? 1 + (50 + 10*pw('rage'))/100 : 1); }
function critCh(){ return Math.min(0.6, 0.05 + 0.01 * up('crit')); }
function regenPct(){ return 0.02 + 0.0025 * up('regen'); }
function tapDmg(){ return atk() * 0.25 * (1 + up('tap')); }
function goldMul(){ return (1 + 0.1*up('greed')) * (1 + 0.15*pw('midas')) * soulMul(); }
const xpNeed = L => 8 * Math.pow(1.22, L - 1);

// ---------- Enemies ----------
const isBoss = s => s % 10 === 0;
function enemyStats(s, boss){
  return {
    hp:   10 * Math.pow(1.22, s-1) * (boss ? 8 : 1),
    dmg:  4  * Math.pow(1.14, s-1) * (boss ? 2 : 1),
    gold: 2  * Math.pow(1.15, s-1) * (boss ? 8 : 1),
    xp:   2  * Math.pow(1.1,   s-1) * (boss ? 5 : 1),
  };
}
const ZONES = [
  {name:'Green Meadow',   sky:['#6fb8ff','#cdeaff'], hill:'#6dbb63', hill2:'#4f9a4a', ground:'#3d7a37', hue:110},
  {name:'Scorched Desert',sky:['#ff9a5a','#ffe0a3'], hill:'#e0a95b', hill2:'#c58a42', ground:'#a8713a', hue:30},
  {name:'Frozen Peaks',   sky:['#8fb6e8','#e9f4ff'], hill:'#cfe3f5', hill2:'#a9c6e3', ground:'#8fb0d0', hue:200},
  {name:'Molten Core',    sky:['#3a0d0d','#a3301a'], hill:'#5a1f17', hill2:'#3d1410', ground:'#2a0d0a', hue:10},
  {name:'The Void',       sky:['#0b0620','#3a1f6b'], hill:'#2b1850', hill2:'#1d1038', ground:'#140a28', hue:280},
];
const ROMAN = ['','II','III','IV','V','VI','VII','VIII','IX','X'];
function zoneOf(s){ const z = Math.floor((s-1)/10); return {z:ZONES[z % ZONES.length], tier:Math.floor(z / ZONES.length)}; }
function zoneName(s){ const {z,tier} = zoneOf(s); return z.name + (tier ? ' ' + (ROMAN[tier] || tier+1) : ''); }
const KINDS = ['slime','bat','goblin','golem'];

// ---------- Runtime state ----------
const R = {hp:0, atkT:0, enemy:null, dead:0, cd:{}, rage:0, stun:0, bossT:0,
  swing:0, hurt:0, scroll:0, texts:[], parts:[], proj:[], bolts:[], shake:0};

function spawn(){
  const boss = isBoss(S.stage);
  const st = enemyStats(S.stage, boss);
  R.enemy = Object.assign(st, {maxHp:st.hp, boss, kind: boss ? 'boss' : KINDS[(S.stage*7 + S.kills*3) % KINDS.length],
    atkT:0, flash:0, x:1.4, die:0, seed:Math.random()*10});
  R.walk = 0.6; R.stun = 0;
  if(boss) R.bossT = BOSS_TIME;
}

// ---------- Combat ----------
function hitEnemy(dmg, opts = {}){
  const e = R.enemy; if(!e || e.die) return;
  let crit = false;
  if(!opts.noCrit && Math.random() < critCh()){ dmg *= CRIT_MUL; crit = true; }
  e.hp -= dmg; e.flash = 0.12;
  if(pw('vamp')) R.hp = Math.min(maxHp(), R.hp + dmg * 0.015 * pw('vamp'));
  addText((crit ? '💥' : '') + fmt(dmg), opts.x ?? 0.7 + (Math.random()-.5)*0.08, opts.y ?? 0.45,
    opts.color || (crit ? '#ffdd33' : '#ffffff'), crit ? 22 : 16);
  if(e.hp <= 0) killEnemy();
}
function killEnemy(){
  const e = R.enemy;
  e.die = 0.35; e.hp = 0;
  const g = e.gold * goldMul();
  S.gold += g; S.totalGold += g; S.totalKills++;
  addText('+' + fmt(g) + ' 🪙', 0.7, 0.3, '#ffcf4a', 16);
  burst(0.7, 0.62, e.boss ? 40 : 14, `hsl(${zoneOf(S.stage).z.hue},80%,60%)`);
  addXp(e.xp);
  if(e.boss){ S.bossKills++; toast('👑 Boss defeated!'); }
}
function afterKill(){
  S.kills++;
  if(R.enemy.boss || S.kills >= ENEMIES_PER_STAGE){
    S.kills = 0;
    if(!S.farm){
      S.stage++;
      if(S.stage > S.maxStage) S.maxStage = S.stage;
      if(S.stage > S.bestStage) S.bestStage = S.stage;
      if((S.stage - 1) % 10 === 0) toast('🗺️ ' + zoneName(S.stage));
      R.hp = Math.min(maxHp(), R.hp + maxHp() * 0.3);
    }
  }
  spawn();
}
function heroHurt(d){
  d *= 1 - 0.06 * pw('shield');
  R.hp -= d; R.hurt = 0.2; R.shake = 0.15;
  addText('-' + fmt(d), 0.28, 0.4, '#ff5d73', 15);
  if(R.hp <= 0) fail('💀 Defeated! Farming the previous stage.');
}
function fail(msg){
  toast(msg);
  S.farm = true;
  if(S.stage > 1) S.stage--;
  S.kills = 0; R.enemy = null; R.rage = 0;
  R.dead = 1.5; R.hp = 0;
}
function addXp(x){
  S.xp += x;
  while(S.xp >= xpNeed(S.heroLvl)){
    S.xp -= xpNeed(S.heroLvl); S.heroLvl++; S.sp++;
    R.hp = maxHp();
    toast('⭐ Hero level ' + S.heroLvl + '! +1 Skill Point');
    const unlocked = PW.find(p => p.req === S.heroLvl);
    if(unlocked) setTimeout(() => toast('✨ New power: ' + unlocked.icon + ' ' + unlocked.name), 1600);
  }
}
function castPower(id){
  const l = pw(id), e = R.enemy;
  if(id === 'fireball'){ R.proj.push({t:0, dmg: atk() * (4 + 2*l)}); return true; }
  if(id === 'lightning'){
    R.bolts.push({life:0.25});
    R.stun = 1.2;
    hitEnemy(atk() * (2 + l), {color:'#9be7ff', y:0.35});
    return true;
  }
  if(id === 'heal'){
    if(R.hp > maxHp() * 0.7) return false;
    const h = maxHp() * (15 + 5*l) / 100;
    R.hp = Math.min(maxHp(), R.hp + h);
    addText('+' + fmt(h), 0.28, 0.35, '#5be38a', 16);
    burst(0.28, 0.6, 12, '#5be38a');
    return true;
  }
  if(id === 'rage'){ R.rage = 6; addText('BERSERK!', 0.28, 0.3, '#ff7a45', 18); return true; }
  return !!e;
}

function tick(dt){
  S.played += dt;
  // fx always animate
  R.swing = Math.max(0, R.swing - dt); R.hurt = Math.max(0, R.hurt - dt); R.shake = Math.max(0, R.shake - dt);
  for(const t of R.texts){ t.life -= dt; t.y -= dt * 0.12; }
  R.texts = R.texts.filter(t => t.life > 0);
  for(const p of R.parts){ p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 1.4*dt; }
  R.parts = R.parts.filter(p => p.life > 0);
  for(const b of R.bolts) b.life -= dt;
  R.bolts = R.bolts.filter(b => b.life > 0);

  if(R.dead > 0){
    R.dead -= dt;
    if(R.dead <= 0){ R.hp = maxHp(); spawn(); }
    return;
  }
  const mh = maxHp();
  R.hp = Math.min(mh, R.hp + mh * regenPct() * dt);
  if(R.rage > 0) R.rage -= dt;

  const e = R.enemy;
  if(!e) { spawn(); return; }
  if(e.flash > 0) e.flash -= dt;

  // walking in
  if(R.walk > 0){
    R.walk -= dt; R.scroll += dt * 140;
    e.x = 0.7 + Math.max(0, R.walk) / 0.6 * 0.7;
    return;
  }
  e.x = 0.7;
  if(e.die > 0){
    e.die -= dt;
    if(e.die <= 0) afterKill();
    return;
  }

  // projectiles
  for(const p of R.proj){
    p.t += dt * 2.4;
    if(p.t >= 1 && !p.done){ p.done = true; hitEnemy(p.dmg, {color:'#ff9a3d', noCrit:false}); burst(0.7, 0.55, 16, '#ff9a3d'); }
  }
  R.proj = R.proj.filter(p => !p.done);
  if(e.die) return;

  // powers auto-cast
  for(const p of PW){
    if(!p.active || !pw(p.id)) continue;
    R.cd[p.id] = (R.cd[p.id] ?? p.cd) - dt;
    if(R.cd[p.id] <= 0){
      if(castPower(p.id)) R.cd[p.id] = p.cd; else R.cd[p.id] = 0;
      if(e.die) return;
    }
  }

  // hero attacks
  R.atkT += dt * aps();
  while(R.atkT >= 1 && !e.die){ R.atkT -= 1; R.swing = 0.18; hitEnemy(atk()); }
  if(e.die) return;

  // boss timer
  if(e.boss){
    R.bossT -= dt;
    if(R.bossT <= 0){ fail('⏱️ Out of time! Get stronger, then try again.'); R.dead = 0.6; R.hp = maxHp(); return; }
  }
  // enemy attacks
  if(R.stun > 0) R.stun -= dt;
  else {
    e.atkT += dt * (1 - 0.08 * pw('frost'));
    if(e.atkT >= 2){ e.atkT -= 2; e.lunge = 0.2; heroHurt(e.dmg); }
  }
  if(e.lunge > 0) e.lunge -= dt;
}

// ---------- FX helpers ----------
function addText(txt, x, y, color, size){
  if(R.texts.length > 40) R.texts.shift();
  R.texts.push({txt, x, y, color, size, life:1});
}
function burst(x, y, n, color){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 0.1 + Math.random()*0.35;
    R.parts.push({x, y, vx:Math.cos(a)*s*0.6, vy:Math.sin(a)*s - 0.3, life:0.4+Math.random()*0.4, color});
  }
  if(R.parts.length > 200) R.parts.splice(0, R.parts.length - 200);
}

// ---------- Rendering ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize);

function hills(color, amp, freq, base, speed){
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  const off = R.scroll * speed;
  for(let x=0;x<=W;x+=8){
    const y = base - (Math.sin((x+off)*freq) * amp + Math.sin((x+off)*freq*2.3+1) * amp*0.4);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.fill();
}
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function hpBar(cx, y, w, frac, color){
  ctx.fillStyle = '#000a'; rr(cx-w/2-2, y-2, w+4, 10, 5); ctx.fill();
  ctx.fillStyle = color; rr(cx-w/2, y, Math.max(0, w*frac), 6, 3); ctx.fill();
}

function drawHero(x, gy, s, now){
  const bob = Math.sin(now*6) * (R.walk > 0 ? 3 : 1.2);
  ctx.save(); ctx.translate(x, gy + bob);
  if(R.dead > 0){ ctx.globalAlpha = 0.35; ctx.rotate(-1.2); }
  if(R.hurt > 0) ctx.translate((Math.random()-.5)*4, 0);
  if(R.rage > 0){ ctx.shadowColor = '#ff5a2a'; ctx.shadowBlur = 18; }
  // legs
  ctx.fillStyle = '#2b2f55'; ctx.fillRect(-9*s, -14*s, 7*s, 14*s); ctx.fillRect(2*s, -14*s, 7*s, 14*s);
  // body
  ctx.fillStyle = R.hurt > 0 ? '#ff8a9a' : '#4a7cff'; rr(-13*s, -42*s, 26*s, 30*s, 6*s); ctx.fill();
  ctx.fillStyle = '#ffcf4a'; ctx.fillRect(-13*s, -22*s, 26*s, 4*s);
  // head + helmet
  ctx.fillStyle = '#ffd9b3'; ctx.beginPath(); ctx.arc(0, -52*s, 11*s, 0, 7); ctx.fill();
  ctx.fillStyle = '#c9d2e8'; ctx.beginPath(); ctx.arc(0, -55*s, 12*s, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#ff5d73'; ctx.fillRect(-2*s, -72*s, 4*s, 8*s);
  ctx.fillStyle = '#1b1530'; ctx.fillRect(3*s, -53*s, 3*s, 3*s);
  // sword arm
  ctx.save(); ctx.translate(10*s, -34*s);
  const sw = R.swing > 0 ? (R.swing/0.18) : 0;
  ctx.rotate(-0.9 + (1-sw) * 0 + sw * 2.1);
  ctx.fillStyle = '#6b4a2b'; ctx.fillRect(-2*s, -4*s, 4*s, 10*s);
  ctx.fillStyle = '#ffcf4a'; ctx.fillRect(-7*s, -6*s, 14*s, 3*s);
  ctx.fillStyle = '#e8eefc'; ctx.fillRect(-2.5*s, -36*s, 5*s, 30*s);
  ctx.restore();
  ctx.restore();
}

function drawEnemy(e, x, gy, s, now){
  const z = zoneOf(S.stage).z, hue = (z.hue + e.seed*12) % 360;
  const body = e.flash > 0 ? '#ffffff' : `hsl(${hue},65%,${e.boss?45:55}%)`;
  const dark = `hsl(${hue},60%,30%)`;
  ctx.save(); ctx.translate(x - (e.lunge > 0 ? 18*e.lunge/0.2 : 0), gy);
  if(e.die > 0){ const k = e.die/0.35; ctx.globalAlpha = k; ctx.scale(1+(1-k)*0.4, k); }
  if(R.stun > 0){ ctx.translate((Math.random()-.5)*3, 0); }
  const eyes = (y, sp, r) => {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-sp, y, r, 0, 7); ctx.arc(sp, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#1b1530'; ctx.beginPath(); ctx.arc(-sp-r*0.35, y, r*0.5, 0, 7); ctx.arc(sp-r*0.35, y, r*0.5, 0, 7); ctx.fill();
  };
  if(e.kind === 'slime'){
    const sq = 1 + Math.sin(now*5+e.seed)*0.06;
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -16*s/sq, 24*s*sq, 18*s/sq, 0, Math.PI, 0); ctx.lineTo(24*s*sq, 0); ctx.lineTo(-24*s*sq, 0); ctx.fill();
    eyes(-18*s, 8*s, 5*s);
  } else if(e.kind === 'bat'){
    const fy = -45*s + Math.sin(now*4+e.seed)*6, fl = Math.sin(now*18)*10*s;
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.moveTo(-8*s, fy); ctx.lineTo(-36*s, fy-10*s+fl); ctx.lineTo(-26*s, fy+8*s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8*s, fy); ctx.lineTo(36*s, fy-10*s+fl); ctx.lineTo(26*s, fy+8*s); ctx.fill();
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, fy, 13*s, 0, 7); ctx.fill();
    eyes(fy-2*s, 5*s, 3.5*s);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 0, 14*s, 3*s, 0, 0, 7); ctx.fill();
  } else if(e.kind === 'goblin'){
    ctx.fillStyle = dark; ctx.fillRect(-10*s, -16*s, 8*s, 16*s); ctx.fillRect(2*s, -16*s, 8*s, 16*s);
    ctx.fillStyle = body; rr(-14*s, -40*s, 28*s, 26*s, 6*s); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -50*s, 13*s, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-12*s,-54*s); ctx.lineTo(-26*s,-62*s); ctx.lineTo(-10*s,-46*s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12*s,-54*s); ctx.lineTo(26*s,-62*s); ctx.lineTo(10*s,-46*s); ctx.fill();
    eyes(-52*s, 5*s, 3.5*s);
    ctx.fillStyle = '#8a8a8a'; ctx.fillRect(-26*s, -46*s, 4*s, 26*s);
  } else if(e.kind === 'golem'){
    ctx.fillStyle = dark; rr(-24*s, -30*s, 48*s, 30*s, 6*s); ctx.fill();
    ctx.fillStyle = body; rr(-20*s, -62*s, 40*s, 36*s, 8*s); ctx.fill();
    rr(-34*s, -56*s, 12*s, 34*s, 5*s); ctx.fill(); rr(22*s, -56*s, 12*s, 34*s, 5*s); ctx.fill();
    ctx.fillStyle = '#ffe066'; ctx.fillRect(-12*s, -50*s, 7*s, 5*s); ctx.fillRect(5*s, -50*s, 7*s, 5*s);
  } else { // boss
    const b = 1 + Math.sin(now*3)*0.03;
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.moveTo(-30*s,-70*s); ctx.lineTo(-44*s,-104*s); ctx.lineTo(-16*s,-80*s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(30*s,-70*s); ctx.lineTo(44*s,-104*s); ctx.lineTo(16*s,-80*s); ctx.fill();
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -42*s*b, 46*s, 44*s*b, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffcf4a'; ctx.beginPath();
    ctx.moveTo(-20*s,-82*s); ctx.lineTo(-20*s,-100*s); ctx.lineTo(-10*s,-90*s); ctx.lineTo(0,-104*s); ctx.lineTo(10*s,-90*s); ctx.lineTo(20*s,-100*s); ctx.lineTo(20*s,-82*s); ctx.fill();
    ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(-14*s, -50*s, 7*s, 0, 7); ctx.arc(14*s, -50*s, 7*s, 0, 7); ctx.fill();
    ctx.fillStyle = '#1b1530'; ctx.fillRect(-18*s, -26*s, 36*s, 6*s);
  }
  ctx.restore();
}

function render(now){
  if(!W) resize();
  const {z} = zoneOf(S.stage);
  ctx.save();
  if(R.shake > 0) ctx.translate((Math.random()-.5)*6, (Math.random()-.5)*6);
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, z.sky[0]); sky.addColorStop(1, z.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(-10,-10,W+20,H+20);
  hills(z.hill2, H*0.08, 0.008, H*0.6, 0.2);
  hills(z.hill, H*0.05, 0.015, H*0.7, 0.5);
  const gy = H*0.82;
  ctx.fillStyle = z.ground; ctx.fillRect(-10, gy, W+20, H);
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  for(let x = -(R.scroll % 40); x < W; x += 40) ctx.fillRect(x, gy + 6, 18, 3);

  const s = Math.min(1.2, H / 260);
  drawHero(W*0.28, gy, s, now);
  const e = R.enemy;
  if(e) drawEnemy(e, W*e.x, gy, e.boss ? s*1.1 : s, now);

  // fireballs
  for(const p of R.proj){
    const x = W*(0.32 + 0.38*p.t), y = gy - 60*s - Math.sin(p.t*Math.PI)*40*s;
    ctx.fillStyle = '#ff9a3d'; ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(x, y, 9*s, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  }
  // lightning
  for(const b of R.bolts){
    ctx.strokeStyle = `rgba(190,240,255,${b.life/0.25})`; ctx.lineWidth = 4; ctx.beginPath();
    let x = W*0.7, y = 0; ctx.moveTo(x, y);
    while(y < gy - 40*s){ y += 18; x = W*0.7 + (Math.random()-.5)*24; ctx.lineTo(x, y); }
    ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${b.life*0.8})`; ctx.fillRect(0,0,W,H);
  }
  // particles
  for(const p of R.parts){ ctx.globalAlpha = Math.min(1, p.life*2); ctx.fillStyle = p.color; ctx.fillRect(p.x*W-3, p.y*H-3, 6, 6); }
  ctx.globalAlpha = 1;

  // hp bars
  hpBar(W*0.28, gy - 92*s, 70, Math.max(0, R.hp)/maxHp(), R.hp/maxHp() > 0.3 ? '#5be38a' : '#ff5d73');
  if(e && R.walk <= 0 && !e.die) hpBar(W*e.x, gy - (e.boss ? 130 : 90)*s, e.boss ? 110 : 70, e.hp/e.maxHp, '#ff5d73');
  if(R.stun > 0 && e){ ctx.font = '16px system-ui'; ctx.textAlign = 'center'; ctx.fillText('💫', W*0.7, gy - (e.boss?140:100)*s); }

  // floating text
  ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)';
  for(const t of R.texts){
    ctx.globalAlpha = Math.min(1, t.life*2);
    ctx.font = `900 ${t.size}px system-ui`;
    ctx.strokeText(t.txt, t.x*W, t.y*H); ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x*W, t.y*H);
  }
  ctx.globalAlpha = 1;

  // boss timer
  if(e && e.boss && R.walk <= 0){
    ctx.fillStyle = '#000a'; rr(W/2-70, 8, 140, 22, 11); ctx.fill();
    ctx.fillStyle = R.bossT < 8 ? '#ff5d73' : '#ffcf4a'; ctx.font = '800 13px system-ui';
    ctx.fillText('👑 BOSS  ' + Math.max(0, R.bossT).toFixed(1) + 's', W/2, 24);
  }
  if(R.dead > 0){
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = '800 18px system-ui'; ctx.fillText('Recovering…', W/2, H/2);
  }

  // power cooldown icons
  let ix = 10;
  for(const p of PW){
    if(!p.active || !pw(p.id)) continue;
    const frac = Math.max(0, Math.min(1, (R.cd[p.id] ?? p.cd) / p.cd));
    ctx.fillStyle = '#000a'; rr(ix, 8, 30, 30, 8); ctx.fill();
    ctx.font = '17px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(p.icon, ix+15, 29);
    if(frac > 0){ ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(ix, 8 + 30*(1-frac), 30, 30*frac); }
    if(p.id === 'rage' && R.rage > 0){ ctx.strokeStyle = '#ff7a45'; ctx.lineWidth = 2; rr(ix, 8, 30, 30, 8); ctx.stroke(); }
    ix += 36;
  }
  ctx.restore();
}

// tapping the battle
cv.addEventListener('pointerdown', ev => {
  const e = R.enemy;
  if(!e || R.walk > 0 || e.die || R.dead > 0) return;
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left)/r.width, y = (ev.clientY - r.top)/r.height;
  hitEnemy(tapDmg(), {x, y: y - 0.05, color:'#9be7ff'});
  burst(x, y, 6, '#9be7ff');
  document.getElementById('tapHint').style.display = 'none';
});

const $ = id => document.getElementById(id);
let tab = 'upg';
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
}
function showModal(html){ $('modalBox').innerHTML = html; $('modal').hidden = false; }
function closeModal(){ $('modal').hidden = true; }

// how many levels of an upgrade to buy for the current buy mode, and total cost
function buyPlan(u){
  const lvl = up(u.id), cap = u.max ?? Infinity;
  const want = S.buyAmt === 'max' ? Infinity : +S.buyAmt;
  let n = 0, cost = 0;
  while(n < want && lvl + n < cap && n < 1000){
    const c = upCost(u, lvl + n);
    if(S.buyAmt === 'max' && cost + c > S.gold) break;
    cost += c; n++;
  }
  if(S.buyAmt === 'max' && n === 0 && lvl < cap){ n = 1; cost = upCost(u, lvl); }
  return {n, cost, maxed: lvl >= cap};
}

      <div style="margin-top:6px">Ascending now gives:</div><div class="big" id="soulGain">0</div>

      <b>Android:</b> open in Chrome → ⋮ menu → <i>Install app</i> / <i>Add to Home screen</i>.<br>
      It works offline, it's 100% free, and your progress saves on your device.</div>

  updatePanel();
}

// only touch the DOM when content changes, so taps on buttons aren't lost mid-refresh
function setHTML(el, html){ if(el._h !== html){ el._h = html; el.innerHTML = html; } }
function updatePanel(){
  if(tab === 'upg'){
    for(const u of UPG){
      const d = document.querySelector(`[data-desc="${u.id}"]`); if(d) d.textContent = u.desc();
      const b = document.querySelector(`[data-buy="${u.id}"]`); if(!b) continue;
      const {n, cost, maxed} = buyPlan(u);
      b.parentElement.querySelector('.nm small').textContent = `Lv ${up(u.id)}${u.max ? '/' + u.max : ''}`;
      if(maxed){ b.className = 'buy max'; setHTML(b, 'MAX'); b.disabled = true; continue; }
      b.disabled = false;
      b.className = 'buy' + (S.gold >= cost ? ' can' : '');
      setHTML(b, `🪙 ${fmt(cost)}<small>+${n} level${n>1?'s':''}</small>`);
    }
  } else if(tab === 'pow'){
    for(const p of PW){
      const l = pw(p.id), locked = S.heroLvl < p.req, maxed = l >= p.max;
      const row = document.querySelector(`[data-pwrow="${p.id}"]`); if(!row) continue;
      row.classList.toggle('locked', locked);
      row.querySelector(`[data-pwlv]`).textContent = locked ? `Unlocks at hero Lv ${p.req}` : `Lv ${l}/${p.max}`;
      row.querySelector(`[data-pwdesc]`).textContent = l ? p.desc(l) + (maxed ? '' : `  → next: ${p.desc(l+1)}`) : p.desc(1);
      const b = row.querySelector('.buy');
      if(maxed){ b.className = 'buy max'; setHTML(b, 'MAX'); b.disabled = true; }
      else if(locked){ b.className = 'buy'; setHTML(b, '🔒'); b.disabled = true; }
      else { b.disabled = false; b.className = 'buy' + (S.sp > 0 ? ' can' : ''); setHTML(b, `${l ? 'Upgrade' : 'Learn'}<small>1 skill pt</small>`); }
    }
  } else if(tab === 'asc'){
    const g = soulGain();
    $('soulGain').textContent = '+' + fmt(g) + ' 👻';
    $('ascReq').textContent = S.maxStage < 25 ? `Reach stage 25 to ascend (best this run: ${S.maxStage}).` : `Higher stages give more souls. Best this run: stage ${S.maxStage}.`;
    $('ascBtn').disabled = g <= 0;
  } else {
    const rows = [
      ['Current stage', S.stage], ['Best stage ever', S.bestStage], ['Enemies defeated', fmt(S.totalKills)],
      ['Bosses defeated', fmt(S.bossKills)], ['Gold earned (all time)', fmt(S.totalGold)], ['Ascensions', S.ascensions],
      ['Attack', fmt(atk())], ['Damage/sec (approx)', fmt(atk()*aps()*(1+critCh()*(CRIT_MUL-1)))],
      ['Gold/sec (approx)', fmt(farmRate().gps)], ['Time played', fmtTime(S.played)],
    ];
    setHTML($('statList'), rows.map(([k,v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join(''));
  }
}

function soulGain(){ return S.maxStage < 25 ? 0 : Math.floor(Math.pow(S.maxStage / 10, 2.2)); }

function farmRate(){
  const st = enemyStats(S.stage, false);
  const dps = atk() * baseAps() * (1 + critCh() * (CRIT_MUL - 1));
  const tpk = st.hp / dps + 0.8;
  return {gps: st.gold * goldMul() / tpk, xps: st.xp / tpk, kps: 1 / tpk};
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if(!t) return;
  if(t.dataset.tab){
    tab = t.dataset.tab;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b === t));
    renderPanel(); return;
  }
  if(t.dataset.amt){
    S.buyAmt = t.dataset.amt;
    document.querySelectorAll('#buyRow button').forEach(b => b.classList.toggle('active', b === t));
    updatePanel(); return;
  }
  if(t.dataset.buy){
    const u = UPG.find(x => x.id === t.dataset.buy), {n, cost, maxed} = buyPlan(u);
    if(maxed || S.gold < cost || n === 0) return;
    const hpFrac = R.hp / maxHp();
    S.gold -= cost; S.up[u.id] = up(u.id) + n;
    if(u.id === 'hp') R.hp = hpFrac * maxHp();
    updatePanel(); persist(); return;
  }
  if(t.dataset.learn){
    const p = PW.find(x => x.id === t.dataset.learn);
    if(S.sp < 1 || S.heroLvl < p.req || pw(p.id) >= p.max) return;
    S.sp--; S.pw[p.id] = pw(p.id) + 1;
    if(!R.cd[p.id]) R.cd[p.id] = 1;
    toast(p.icon + ' ' + p.name + ' Lv ' + pw(p.id));
    updatePanel(); persist(); return;
  }
  if(t.id === 'farmBtn'){
    S.farm = !S.farm;
    toast(S.farm ? '🔁 Farming this stage' : '⏩ Auto-advance on');
    return;
  }
  if(t.id === 'giftBtn'){
    if(Date.now() < S.giftAt){ toast('🎁 Next free gift in ' + fmtTime((S.giftAt - Date.now())/1000)); return; }
    const g = Math.max(50, farmRate().gps * 900);
    S.gold += g; S.totalGold += g; S.giftAt = Date.now() + GIFT_EVERY;
    showModal(`<h2>🎁 Free Gift!</h2><p>15 minutes of loot, on the house.</p><div class="reward" style="color:var(--gold)">+${fmt(g)} 🪙</div><button class="btn" data-close>Nice!</button>`);
    persist(); return;
  }
  if(t.id === 'ascBtn'){
    const g = soulGain();
    showModal(`<h2>👻 Ascend?</h2><p>Your stage, gold, upgrades, hero level and powers reset.</p>
      <div class="reward" style="color:var(--soul)">+${fmt(g)} Souls</div>
      <p>Souls are permanent: +10% damage &amp; gold each.</p>
      <button class="btn" id="ascYes">Ascend!</button><button class="btn" style="background:var(--card)" data-close>Not yet</button>`);
    return;
  }
  if(t.id === 'ascYes'){
    const g = soulGain();
    Object.assign(S, {souls:S.souls + g, gold:0, stage:1, maxStage:1, kills:0, farm:false, heroLvl:1, xp:0, sp:0, up:{}, pw:{}, ascensions:S.ascensions + 1});
    Object.assign(R, {cd:{}, rage:0, proj:[], dead:0});
    R.hp = maxHp(); spawn();
    closeModal(); renderPanel(); persist();
    toast('👻 Ascended! +' + fmt(g) + ' souls');
    return;
  }
  if(t.id === 'wipeBtn'){
    showModal(`<h2>Reset everything?</h2><p>This deletes ALL progress, souls included. It can't be undone.</p>
      <button class="btn danger" id="wipeYes">Yes, wipe it</button><button class="btn" style="background:var(--card)" data-close>Cancel</button>`);
    return;
  }
  if(t.id === 'wipeYes'){
    S = freshSave(); Object.assign(R, {cd:{}, rage:0, proj:[], dead:0}); R.hp = maxHp(); spawn();
    closeModal(); renderPanel(); persist(); return;
  }
  if('close' in t.dataset){ closeModal(); return; }
});

function updateHud(){
  $('gold').textContent = fmt(S.gold);
  $('souls').textContent = fmt(S.souls);
  const boss = isBoss(S.stage);
  $('stageTxt').textContent = `Stage ${S.stage} · ${zoneName(S.stage)}`;
  $('stageFill').style.width = (boss ? (R.enemy && !R.enemy.die ? (1 - R.enemy.hp/R.enemy.maxHp) : 1) : S.kills / ENEMIES_PER_STAGE) * 100 + '%';
  $('stageSub').textContent = boss ? '👑 Boss stage, beat it in 30s!' : `${S.kills}/${ENEMIES_PER_STAGE} enemies` + (S.farm ? ' · farming' : '');
  const fb = $('farmBtn');
  fb.className = S.farm ? 'off' : 'on';
  fb.textContent = S.farm ? (isBoss(S.stage + 1) ? '👑 Fight boss' : '🔁 Farming') : '⏩ Auto';
  $('lvl').textContent = S.heroLvl;
  $('xpFill').style.width = (S.xp / xpNeed(S.heroLvl) * 100) + '%';
  $('spBadge').textContent = S.sp ? `${S.sp} skill pt${S.sp>1?'s':''}` : '';
  const giftReady = Date.now() >= S.giftAt;
  $('giftBtn').classList.toggle('ready', giftReady);
  $('giftTxt').textContent = giftReady ? 'Free!' : fmtTime((S.giftAt - Date.now())/1000);
  // tab alerts
  const tabs = document.querySelectorAll('#tabs button');
  tabs[0].classList.toggle('alert', UPG.some(u => !buyPlan(u).maxed && S.gold >= upCost(u, up(u.id))));
  tabs[1].classList.toggle('alert', S.sp > 0 && PW.some(p => S.heroLvl >= p.req && pw(p.id) < p.max));
  tabs[2].classList.toggle('alert', soulGain() > 0 && soulGain() >= Math.max(1, S.souls * 0.5));
}

// ---------- Offline progress ----------
function checkOffline(){
  const away = (Date.now() - S.last) / 1000;
  if(away < 60 || S.totalKills === 0) { S.last = Date.now(); return; }
  const t = Math.min(away, OFFLINE_CAP);
  const r = farmRate();
  const g = r.gps * t, x = r.xps * t, k = Math.floor(r.kps * t);
  const lvBefore = S.heroLvl;
  S.gold += g; S.totalGold += g; S.totalKills += k;
  addXp(x);
  S.last = Date.now();
  showModal(`<h2>🌙 Welcome back!</h2><p>Your hero kept fighting for <b>${fmtTime(t)}</b>${away > OFFLINE_CAP ? ' (12h max)' : ''}.</p>
    <div class="reward" style="color:var(--gold)">+${fmt(g)} 🪙</div>
    <p>${fmt(k)} enemies defeated${S.heroLvl > lvBefore ? ` · +${S.heroLvl - lvBefore} hero level${S.heroLvl - lvBefore > 1 ? 's' : ''}` : ''}</p>
    <button class="btn" data-close>Collect</button>`);
  persist();
}

// ---------- Main loop ----------
document.querySelectorAll('#buyRow button').forEach(b => b.classList.toggle('active', b.dataset.amt === S.buyAmt));
R.hp = maxHp();
spawn();
renderPanel();
checkOffline();

let lastT = performance.now(), uiT = 0, saveT = 0;
function frame(now){
  let dt = (now - lastT) / 1000; lastT = now;
  if(dt > 1) dt = 1;          // big gaps are handled by offline progress
  // fixed sub-steps keep combat stable at high attack speeds
  let steps = Math.ceil(dt / 0.02); const h = dt / steps;
  while(steps--) tick(h);
  render(now / 1000);
  uiT += dt; saveT += dt;
  if(uiT > 0.2){ uiT = 0; updateHud(); updatePanel(); }
  if(saveT > 5){ saveT = 0; persist(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { lastT = t; resize(); frame(t); });

document.addEventListener('visibilitychange', () => {
  if(document.hidden) persist();
  else { checkOffline(); lastT = performance.now(); }
});
addEventListener('pagehide', persist);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
