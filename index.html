<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Power Surge">
<title>Power Surge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#120f24; --panel:#1c1836; --card:#262047; --card2:#2f2858; --line:#3a3366;
    --text:#f2eeff; --dim:#a79fcc; --gold:#ffcf4a; --soul:#9be7ff; --good:#5be38a; --bad:#ff5d73; --accent:#a77bff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  #top{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
  .res{display:flex;align-items:center;gap:6px;background:var(--panel);padding:5px 10px;border-radius:999px;font-weight:700;font-size:14px}
  #gold{color:var(--gold)} #souls{color:var(--soul)}
  #giftBtn{margin-left:auto;background:var(--panel);padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px}
  #giftBtn.ready{background:linear-gradient(135deg,#ff8a3d,#ff3d8a);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  #stagebar{display:flex;align-items:center;gap:10px;padding:0 12px 6px}
  #stageInfo{flex:1;min-width:0}
  #stageTxt{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stageSub{font-size:11px;color:var(--dim)}
  .bar{height:7px;background:#0b0918;border-radius:99px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .15s}
  #farmBtn{padding:8px 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
  #farmBtn.on{background:#21533a;color:#bfffd6}
  #farmBtn.off{background:#5a2333;color:#ffd0d8}
  #battle{position:relative;height:42vh;min-height:250px;max-height:420px;margin:0 12px;border-radius:16px;overflow:hidden;background:#000;touch-action:manipulation}
  #cv{width:100%;height:100%;display:block}
  #tapHint{position:absolute;bottom:10px;right:10px;font-size:11px;color:#fff;opacity:.75;pointer-events:none;text-shadow:0 1px 2px #000}
  #herobar{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;font-size:13px}
  #herobar .bar{flex:1;margin:0;height:9px}
  #herobar .bar i{background:linear-gradient(90deg,#5bd1ff,#a77bff)}
  #clsTag,#buildTag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--card);color:var(--dim);white-space:nowrap}
  #clsTag{background:var(--card2);color:var(--text)}
  #buildTag.on{background:linear-gradient(135deg,#7a4dff,#ff4da6);color:#fff}
  #spBadge{background:var(--accent);color:#fff;font-weight:800;font-size:11px;padding:3px 8px;border-radius:99px;white-space:nowrap}
  #spBadge:empty{display:none}
  #tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 12px}
  #tabs button{background:var(--panel);padding:6px 2px;border-radius:10px;font-weight:700;font-size:10.5px;position:relative;line-height:1.25}
  #tabs button b{display:block;font-size:17px}
  #tabs button.active{background:var(--accent);color:#fff}
  #tabs button .dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
  #tabs button.alert .dot{display:block}
  #buyRow{display:flex;gap:6px;align-items:center;padding:6px 12px 0;font-size:12px;color:var(--dim)}
  #buyRow button{background:var(--panel);padding:5px 10px;border-radius:8px;font-weight:700;font-size:12px}
  #buyRow button.active{background:var(--card2);color:var(--gold)}
  .spendrow{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim);margin:0 0 8px}
  .spendrow button{background:var(--panel);padding:5px 12px;border-radius:8px;font-weight:700;font-size:12px}
  .spendrow button.active{background:var(--card2);color:var(--gold)}
  #panel{flex:1;overflow-y:auto;padding:8px 12px 16px;-webkit-overflow-scrolling:touch}
  .item{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px;margin-bottom:8px;border:1px solid transparent}
  .item .ic{font-size:24px;width:42px;height:42px;display:grid;place-items:center;background:var(--card);border-radius:10px;flex:none;border:2px solid transparent;position:relative}
  .item .ic.evo{border-color:var(--gold);box-shadow:0 0 12px #ffcf4a88}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:800;font-size:14px}
  .item .nm small{color:var(--dim);font-weight:600;margin-left:4px}
  .item .ds{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.35}
  .item .ds .up{color:var(--good)} .item .ds .dn{color:var(--bad)}
  .item .ds .evo{color:var(--gold);font-weight:700}
  .item.locked{opacity:.5}
  .item.sel{border-color:var(--accent);background:var(--card)}
  .pips{display:flex;gap:2px;margin-top:4px}
  .pips i{flex:1;height:4px;border-radius:2px;background:var(--card2)}
  .pips i.on{background:var(--accent)}
  .pips.evo i.on{background:var(--gold)}
  .buy{background:var(--card2);border-radius:10px;padding:8px 10px;min-width:84px;text-align:center;font-weight:800;font-size:13px;line-height:1.15}
  .buy small{display:block;font-weight:600;font-size:11px;color:var(--dim)}
  .buy.can{background:linear-gradient(135deg,#3b8f5a,#2a6e44);color:#fff}
  .buy.can small{color:#d4ffe2}
  .buy.evo{background:linear-gradient(135deg,#ffb02e,#ff4d6d);color:#fff}
  .buy.evo small{color:#fff}
  .buy:disabled{cursor:default}
  .buy.max{background:var(--card);color:var(--gold)}
  .btns{display:flex;flex-direction:column;gap:5px}
  .sbtn{background:var(--card2);border-radius:9px;padding:7px 10px;font-weight:800;font-size:12px;white-space:nowrap}
  .sbtn.go{background:linear-gradient(135deg,#3b8f5a,#2a6e44);color:#fff}
  .sbtn.warn{background:#4a2333;color:#ffc2cc}
  .sbtn:disabled{opacity:.5}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px;font-weight:800;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .sec:first-child{margin-top:4px}
  .card{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5}
  .card h3{margin:0 0 6px;font-size:16px}
  .card .big{font-size:28px;font-weight:900;color:var(--soul)}
  .buildcard{background:linear-gradient(135deg,#3a2470,#5a1f4f);border:1px solid #7a4dff}
  .buildcard.none{background:var(--panel);border-color:var(--line)}
  .build{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel);margin-bottom:6px;font-size:12px;color:var(--dim)}
  .build b{color:var(--text);font-size:13px}
  .build.active{background:linear-gradient(135deg,#3a2470,#5a1f4f);color:#e9dcff}
  .build .bi{font-size:22px}
  .loadouts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .lo{background:var(--panel);border-radius:12px;padding:8px;text-align:center;font-size:12px}
  .lo .lic{font-size:20px;min-height:26px}
  .lo .row{display:flex;gap:4px;margin-top:6px}
  .lo .row button{flex:1;padding:6px 0}
  .classes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cls{background:var(--panel);border-radius:12px;padding:10px;text-align:left;border:2px solid transparent;font-size:12px;line-height:1.3}
  .cls b{font-size:14px}
  .cls small{display:block;color:var(--dim);margin-top:3px}
  .cls small.sig{color:#d9c6ff}
  .cls.sel{border-color:var(--accent);background:var(--card2)}
  .cls.lock{opacity:.45}
  .btn{display:block;width:100%;padding:12px;border-radius:12px;font-weight:800;font-size:15px;background:var(--accent);color:#fff;margin-top:10px}
  .btn:disabled{background:var(--card);color:var(--dim)}
  .btn.danger{background:#5a2333}
  .stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
  .stat:last-child{border:0}
  .stat b{color:var(--text)}
  .look-top{display:flex;gap:12px;align-items:center}
  #lookCv{width:150px;height:150px;border-radius:16px;background:#1a2b1a;flex:none}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;position:relative}
  .sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .chip{background:var(--card);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;border:2px solid transparent}
  .chip.sel{border-color:var(--accent);background:var(--card2)}
  .chip.lock,.sw.lock{opacity:.4}
  .chip small{display:block;font-weight:600;color:var(--dim);font-size:10px}
  #modal{position:fixed;inset:0;background:rgba(5,3,15,.75);display:grid;place-items:center;z-index:10;padding:20px}
  #modal[hidden]{display:none}
  #modalBox{background:var(--panel);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center;border:1px solid var(--line)}
  #modalBox h2{margin:0 0 8px}
  #modalBox p{color:var(--dim);margin:6px 0}
  #modalBox .reward{font-size:22px;font-weight:900;margin:12px 0}
  #toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:#000d;padding:9px 14px;border-radius:12px;
    font-weight:700;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="res" title="Gold"><span>🪙</span><b id="gold">0</b></div>
    <div class="res" title="Souls (permanent bonus)"><span>👻</span><b id="souls">0</b></div>
    <button id="giftBtn">🎁 <span id="giftTxt"></span></button>
  </header>
  <div id="stagebar">
    <div id="stageInfo">
      <div id="stageTxt">Stage 1</div>
      <div class="bar"><i id="stageFill"></i></div>
      <div id="stageSub"></div>
    </div>
    <button id="farmBtn" class="on">⏩ Auto</button>
  </div>
  <div id="battle"><canvas id="cv"></canvas><div id="tapHint">Tap to blast enemies!</div></div>
  <div id="herobar">
    <span>Lv <b id="lvl">1</b></span>
    <div class="bar"><i id="xpFill"></i></div>
    <span id="clsTag"></span>
    <span id="buildTag"></span>
    <span id="spBadge"></span>
  </div>
  <nav id="tabs">
    <button data-tab="upg" class="active"><b>⚔️</b>Upgrade<span class="dot"></span></button>
    <button data-tab="pow"><b>✨</b>Powers<span class="dot"></span></button>
    <button data-tab="hero"><b>🦸</b>Hero<span class="dot"></span></button>
    <button data-tab="gear"><b>🎒</b>Gear<span class="dot"></span></button>
    <button data-tab="asc"><b>👻</b>Ascend<span class="dot"></span></button>
    <button data-tab="stats"><b>📊</b>Stats<span class="dot"></span></button>
  </nav>
  <div id="buyRow">Buy:
    <button data-amt="1" class="active">x1</button><button data-amt="10">x10</button><button data-amt="max">Max</button>
  </div>
  <div id="panel"></div>
</div>
<div id="modal" hidden><div id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
// =====================================================================
//  SAVE DATA
// =====================================================================
const SAVE_KEY = 'powersurge-idle-v1';
const OFFLINE_CAP = 12 * 3600;      // seconds of offline progress that count
const GIFT_EVERY = 2 * 3600 * 1000; // free gift cooldown (ms)
const ENEMIES_PER_STAGE = 10;
const BOSS_TIME = 30;
const BAG_SIZE = 40;
const PW_MAX = 10;                  // power level where it evolves

function freshSave(){
  return {v:4, gold:0, souls:0, stage:1, maxStage:1, bestStage:1, kills:0, farm:false,
    heroLvl:1, xp:0, sp:0, up:{}, pw:{}, last:Date.now(), giftAt:0,
    totalKills:0, totalGold:0, bossKills:0, ascensions:0, played:0, buyAmt:'1', spendAmt:'1',
    inv:[], eq:{weapon:null, armor:null}, uid:1, autoSalvage:-1, itemsFound:0,
    look:{skin:0, head:0, cape:0, aura:0, dye:-1}, loadouts:[null, null, null],
    cls:'knight', pet:'wolf', petLv:{}, mastery:{}};
}
let S = freshSave();
try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) S = Object.assign(freshSave(), JSON.parse(raw)); }catch(e){}
// migrate older saves
if(S.pw.frost){ S.pw.nova = S.pw.frost; delete S.pw.frost; }
if(S.v < 4 && S.totalKills > 0){
  S.sp += S.heroLvl - 1;                                    // the extra point per hero level already reached
  for(const m of Object.values(S.mastery || {})) m.pts += m.lv - 1;
  S.catchup = true;
}
S.v = 4;
function persist(){ S.last = Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

// =====================================================================
//  FORMATTING / MATH
// =====================================================================
const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  let i = 0;
  while(n >= 1000 && i < SUF.length - 1){ n /= 1000; i++; }
  if(n >= 1000) return n.toExponential(2);
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + SUF[i];
}
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if(h) return h + 'h ' + m + 'm';
  if(m) return m + 'm ' + s + 's';
  return s + 's';
}
const pct = v => Math.round(v * 100) + '%';
const x1 = n => (Math.round(n * 10) / 10).toString();
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const angDiff = (a, b) => Math.abs(((a - b + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
function turnTo(a, b, k){ let d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI; return a + d * Math.min(1, k); }

// =====================================================================
//  CLASSES & COMPANIONS
// =====================================================================
const CLASSES = [
  {id:'knight',  n:'Knight',      icon:'🛡️', info:'+30% HP, +10% damage reduction', mods:{hp:0.3, dr:0.1},
    sig:'Shield Bash', cd:6, sigInfo:'Every 6s: bash everything in front for 3× ATK and stun it', look:{head:0, cape:0}},
  {id:'mage',    n:'Mage',        icon:'🧙', info:'+30% power damage, -10% cooldowns', mods:{power:0.3, cdr:0.1},
    sig:'Arcane Missiles', cd:5, sigInfo:'Every 5s: 5 homing missiles, 1.5× ATK each', look:{head:3, cape:3}},
  {id:'ranger',  n:'Ranger',      icon:'🏹', info:'+20% attack speed, +10% crit', mods:{aps:0.2, crit:0.1},
    sig:'Arrow Rain', cd:7, sigInfo:'Every 7s: a storm of arrows on the biggest crowd', look:{head:2, cape:2}},
  {id:'rogue',   n:'Rogue',       icon:'🗡️', info:'+15% crit, +50% crit damage', mods:{crit:0.15, critDmg:0.5},
    sig:'Shadow Strike', cd:6, sigInfo:'Every 6s: teleport behind the toughest enemy for a 6× ATK crit', look:{head:2, cape:5}},
  {id:'paladin', n:'Paladin',     icon:'⚜️', info:'+20% HP, +20% damage', mods:{hp:0.2, atk:0.2}, req:{stage:50},
    sig:'Holy Smite', cd:8, sigInfo:'Every 8s: a giant holy hammer smashes for 5× ATK and heals 10%', look:{head:0, cape:6}},
  {id:'necro',   n:'Necromancer', icon:'💀', info:'+25% power damage, kills heal 1% HP', mods:{power:0.25, killHeal:0.01}, req:{asc:1},
    sig:'Raise Dead', cd:8, sigInfo:'Every 8s: raise 2 skeleton warriors to fight for 10s', look:{head:2, cape:5}},
];
const CLM = Object.fromEntries(CLASSES.map(c => [c.id, c]));
const cls = () => CLM[S.cls] || CLASSES[0];

// Class skill trees, bought with Mastery points. Each class levels its own Mastery by fighting.
// The 'sig' skill upgrades the class signature move and evolves it at Lv 10.
const SK_MAX = 10;
const CSK = {
  knight: [
    {id:'sig',     n:'Shield Bash', icon:'🛡️', evo:'Shockwave Bash', info:l=>`${x1(3*(1+0.25*l))}× ATK, stuns ${x1(1.2+0.1*l)}s, cooldown -${3*l}%`, evoInfo:'Also sends a shockwave across the arena (2× ATK + stun)'},
    {id:'bulwark', n:'Bulwark',     icon:'🧱', info:l=>`+${4*l}% damage reduction`, apply:(g,l)=>{ g.dr += 0.04*l; }},
    {id:'retal',   n:'Retaliation', icon:'🌵', info:l=>`Attackers take ${x1(0.5*l)}× ATK thorns`, apply:(g,l)=>{ g.thorns += 0.5*l; }},
    {id:'rally',   n:'Rally',       icon:'🚩', info:l=>`+${6*l}% HP, +${3*l}% damage`, apply:(g,l)=>{ g.hp += 0.06*l; g.atk += 0.03*l; }},
  ],
  mage: [
    {id:'sig',     n:'Arcane Missiles', icon:'🔮', evo:'Arcane Barrage', info:l=>`${5+Math.floor(l/2)} missiles, ${x1(1.5*(1+0.25*l))}× ATK each, cooldown -${3*l}%`, evoInfo:'Every missile explodes in an arcane blast'},
    {id:'mastery', n:'Spell Mastery',   icon:'📜', info:l=>`+${6*l}% power damage`, apply:(g,l)=>{ g.power += 0.06*l; }},
    {id:'flow',    n:'Arcane Flow',     icon:'🌀', info:l=>`-${2*l}% all cooldowns`, apply:(g,l)=>{ g.cdr += 0.02*l; }},
    {id:'mshield', n:'Mana Shield',     icon:'🔷', info:l=>`+${3*l}% damage reduction, +${x1(0.2*l)}% HP regen/s`, apply:(g,l)=>{ g.dr += 0.03*l; g.regen += 0.002*l; }},
  ],
  ranger: [
    {id:'sig',   n:'Arrow Rain',   icon:'🏹', evo:'Firestorm', info:l=>`${18+3*l} arrows, ${x1(0.6*(1+0.25*l))}× ATK each, cooldown -${3*l}%`, evoInfo:'Arrows burst into flames where they land'},
    {id:'eagle', n:'Eagle Eye',    icon:'🦅', info:l=>`+${2*l}% crit chance`, apply:(g,l)=>{ g.crit += 0.02*l; }},
    {id:'rapid', n:'Rapid Fire',   icon:'💨', info:l=>`+${5*l}% attack speed`, apply:(g,l)=>{ g.aps += 0.05*l; }},
    {id:'mark',  n:"Hunter's Mark",icon:'🎯', info:l=>`+${5*l}% damage, +${5*l}% gold`, apply:(g,l)=>{ g.atk += 0.05*l; g.gold += 0.05*l; }},
  ],
  rogue: [
    {id:'sig',    n:'Shadow Strike', icon:'🗡️', evo:'Death Lotus', info:l=>`Hits ${1+Math.floor(l/3)} enemies for ${x1(6*(1+0.25*l))}× ATK crits, cooldown -${3*l}%`, evoInfo:'Blinks through 6 enemies in a flurry'},
    {id:'lethal', n:'Lethality',     icon:'☠️', info:l=>`+${10*l}% crit damage`, apply:(g,l)=>{ g.critDmg += 0.1*l; }},
    {id:'evade',  n:'Evasion',       icon:'🌫️', info:l=>`${3*l}% chance to dodge attacks`, apply:(g,l)=>{ g.dodge += 0.03*l; }},
    {id:'ambush', n:'Ambush',        icon:'🌑', info:l=>`+${5*l}% damage, +${2*l}% crit`, apply:(g,l)=>{ g.atk += 0.05*l; g.crit += 0.02*l; }},
  ],
  paladin: [
    {id:'sig',     n:'Holy Smite',    icon:'🔨', evo:'Divine Judgment', info:l=>`${x1(5*(1+0.25*l))}× ATK, heals ${10+2*l}%, cooldown -${3*l}%`, evoInfo:'Three holy hammers fall at once'},
    {id:'light',   n:'Aura of Light', icon:'☀️', info:l=>`+${x1(0.3*l)}% HP regen/s`, apply:(g,l)=>{ g.regen += 0.003*l; }},
    {id:'dshield', n:'Divine Shield', icon:'✝️', info:l=>`+${3*l}% damage reduction`, apply:(g,l)=>{ g.dr += 0.03*l; }},
    {id:'zeal',    n:'Zeal',          icon:'🔥', info:l=>`+${4*l}% damage, +${3*l}% attack speed`, apply:(g,l)=>{ g.atk += 0.04*l; g.aps += 0.03*l; }},

function makeItem(slot, type, r, lvl){
  const it = {uid:S.uid++, slot, type, r, lvl,
    main: Math.round(RAR_MAIN[r] * rand(0.85, 1.15) * (1 + lvl * 0.03)), afx:[]};
  const keys = Object.keys(AFX).sort(() => Math.random() - 0.5).slice(0, r);
  for(const k of keys){ const [a, b] = AFX[k].r; it.afx.push([k, +(rand(a, b) * (1 + 0.35 * r)).toFixed(4)]); }
  const base = slot === 'weapon' ? WT[type].n : AT[type].n;
  it.name = ADJ[r] + ' ' + base + (r >= 3 ? ' ' + pick(EPITHET) : '');
  return it;
}

const plusOf = it => it.plus || 0;
function mainOf(it){ return Math.round(it.main * (1 + 0.12 * plusOf(it))); }
const afxMul = it => 1 + 0.04 * plusOf(it);
function forgeCost(it){ return enemyStats(Math.max(1, S.bestStage), false).gold * 5 * (1 + it.r) * Math.pow(1.28, plusOf(it)); }
function addBonusAffix(it){
  const have = new Set(it.afx.map(a => a[0])), opts = Object.keys(AFX).filter(k => !have.has(k));
  if(opts.length){ const k = pick(opts), [a, b] = AFX[k].r; it.afx.push([k, +(rand(a, b) * (1 + 0.35 * Math.max(1, it.r))).toFixed(4)]); return it.afx[it.afx.length - 1]; }
  const a = pick(it.afx); a[1] = +(a[1] * 1.3).toFixed(4); return a;
}
function rollDrop(boss){
  const w = boss ? [0, 50, 35, 12, 3] : [70, 22, 6, 1.6, 0.4];
  let roll = Math.random() * w.reduce((a, b) => a + b), r = 0;
  while(roll >= w[r]){ roll -= w[r]; r++; }
  const slot = Math.random() < 0.5 ? 'weapon' : 'armor';
  return makeItem(slot, pick(Object.keys(slot === 'weapon' ? WT : AT)), r, S.stage);
}

let GS = null; // cached bonus stats from gear + build + class
function gear(){
  if(GS) return GS;
  const g = {atk:0, hp:0, crit:0, critDmg:0, aps:0, power:0, cdr:0, ls:0, gold:0, aoe:0, dr:0, thorns:0, killHeal:0, pierce:0, spellblade:0, regen:0, dodge:0};
  g.atk += mainOf(S.eq.weapon) / 100;
  g.hp += mainOf(S.eq.armor) / 100;
  for(const it of [S.eq.weapon, S.eq.armor]) for(const [k, v] of it.afx) g[k] += v * afxMul(it);
  const a = S.eq.armor.type;
  if(a === 'plate') g.dr += 0.10;
  if(a === 'leather'){ g.aps += 0.08; g.crit += 0.03; }
  if(a === 'robe'){ g.power += 0.2; g.cdr += 0.08; }
  if(a === 'shadow'){ g.critDmg += 0.4; g.ls += 0.01; }
  const b = activeBuild(); if(b) b.apply(g);
  for(const [k, v] of Object.entries(cls().mods)) g[k] += v;
  for(const s of CSK[S.cls]) if(s.apply && sk(s.id)) s.apply(g, sk(s.id));
  const par = mast().paragon || 0; g.atk += 0.02 * par; g.hp += 0.02 * par;
  g.cdr = Math.min(0.6, g.cdr); g.dodge = Math.min(0.5, g.dodge);
  return GS = g;
}

function hurt(e, amt, o = {}){
  if(e.dead) return;
  let crit = false;
  if(o.crit !== false && Math.random() < critCh()){ amt *= critMul(); crit = true; }
  e.hp -= amt; e.flash = 0.1; e.hitT = 0.12;
  if(o.kb){
    const ox = o.kx ?? R.hx, oy = o.ky ?? R.hy;
    const d = Math.hypot(e.x - ox, e.y - oy) || 1, f = e.boss ? 0.15 : 1;
    e.kx += (e.x - ox) / d * o.kb * f; e.ky += (e.y - oy) / d * o.kb * f;
  }
  const ls = lifesteal();
  if(ls) R.hp = Math.min(maxHp(), R.hp + Math.min(amt * ls, maxHp() * 0.04));
  if(!o.blood && R.blood > 0 && mz('crimson') && Math.random() < 0.25){
    const bx = e.x, by = e.y, L = mz('crimson'), bd = pDmg((1 + 0.2*L) * mzMul('crimson'));
    FX.later.push({t:0.05, fn:() => { aoe(bx, by, 28 * aoeMul(), bd, {blood:true, color:'#ff5d73'}); ring(bx, by, 3, 28, 0.3, '#ff2a4a', 6);
      for(let k = 0; k < 10; k++){ const a = rand(0, 6.3), sp = rand(50, 140); FX.parts.push({x:bx, y:by, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.45, max:0.45, size:rand(2,5), color:pick(['#ff2a4a','#b0001a']), drag:3}); } }});
  }
  if(!o.quiet || crit) addText(fmt(amt), e.x + rand(-6, 6), e.y - e.r - 4, o.color || (crit ? '#ffe14d' : '#fff'), crit ? 15 : 11, crit);
  if(e.hp <= 0) killE(e);
}
function aoe(x, y, r, dmg, o = {}){
  for(const e of E) if(!e.dead && Math.hypot(e.x - x, e.y - y) < r + e.r) hurt(e, dmg, Object.assign({kx:x, ky:y, quiet:true}, o));
}
function killE(e){
  e.dead = true; e.die = 0.3;

  S.gold += g; S.totalGold += g; S.totalKills++;
  addXp(e.xp * xpMul()); addMastXp(e.xp * xpMul());
  if(S.cls === 'necro' && sk('devour')) R.fallen = Math.min(60, (R.fallen || 0) + 1);
  if(S.cls === 'necro' && !e.boss && sk('reanimate') && Math.random() < 0.03 * sk('reanimate')){
    const rx = e.x, ry = e.y;
    FX.later.push({t:0.35, fn:() => summonAlly({kind:'skel', undead:true, mult:0.7 * (1 + 0.25 * sk('sig')), life:8, r:11}, rx, ry)});
  }
  if(S.cls === 'necro' && sk('corpse') && Math.random() < 0.05 * sk('corpse')){
    const ex = e.x, ey = e.y;
    FX.later.push({t:0.08, fn:() => { explode(ex, ey, 42 * aoeMul(), pDmg(2.5), '#7dff9a', 0.12); burst(ex, ey, 14, '#c8ffd0', 120, 3); }});
  }
  // break apart into chunks + a little soul
  for(let i = 0; i < (e.boss ? 30 : 9); i++){
    const a = rand(0, 6.3), s = rand(40, e.boss ? 200 : 130);
    FX.parts.push({x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.4, 0.8), max:0.8, size:rand(2.5, e.r*0.35), color:i % 3 ? e.pal.m : e.pal.d, drag:3, chunk:true, rot:rand(0, 6), vr:rand(-10, 10)});
  }
  burst(e.x, e.y, e.boss ? 40 : 8, e.pal.a, e.boss ? 160 : 80, 3);
  FX.parts.push({x:e.x, y:e.y, vx:0, vy:-40, life:0.8, max:0.8, size:6, color:'#e8f4ff'});
  for(let i = 0; i < (e.boss ? 12 : 2); i++) FX.parts.push({x:e.x, y:e.y, vx:rand(-60,60), vy:rand(-80,-20), life:0.9, max:0.9, size:3.5, color:'#ffcf4a', coin:true});
  if(evo('vamp')) R.hp = Math.min(maxHp(), R.hp + maxHp() * 0.02);
  if(gear().killHeal) R.hp = Math.min(maxHp(), R.hp + maxHp() * gear().killHeal);
  if(e.boss || Math.random() < 0.035) FX.loot.push({x:e.x, y:e.y, t:0, it:rollDrop(e.boss)});
  if(e.boss){

}
function collectLoot(it){

    if(it.r >= 2) toast(`🎒 Bag full: salvaged ${RAR[it.r].n} for ${fmt(g)} 🪙`);

function salvageValue(it){ return enemyStats(it.lvl, false).gold * 4 * Math.pow(3, it.r) * (1 + 0.5 * plusOf(it)); }
function stageClear(){

function heroHurt(d, src){

function fail(msg){

function addXp(x){
  S.xp += x;

    S.xp -= xpNeed(S.heroLvl); S.heroLvl++;

// ---------- targeting helpers ----------
const alive = () => E.filter(e => !e.dead);
function nearest(x = R.hx, y = R.hy, exclude, maxD = Infinity){
  let best = null, bd = maxD;
  for(const e of E){ if(e.dead || (exclude && exclude.has(e))) continue; const d = Math.hypot(e.x - x, e.y - y); if(d < bd){ bd = d; best = e; } }
  return best;
}
// Boss focus: on boss stages everything prioritises the boss once it is on screen.
const held = big => big && !R.unleash; // smart casting: hold big skills until a boss or danger
function bossE(){ for(const e of E) if(e.boss && !e.dead && e.x < VX1 + 10) return e; return null; }
function cluster(){
  { const b = bossE(); if(b) return b; } // the on-screen enemy with the most neighbours (best AoE target)
  let best = null, bn = -1;
  for(const e of E){ if(e.dead || e.x > VX1 || Math.abs(e.y) > HH) continue;
    let n = 0; for(const o of E) if(!o.dead && Math.hypot(o.x - e.x, o.y - e.y) < 60) n++;
    if(n > bn){ bn = n; best = e; } }
  return best || nearest();
}
function moveTo(o, tx, ty, sp, dt){
  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy);
  if(d < 0.5) return 0;
  const st = Math.min(d, sp * dt); o.x += dx/d*st; o.y += dy/d*st;
  return d;
}
const clampX = x => Math.max(VX0 + 14, Math.min(VX1 - 14, x));
const clampY = y => Math.max(-HH + 14, Math.min(HH - 14, y));

// ---------- hero: movement + basic attack ----------
function heroUpdate(dt){
  const w = wtype(), t = bossE() || nearest();
  R.atkT = Math.min(R.atkT + dt * aps(), 3);
  let tx = 0, ty = 0, walk = false;
  if(t){
    const dx = t.x - R.hx, dy = t.y - R.hy, d = Math.hypot(dx, dy);
    const reach = w.range || (w.reach + t.r + HERO_R);
    R.face = turnTo(R.face, Math.atan2(dy, dx), dt * 14);
    if(d > reach * 0.9 && t.x < VX1 - 4){ walk = true; tx = t.x; ty = t.y; }
    if(d <= reach) swingAt(t, Math.atan2(dy, dx), w);
    else R.atkT = Math.min(R.atkT, 1);
  } else if(Math.hypot(R.hx, R.hy) > 4){ walk = true; R.face = turnTo(R.face, Math.atan2(-R.hy, -R.hx), dt * 10); }
  if(walk){
    const o = {x:R.hx, y:R.hy}, sp = 105;
    moveTo(o, tx, ty, sp, dt);
    R.hx = clampX(o.x); R.hy = clampY(o.y); R.ph += sp * dt * 0.16; R.moving = true;
  } else R.moving = false;
}
function swingAt(t, ang, w){
  while(R.atkT >= 1){
    R.atkT -= 1; R.swing = 0.22;
    const dmg = atk() * w.dmg, rc = RAR[S.eq.weapon.r].blade, hx = R.hx, hy = R.hy;
    if(w.range){
      if(S.eq.weapon.type === 'bow') FX.projs.push({kind:'arrow', x:hx + Math.cos(ang)*16, y:hy + Math.sin(ang)*16, a:ang, spd:560, dmg, pierce:1 + gear().pierce, hit:new Set(), life:0.7, c:rc});
      else FX.projs.push({kind:'orb', x:hx + Math.cos(ang)*18, y:hy + Math.sin(ang)*18, tx:t.x, ty:t.y, a:ang, spd:340, dmg, r:32*aoeMul(), c:rc, life:1.2});
    } else {
      const rr = (w.reach + HERO_R) * (1 + gear().aoe * 0.5);
      FX.slashes.push({x:hx, y:hy, a:ang, arc:w.arc, r:rr, life:0.2, max:0.2, c:rc, spin:w.arc > 6});
      for(const e of E){
        if(e.dead) continue;
        const ed = Math.hypot(e.x - hx, e.y - hy);
        if(ed > rr + e.r) continue;
        if(angDiff(Math.atan2(e.y - hy, e.x - hx), ang) <= w.arc/2 + 0.2) hurt(e, dmg, {kb:120});
      }
    }
    if(gear().spellblade && Math.random() < 0.15) chainLightning(1.5, 2, false);
  }
}

// ---------- class signature moves ----------
function castSignature(){

  const sl = sk('sig'), sm = 1 + 0.25 * sl, sev = sl >= SK_MAX;

  } else if(c.id === 'rogue'){

      let t = pool[0]; for(const e of pool) if(e.hp > t.hp) t = e;

      const ox = R.hx, oy = R.hy, a = Math.atan2(t.y - oy, t.x - ox);

  } else if(c.id === 'paladin'){

function castClassTier(id, L){

function castPower(id){

    addText('+' + fmt(h), hx, hy - HERO_R - 16, '#5be38a', 14, true);
    ring(hx, hy, 10, 70, 0.6, '#5be38a', 8);

    ring(hx, hy, 10, r, 0.45, '#9be7ff', ev ? 22 : 14);
    ring(hx, hy, 0, r * 0.7, 0.35, '#ffffff', 6);
    flash('#bfefff', ev ? 0.45 : 0.18);
    for(let i = 0; i < (ev ? 90 : 40); i++){ const a = rand(0, 6.3), s = rand(r*0.8, r*1.8); FX.parts.push({x:hx, y:hy, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.6, max:0.6, size:rand(3,6), color:'#bfefff', drag:3, shard:true, a}); }
    for(const e of E){
      if(e.dead || Math.hypot(e.x - hx, e.y - hy) > r + e.r) continue;
      e.slow = 2.5;
      if(ev){ e.stun = 2; e.frozen = 2; }
      hurt(e, dmg, {color:'#9be7ff', kb:ev ? 0 : 180, quiet:true});
    }
    if(ev) R.shake = 0.35;
    return true;
  }
  if(id === 'poison'){
    const n = ev ? 3 : 1;
    for(let i = 0; i < n; i++){
      const t = i ? pick(live) : cluster();
      FX.clouds.push({x:t.x, y:t.y, r:(38 + 3*l + (ev ? 25 : 0)) * aoeMul(), life:4.5, max:4.5, dps:pDmg(0.7 + 0.35*l), tick:0, seed:Math.random()*9});

      for(const e of E){
        if(e.dead) continue;
        const ex = e.x - hx, ey = e.y - hy, along = ex*cx + ey*cy; if(along < 0) continue;
        if(Math.abs(-ex*cy + ey*cx) < w/2 + e.r) hurt(e, dmg, {color:'#fff6b0', kb:90, quiet:true});

      for(let k = 0; k < 18; k++){ const d = rand(20, 380); FX.parts.push({x:hx + cx*d, y:hy + cy*d, vx:rand(-30,30), vy:rand(-30,30), life:0.5, max:0.5, size:rand(2,5), color:'#fff3a0'}); }

    return true;
  }
  if(id === 'hole'){

  }
  if(id === 'blood'){

    if(!fz('sanguine')) R.hp -= pour;

    for(let i = 0; i < 50; i++){ const a = rand(0, 6.3), sp = rand(r*0.8, r*2); FX.parts.push({x:hx, y:hy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.6, max:0.6, size:rand(3,7), color:pick(['#ff2a4a','#b0001a','#ff6a7a']), drag:2.5}); }
    for(const e of E) if(!e.dead && Math.hypot(e.x - hx, e.y - hy) < r + e.r) hurt(e, dmg, {color:'#ff5d73', kb:200, quiet:true});
    if(fz('sanguine')){ const h = maxHp() * (0.1 + 0.02 * fz('sanguine')) * fzMul('sanguine'); R.hp = Math.min(maxHp(), R.hp + h); addText('+' + fmt(h), hx, hy - HERO_R - 16, '#ff9aa8', 13, true); }
    addText(ev ? 'CRIMSON TIDE!' : 'BLOOD SURGE!', hx, hy - HERO_R - 24, '#ff2a4a', 14, true);
    R.shake = Math.max(R.shake, 0.25);
    return true;
  }
  if(id === 'summon'){
    const n = ev ? 5 : 1 + Math.floor(l / 3), mult = 0.6 + 0.15*l;
    for(let i = 0; i < n; i++) summonAlly({kind:'spirit', mult, life:ev ? 10 : 8, r:12});
    if(ev) summonAlly({kind:'spirit', giant:true, mult:3 + 0.5*l, life:10, r:20});
    return true;
  }
  if(id === 'tornado'){
    const n = ev ? 3 : 1, fire = fz('firenado');
    const dmg = pDmg(0.8 + 0.3*l) * (fire ? (1.3 + 0.05*fire) * fzMul('firenado') : 1);
    for(let i = 0; i < n; i++){ const t = i ? pick(live) : cluster(); FX.tornados.push({x:hx + 20, y:hy + rand(-20, 20), tx:t.x, ty:t.y, r:(ev ? 52 : 34) * aoeMul(), life:ev ? 5 : 4, max:ev ? 5 : 4, dmg, tick:0, spd:75, fire:!!fire, seed:rand(0, 9)}); }
    return true;
  }
  if(id === 'sun'){
    const sorted = live.filter(e => e.x < VX1).sort((a, b) => b.hp - a.hp), n = ev ? 5 : 1;
    for(let i = 0; i < n && sorted.length; i++){ const t = sorted[i % sorted.length]; FX.pillars.push({x:t.x, y:t.y, t:-i * 0.15, delay:0.6, r:40 * aoeMul(), dmg:pDmg(5 + 1.5*l), c:'#ffd36b'}); }
    return true;
  }
  if(id === 'quake'){
    const dmg = pDmg(4 + 1.5*l);
    quake(dmg, 1);
    if(ev){ FX.later.push({t:0.6, fn:() => quake(dmg, 0.8)}); FX.later.push({t:1.2, fn:() => quake(dmg, 1.2)}); }
    return true;
  }
  return false;
}
function chainLightning(mult, n, ev, fx = R.hx, fy = R.hy, quiet = false){
  const dmg = pDmg(mult), hit = new Set();
  let px = fx, py = fy, t = (fx === R.hx && fy === R.hy && bossE()) || nearest(px, py);
  for(let i = 0; i < n && t; i++){
    hit.add(t);
    FX.bolts.push({pts:jag(px, py, t.x, t.y), life:0.3, max:0.3, w: ev ? 4 : 3});
    t.stun = Math.max(t.stun, ev ? 1 : 0.4);
    if(ev){
      FX.bolts.push({pts:jag(t.x + rand(-30,30), -HH - 20, t.x, t.y), life:0.35, max:0.35, w:6});
      explode(t.x, t.y, 34*aoeMul(), dmg * 0.5, '#bfe9ff', 0.4);
    }
    hurt(t, dmg, {color:'#9be7ff'});
    for(let k = 0; k < 8; k++) FX.parts.push({x:t.x, y:t.y, vx:rand(-120,120), vy:rand(-120,120), life:0.35, max:0.35, size:rand(2,4), color:'#d7f4ff'});
    px = t.x; py = t.y;
    const nx = nearest(px, py, hit);
    t = nx && Math.hypot(nx.x - px, nx.y - py) < 160 ? nx : null;
  }
  if(!quiet) flash('#cfefff', ev ? 0.3 : 0.1);
}
function quake(dmg, scale){
  const hx = R.hx, hy = R.hy;
  R.shake = Math.max(R.shake, 0.5 * scale);
  ring(hx, hy, 10, Math.hypot(VX1 - VX0, HH * 2), 0.7, '#ffb36b', 16 * scale);
  ring(hx, hy, 0, VX1 * 0.8, 0.5, '#7a4a2a', 26 * scale);
  for(let i = 0; i < 7; i++){
    const a = rand(0, 6.3), pts = [[hx, hy]]; let x = hx, y = hy;
    for(let k = 0; k < 8; k++){ const aa = a + rand(-0.4, 0.4); x += Math.cos(aa)*rand(18,32); y += Math.sin(aa)*rand(18,32); pts.push([x, y]); }
    FX.decals.push({kind:'crack', pts, life:3, max:3});
  }
  for(let i = 0; i < 50; i++) FX.parts.push({x:rand(VX0,VX1), y:rand(-HH,HH), vx:rand(-20,20), vy:rand(-70,-20), life:0.8, max:0.8, size:rand(3,7), color:'#c8a27a', dust:true});
  for(const e of E) if(!e.dead){ e.stun = Math.max(e.stun, 0.7); hurt(e, dmg, {color:'#ffb36b', quiet:true}); }
}
function explode(x, y, r, dmg, color, shake = 0.2){
  if(shake >= 0.4) R.hitstop = Math.max(R.hitstop || 0, 0.05);
  aoe(x, y, r, dmg, {kb:140});
  ring(x, y, 4, r, 0.35, color, 10);
  ring(x, y, 0, r * 0.6, 0.25, '#ffffff', 5);
  burst(x, y, 26, color, r * 3, 5);
  FX.parts.push({x, y, vx:0, vy:0, life:0.25, max:0.25, size:r * 1.3, color});
  FX.decals.push({kind:'scorch', x, y, r:r * 0.8, life:4, max:4});
  R.shake = Math.max(R.shake, shake);
}

function petSpot(){ return {wolf:[-24, 20], owl:[-18, -28], dragon:[8, -30], fairy:[0, 0], golem:[-26, 22], phoenix:[-14, -30]}[S.pet] || [-20, 20]; }
function updatePet(dt){
  if(!S.pet) return;

  if(!P || P.id !== S.pet){ const [sx, sy] = petSpot(); P = R.pet = {id:S.pet, x:R.hx + sx, y:R.hy + sy, face:0, ph:0, atkT:0, lunge:0, dive:null, breath:0}; }

  const tgt = bossE() || nearest(P.x, P.y, null, 260);

      if(P.atkT >= 0.3){ P.atkT = 0;
        for(const e of E){ if(e.dead) continue; const d = Math.hypot(e.x - P.x, e.y - P.y);
          if(d < 125 + e.r && angDiff(Math.atan2(e.y - P.y, e.x - P.x), P.face) < 0.45) hurt(e, base * 0.3, {color:'#ff9a3d', quiet:true}); } }
    }
  } else if(S.pet === 'fairy'){
    const a = t * 2.2; moveTo(P, hx + Math.cos(a)*24, hy + Math.sin(a)*18 - 6, 220, dt);
    R.hp = Math.min(maxHp(), R.hp + maxHp() * 0.015 * dt);
    if(Math.random() < dt * 8) FX.parts.push({x:P.x, y:P.y, vx:rand(-10,10), vy:rand(-10,10), life:0.6, max:0.6, size:rand(1.5,3), color:'#ffb0f0'});
    if(tgt && tgt.x < VX1 && P.atkT >= 1){ P.atkT = 0; FX.projs.push({kind:'orb', x:P.x, y:P.y, tx:tgt.x, ty:tgt.y, a:0, spd:300, dmg:base * 0.5, r:20, c:'#ffb0f0', life:1.5}); }
  } else if(S.pet === 'golem'){

      const d = Math.hypot(g2.x - P.x, g2.y - P.y);
      if(d > g2.r + 16){ moveTo(P, g2.x, g2.y, 60, dt); P.ph += dt * 8; P.face = turnTo(P.face, Math.atan2(g2.y - P.y, g2.x - P.x), dt * 8); }
      else if(P.atkT >= 3){ P.atkT = 0; P.lunge = 0.25; const sx = P.x + Math.cos(P.face)*14, sy = P.y + Math.sin(P.face)*14;

        ring(sx, sy, 4, 50, 0.4, '#c8a27a', 10); R.shake = Math.max(R.shake, 0.15);
        for(let i = 0; i < 14; i++) FX.parts.push({x:sx + rand(-30,30), y:sy + rand(-30,30), vx:rand(-20,20), vy:rand(-60,-20), life:0.6, max:0.6, size:rand(3,6), color:'#a08060', dust:true}); }

    } else {
      home();
      if(tgt && tgt.x < VX1 && P.atkT >= 3){ P.atkT = 0; const a = Math.atan2(tgt.y - P.y, tgt.x - P.x);
        P.face = a; P.dive = {x0:P.x, y0:P.y, x1:clampX(tgt.x + Math.cos(a)*50), y1:clampY(tgt.y + Math.sin(a)*50), t:0, hit:new Set()}; }
    }
  }
}

          s.breath = 0.2;
          for(let i = 0; i < 3; i++){ const a = s.face + rand(-0.35, 0.35), sp = rand(160, 260);
            FX.parts.push({x:s.x + Math.cos(s.face)*16, y:s.y + Math.sin(s.face)*16 - LIFT, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.55, max:0.55, size:rand(4, 9), color:pick(['#5aff8a','#b8ffb0','#2a8a4a']), drag:1.5}); }
          if(s.atkT >= 0.3){ s.atkT = 0;
            for(const e of E){ if(e.dead) continue; const d = Math.hypot(e.x - s.x, e.y - s.y);
              if(d < 175 + e.r && angDiff(Math.atan2(e.y - s.y, e.x - s.x), s.face) < 0.45){
                hurt(e, atk() * s.mult * powerMul() * fr, {color:'#7dff9a', quiet:true});
                if(e.dead && s.raise && !e.boss && Math.random() < 0.25) summonAlly({kind:'skel', undead:true, mult:0.7 * (1 + 0.25 * sk('sig')), life:8, r:11}, e.x, e.y); } } }
        }
      }
      if(s.life <= 0) burst(s.x, s.y, 40, '#5aff8a', 120, 4);
      continue;
    }
    const t = bossE() || nearest(s.x, s.y);
    if(t && t.x < VX1){
      s.face = turnTo(s.face, Math.atan2(t.y - s.y, t.x - s.x), dt * 10);
      const d = Math.hypot(t.x - s.x, t.y - s.y);
      if(d > t.r + s.r + 2){ moveTo(s, t.x, t.y, (s.giant ? 60 : 85) * (s.undead ? fr : 1.2), dt); s.ph += dt * 10; }
      else if(s.atkT >= (s.giant ? 1.6 : 0.8) / (s.undead ? fr : 1)){
        s.atkT = 0; s.lunge = s.giant ? 0.25 : 0.15;
        const dmg = atk() * s.mult * powerMul() * (s.undead ? fr : 1);
        if(s.giant){
          const sx = s.x + Math.cos(s.face) * 18, sy = s.y + Math.sin(s.face) * 18;
          aoe(sx, sy, 48 * aoeMul(), dmg, {kb:140, color:'#b8ffb0'}); ring(sx, sy, 4, 48, 0.4, '#7dff9a', 10);
          for(let i = 0; i < 12; i++) FX.parts.push({x:sx + rand(-25,25), y:sy + rand(-25,25), vx:rand(-20,20), vy:rand(-60,-20), life:0.6, max:0.6, size:rand(3,6), color:'#a0b890', dust:true});
          R.shake = Math.max(R.shake, 0.15);
        } else hurt(t, dmg, {color:s.kind === 'spirit' ? '#bfe9ff' : '#b8ffb0', kb:50, kx:s.x, ky:s.y, quiet:true});
        if(s.kind === 'spirit' && (s.storm || (fz('spiritstorm') && Math.random() < 0.5))) chainLightning((0.8 + 0.2 * fz('spiritstorm')) * fzMul('spiritstorm'), 2, false, s.x, s.y, true);
      }
    } else { const d = moveTo(s, R.hx - 30, R.hy + (s.giant ? 0 : (s.born * 37 % 60) - 30), 70, dt); if(d > 2) s.ph += dt * 8; }
    s.lunge = Math.max(0, (s.lunge || 0) - dt);
    if(s.life <= 0){ burst(s.x, s.y, s.giant ? 30 : 12, s.kind === 'spirit' ? '#7fd0ff' : '#5aff8a', 60, 3);
      if(s.undead && S.cls === 'necro' && sk('lich') >= SK_MAX) explode(s.x, s.y, (s.giant ? 60 : 38) * aoeMul(), pDmg(s.giant ? 6 : 2), '#7dff9a', 0.08); }
  }
  for(let i = A.length - 1; i >= 0; i--) if(A[i].life <= 0) A.splice(i, 1);
}

function addText(txt, x, y, color, size, pop){
  if(FX.texts.length > 70) FX.texts.shift();
  FX.texts.push({txt, x, y, color, size, life:0.9, pop});
}
function burst(x, y, n, color, spd = 90, size = 3){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = rand(0.3, 1) * spd;
    FX.parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.3, 0.7), max:0.7, size:rand(size*0.6, size*1.4), color, drag:2.5});
  }
}
function ring(x, y, r0, r1, life, color, w){ FX.rings.push({x, y, r0, r1, life, max:life, color, w}); }
function flash(c, a){ R.flashC = c; R.flash = Math.max(R.flash, a); }
function jag(x1, y1, x2, y2){
  const pts = [[x1, y1]], n = Math.max(4, Math.floor(Math.hypot(x2-x1, y2-y1) / 14));
  const nx = -(y2-y1), ny = x2-x1, nl = Math.hypot(nx, ny) || 1;
  for(let i = 1; i < n; i++){ const t = i/n, o = rand(-10, 10); pts.push([x1 + (x2-x1)*t + nx/nl*o, y1 + (y2-y1)*t + ny/nl*o]); }
  pts.push([x2, y2]);
  return pts;
}

// =====================================================================
//  SIMULATION TICK
// =====================================================================
function updateFx(dt){
  for(const p of FX.parts){
    p.life -= dt;
    if(p.coin){ // coins arc, then fly to the hero
      if(p.life < 0.6){ const dx = R.hx - p.x, dy = R.hy - p.y, d = Math.hypot(dx, dy) || 1; p.vx = dx/d*320; p.vy = dy/d*320; if(d < 10) p.life = 0; }
      else p.vy += 200*dt;
    }
    if(p.drag){ const k = Math.max(0, 1 - p.drag*dt); p.vx *= k; p.vy *= k; }
    if(p.vr) p.rot += p.vr * dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  FX.parts = FX.parts.filter(p => p.life > 0);
  if(FX.parts.length > 700) FX.parts.splice(0, FX.parts.length - 700);
  for(const k of ['rings','bolts','beams','texts','decals','slashes','trails','scythes']){ for(const o of FX[k]) o.life -= dt; FX[k] = FX[k].filter(o => o.life > 0); }
  for(const t of FX.texts) t.y -= dt * 28;
  for(const l of FX.later){ l.t -= dt; if(l.t <= 0){ l.fn(); l.done = true; } }
  FX.later = FX.later.filter(l => !l.done);
  for(const L of FX.loot){
    L.t += dt;
    if(L.t > 0.9){ const dx = R.hx - L.x, dy = R.hy - L.y, d = Math.hypot(dx, dy) || 1; L.x += dx/d*Math.min(d, 400*dt); L.y += dy/d*Math.min(d, 400*dt); if(d < 12){ L.done = true; collectLoot(L.it); } }
  }
  FX.loot = FX.loot.filter(l => !l.done);
  // ambient zone particles
  const zk = zoneIdx(S.stage);
  for(const m of FX.amb){ m.life -= dt; m.x += m.vx * dt; m.y += m.vy * dt; m.h += m.vh * dt; if(m.h < 0) m.life = 0; }
  FX.amb = FX.amb.filter(m => m.life > 0 && m.k === zk);
  while(FX.amb.length < 28){
    const k = zk, m = {k, s:rand(0, 9), x:rand(VX0, VX1), y:rand(-HHT, HH), h:0, vh:0, vx:0, vy:0, life:rand(3, 6)};
    if(k === 0){ m.h = rand(4, 30); m.vx = rand(-8, 8); m.vy = rand(-6, 6); }
    if(k === 1){ m.h = rand(0, 12); m.vx = rand(60, 110); m.x = rand(VX0 - 40, VX1); }
    if(k === 2){ m.h = rand(40, 140); m.vh = rand(-30, -18); m.vx = rand(-10, 4); }
    if(k === 3){ m.h = rand(0, 10); m.vh = rand(18, 40); m.vx = rand(-6, 6); }
    if(k === 4){ m.h = rand(4, 50); m.vh = rand(-4, 8); m.vx = rand(-6, 6); m.vy = rand(-4, 4); }
    m.max = m.life; FX.amb.push(m);
  }
}

function tick(dt){
  S.played += dt; R.time += dt;
  R.swing = Math.max(0, R.swing - dt); R.hurt = Math.max(0, R.hurt - dt);
  R.shake = Math.max(0, R.shake - dt); R.flash = Math.max(0, R.flash - dt*1.6);
  R.banner = Math.max(0, R.banner - dt);
  updateFx(dt);

  if(R.dead > 0){
    R.dead -= dt;
    if(R.dead <= 0){ R.hp = maxHp(); R.hx = 0; R.hy = 0; startStage(); }
    return;
  }
  const mh = maxHp();
  R.hp = Math.min(mh, R.hp + mh * regenPct() * dt);
  R.rage = Math.max(0, R.rage - dt); R.immune = Math.max(0, R.immune - dt);

  if(R.pendingStage > 0){ R.pendingStage -= dt; if(R.pendingStage <= 0) startStage(); }
  if(R.pause > 0){ R.pause -= dt; heroUpdate(dt); updatePet(dt); return; }

  // ---- spawning ----
  const boss = isBoss(S.stage), nAlive = E.filter(e => !e.dead).length;
  R.spawnT -= dt;
  if(R.spawnT <= 0 && !(R.pendingStage > 0)){
    if(boss){ if(nAlive < 4){ spawnEnemy(pickKind(), false, true); } R.spawnT = 1.6; }
    else if(R.spawned < ENEMIES_PER_STAGE && nAlive < Math.min(10, 4 + Math.floor(S.stage/8))){ spawnEnemy(pickKind()); R.spawned++; R.spawnT = 0.45; }
  }

  // ---- enemies ----
  for(const e of E){
    if(e.dead){ e.die -= dt; continue; }
    e.flash -= dt; e.stun -= dt; e.slow -= dt; e.frozen -= dt; e.bladeCd -= dt; e.lunge -= dt; e.hitT -= dt;
    if(e.breath > 0) e.breath -= dt;
    const kd = Math.max(0, 1 - 7*dt); e.x += e.kx*dt; e.y += e.ky*dt; e.kx *= kd; e.ky *= kd;
    if(e.stun > 0) continue;
    const dx = R.hx - e.x, dy = R.hy - e.y, d = Math.hypot(dx, dy) || 1, reach = HERO_R + e.r + 1, sm = e.slow > 0 ? 0.5 : 1;
    e.face = turnTo(e.face, Math.atan2(dy, dx), dt * 8);
    if(e.boss){ e.specT -= dt * sm; if(e.specT <= 0){ e.specT = 4.5; bossSpecial(e); } }
    const stopRanged = e.ranged && d <= e.range && e.x < VX1 - 12;
    if(d > reach && !stopRanged){
      const sp = e.spd * (e.slow > 0 ? 0.45 : 1) * (e.x > VX1 ? 2 : 1);
      e.x += dx/d*sp*dt; e.y += dy/d*sp*dt; e.ph += sp * dt * 0.18;
    } else if(d > reach){
      e.atkT += dt * sm;
      if(e.atkT >= 2.2){ e.atkT = 0; e.lunge = 0.15; enemyShoot(e, e.ranged); }
    } else {
      e.atkT += dt * sm;
      if(e.atkT >= 1.4){ e.atkT = 0; e.lunge = 0.15; heroHurt(e.dmg, e); if(R.dead > 0) return; }
    }
  }
  // separation
  for(let i = 0; i < E.length; i++){ const a = E[i]; if(a.dead) continue;
    for(let j = i+1; j < E.length; j++){ const b = E[j]; if(b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
      if(d < m && d > 0.01){ const p = (m - d) / 2, ux = dx/d, uy = dy/d, wa = a.boss ? 0.1 : 1, wb = b.boss ? 0.1 : 1;
        a.x -= ux*p*wa; a.y -= uy*p*wa; b.x += ux*p*wb; b.y += uy*p*wb; } } }
  for(let i = E.length - 1; i >= 0; i--) if(E[i].dead && E[i].die <= 0) E.splice(i, 1);

  // ---- enemy projectiles & telegraphed slams ----
  for(const p of FX.eprojs){
    p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if(Math.hypot(p.x - R.hx, p.y - R.hy) < HERO_R + 4){ p.life = 0; heroHurt(p.dmg, null); burst(p.x, p.y, 8, EPROJ_C[p.kind], 70, 3); if(R.dead > 0) return; }
    if(p.x < VX0 - 30 || p.x > VX1 + 60 || Math.abs(p.y) > HH + 30) p.life = 0;
  }
  FX.eprojs = FX.eprojs.filter(p => p.life > 0);
  for(const T of FX.tele){
    T.t += dt;
    if(T.t >= T.dur && !T.done){
      T.done = true;
      ring(T.x, T.y, 4, T.r, 0.4, T.color, 12); burst(T.x, T.y, 30, T.color, 160, 4); R.shake = Math.max(R.shake, 0.35);
      FX.decals.push({kind:'scorch', x:T.x, y:T.y, r:T.r * 0.8, life:3, max:3});
      if(Math.hypot(R.hx - T.x, R.hy - T.y) < T.r + HERO_R) heroHurt(T.dmg, null);
      if(R.dead > 0) return;
    }
  }
  FX.tele = FX.tele.filter(T => !T.done);

  // ---- hero, companion, allies ----
  heroUpdate(dt);
  updatePet(dt);
  updateAllies(dt);

  // ---- projectiles ----
  for(const p of FX.projs){
    p.life -= dt;
    if(p.kind === 'plasma'){
      p.x += Math.cos(p.a)*p.spd*dt; p.y += Math.sin(p.a)*p.spd*dt; p.zap -= dt;
      if(p.zap <= 0){ p.zap = 0.2; const z = nearest(p.x, p.y, null, 95); if(z){ FX.bolts.push({pts:jag(p.x, p.y, z.x, z.y), life:0.2, max:0.2, w:2.5}); hurt(z, p.zdmg, {color:'#d6a8ff', quiet:true}); } }
      if(p.life <= dt || p.x > VX1 + 20){ p.life = 0; explode(p.x, p.y, 62 * aoeMul(), p.dmg, '#c58bff', 0.35); flash('#e4c8ff', 0.15); }
    } else if(p.kind === 'arrow' || p.kind === 'bone'){
      p.x += Math.cos(p.a)*p.spd*dt; p.y += Math.sin(p.a)*p.spd*dt;
      for(const e of E){ if(e.dead || p.hit.has(e)) continue;
        if(Math.hypot(e.x - p.x, e.y - p.y) < e.r + 4){ p.hit.add(e); hurt(e, p.dmg, {kb:60}); burst(p.x, p.y, 4, p.c, 60, 2); if(--p.pierce <= 0){ p.life = 0; break; } } }
    } else if(p.kind === 'missile'){
      if(!p.target || p.target.dead) p.target = nearest(p.x, p.y);
      if(p.target){ p.a = turnTo(p.a, Math.atan2(p.target.y - p.y, p.target.x - p.x), dt * 7); }
      p.x += Math.cos(p.a)*p.spd*dt; p.y += Math.sin(p.a)*p.spd*dt;
      FX.parts.push({x:p.x, y:p.y, vx:0, vy:0, life:0.25, max:0.25, size:4, color:'#c58bff'});
      if(p.target && Math.hypot(p.target.x - p.x, p.target.y - p.y) < p.target.r + 5){ p.life = 0; hurt(p.target, p.dmg, {color:'#d6a8ff', kb:60}); burst(p.x, p.y, 10, '#c58bff', 90, 3);
        if(p.boom){ aoe(p.x, p.y, 34 * aoeMul(), p.dmg * 0.6, {kb:80}); ring(p.x, p.y, 4, 34, 0.3, '#c58bff', 8); } }
    } else {
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), step = p.spd * dt;
      if(p.kind === 'fire') FX.parts.push({x:p.x, y:p.y, vx:rand(-20,20), vy:rand(-20,20), life:0.35, max:0.35, size:rand(4,8), color:'#ff8a2a'});
      if(p.kind === 'orb') FX.parts.push({x:p.x, y:p.y, vx:0, vy:0, life:0.2, max:0.2, size:5, color:p.c});
      if(d <= step){
        p.life = 0;
        if(p.kind === 'fire') explode(p.tx, p.ty, p.r, p.dmg, '#ff8a2a', 0.22);
        else { aoe(p.tx, p.ty, p.r, p.dmg, {kb:60, quiet:false}); ring(p.tx, p.ty, 2, p.r, 0.25, p.c, 5); burst(p.tx, p.ty, 10, p.c, 80, 3); }
      } else { p.x += dx/d*step; p.y += dy/d*step; }
    }
  }
  FX.projs = FX.projs.filter(p => p.life > 0);

  // arrow rain
  for(const a of FX.rain){
    a.t += dt;
    if(a.t >= a.dur && !a.done){ a.done = true; aoe(a.x, a.y, (a.fire ? 30 : 22) * aoeMul(), a.dmg, {color:a.fire ? '#ffb070' : '#e8f0c0'}); burst(a.x, a.y, a.fire ? 10 : 4, a.fire ? '#ff8a2a' : '#e8e0c8', 70, a.fire ? 4 : 2);
      if(a.fire){ ring(a.x, a.y, 2, 26, 0.3, '#ff8a2a', 5); FX.parts.push({x:a.x, y:a.y, vx:0, vy:0, life:0.3, max:0.3, size:22, color:'#ff7a2a'}); } }
  }
  FX.rain = FX.rain.filter(a => !a.done);

  // meteors (and the paladin's hammer)
  for(const m of FX.meteors){
    m.t += dt;
    if(m.t >= m.dur && !m.done){
      m.done = true;
      const c = m.kind === 'hammer' ? '#ffe08a' : m.kind === 'star' ? '#c58bff' : '#ff6a1a';
      explode(m.x, m.y, m.r, m.dmg, c, 0.4); flash(m.kind === 'hammer' ? '#fff3c0' : '#ffb070', 0.2);
      for(let i = 0; i < 20; i++) FX.parts.push({x:m.x, y:m.y, vx:rand(-200,200), vy:rand(-200,200), life:0.8, max:0.8, size:rand(2,4), color:m.kind === 'hammer' ? '#fff3c0' : '#ffcf6a', drag:2});
    }
  }
  FX.meteors = FX.meteors.filter(m => !m.done);

  // clouds
  for(const c of FX.clouds){
    c.life -= dt; c.tick -= dt;
    if(c.holy && Math.hypot(R.hx - c.x, R.hy - c.y) < c.r) R.hp = Math.min(maxHp(), R.hp + maxHp() * 0.02 * dt);
    if(c.tick <= 0){ c.tick = 0.3; aoe(c.x, c.y, c.r, c.dps * 0.3, {crit:false, color:'#9cff6a'}); }
    if(Math.random() < dt * 30) FX.parts.push({x:c.x + rand(-c.r, c.r)*0.8, y:c.y + rand(-c.r, c.r)*0.8, vx:0, vy:-20, life:0.7, max:0.7, size:rand(3,6), color:'#7dff4a'});
  }
  FX.clouds = FX.clouds.filter(c => c.life > 0);

  // black holes
  for(const h of FX.holes){
    h.life -= dt; h.tick -= dt;
    for(const e of E){ if(e.dead) continue; const dx = h.x - e.x, dy = h.y - e.y, d = Math.hypot(dx, dy);
      if(d < h.r && d > 2){ const f = (e.boss ? 15 : 110) * (1 - d/h.r) + 20; e.x += dx/d*f*dt; e.y += dy/d*f*dt; } }
    if(h.tick <= 0){ h.tick = 0.25; aoe(h.x, h.y, h.r * 0.6, h.dps * 0.25, {crit:false, color:'#d7a8ff'}); }
    if(Math.random() < dt * 60){ const a = rand(0, 6.3); FX.parts.push({x:h.x + Math.cos(a)*h.r, y:h.y + Math.sin(a)*h.r, vx:-Math.cos(a)*h.r*1.6 - Math.sin(a)*90, vy:-Math.sin(a)*h.r*1.6 + Math.cos(a)*90, life:0.55, max:0.55, size:rand(2,4), color:'#c58bff'}); }
    if(h.life <= 0 && h.boom){ explode(h.x, h.y, h.r * 0.9, h.boom, '#c58bff', 0.45); flash('#e4c8ff', 0.3);
      if(h.mega){ R.shake = 0.6; flash('#ffffff', 0.4); for(let i = 0; i < 8; i++){ const a = rand(0, 6.3), pts = [[h.x, h.y]]; let x = h.x, y = h.y;
        for(let k = 0; k < 9; k++){ const aa = a + rand(-0.4, 0.4); x += Math.cos(aa)*rand(18, 30); y += Math.sin(aa)*rand(18, 30); pts.push([x, y]); }
        FX.decals.push({kind:'crack', pts, life:4, max:4, w:6}); } } }
    if(h.life <= 0 && fz('plaguevortex')){ const L = fz('plaguevortex'); FX.clouds.push({x:h.x, y:h.y, r:h.r * 0.9, life:5, max:5, dps:pDmg((1 + 0.4*L) * fzMul('plaguevortex')), tick:0, seed:Math.random()*9}); }
  }
  FX.holes = FX.holes.filter(h => h.life > 0);

  // tornados
  for(const w of FX.tornados){
    w.life -= dt; w.tick -= dt;
    const tg = nearest(w.x, w.y);
    if(tg) moveTo(w, tg.x + Math.sin(R.time*3 + w.seed)*18, tg.y + Math.cos(R.time*2.3 + w.seed)*14, w.spd, dt);
    for(const e of E){ if(e.dead) continue; const dx = w.x - e.x, dy = w.y - e.y, d = Math.hypot(dx, dy);
      if(d < w.r + e.r && d > 2){ const f = e.boss ? 10 : 70; e.x += (dx/d - dy/d*0.8) * f * dt; e.y += (dy/d + dx/d*0.8) * f * dt; } }
    if(w.sun){ w.beamT -= dt; if(w.beamT <= 0){ w.beamT = 1; const off = rand(0, 0.8);
      for(let i = 0; i < 8; i++){ const a = off + i * Math.PI / 4, cx = Math.cos(a), cy = Math.sin(a);
        FX.beams.push({x:w.x, y:w.y, a, w:8, life:0.4, max:0.4});
        for(const e of E){ if(e.dead) continue; const ex = e.x - w.x, ey = e.y - w.y; if(ex*cx + ey*cy < 0) continue; if(Math.abs(-ex*cy + ey*cx) < 5 + e.r) hurt(e, w.beamDmg, {color:'#fff3a0', quiet:true}); } } } }
    if(w.tick <= 0){ w.tick = 0.3; aoe(w.x, w.y, w.r, w.dmg, {crit:false, color:w.fire ? '#ffb070' : '#e8f0ff'});
      if(w.fire) FX.decals.push({kind:'scorch', x:w.x + rand(-8, 8), y:w.y + rand(-8, 8), r:w.r * 0.45, life:2.5, max:2.5}); }

function drawBloom(zi){

const groundCache = new Map();
function groundPattern(i){
  if(groundCache.has(i)) return groundCache.get(i);

  const g = c.getContext('2d');
  g.fillStyle = z.base; g.fillRect(0, 0, T, T);

      for(const ox of [-T, 0, T]) for(const oy of [-T, 0, T]){ const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
        gr.addColorStop(0, light ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.14)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x + ox - r, y + oy - r, r * 2, r * 2); } } }

    g.fillStyle = rnd() < 0.5 ? z.a : z.b;
    if(z.kind === 'grass'){ g.fillRect(x, y, 2, 5); g.fillRect(x+3, y+1, 2, 4); }
    else if(z.kind === 'sand'){ g.globalAlpha = 0.5; g.fillRect(x, y, 6, 1.5); g.globalAlpha = 1; }
    else if(z.kind === 'snow'){ g.beginPath(); g.arc(x, y, rnd()*2.5, 0, 7); g.fill(); }
    else if(z.kind === 'lava'){ if(k % 14 === 0){ g.strokeStyle = 'rgba(255,90,26,.55)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd()*30-15, y + rnd()*30-15); g.lineTo(x + rnd()*40-20, y + rnd()*40-20); g.stroke(); } else g.fillRect(x, y, 4, 4); }
    else { if(k % 4 === 0){ g.fillStyle = '#ffffff'; g.globalAlpha = rnd(); g.fillRect(x, y, 1.5, 1.5); g.globalAlpha = 1; } else g.fillRect(x, y, 3, 3); }
  }

}

}
function shade(hex, k){ // lighten (k>0) or darken (k<0) a #rrggbb colour
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;

}

    g.strokeStyle = OL; g.lineWidth = 1;

function drawHead(g, lk, t){

function drawHero(g, lk, st){
  // st: {face, swing, t, rage, immune, hurt, moving, ph}
  const t = st.t;
  g.save();
  if(lk.aura || st.rage){
    const col = st.rage ? '#ff4a1a' : lk.aura === 'rainbow' ? `hsl(${Math.floor(t*120)%360},100%,60%)` : lk.aura;
    gglow(g, col, 0, 0, 40, 0.55 + 0.2*Math.sin(t*5));
  }
  if(!st.noShadow){ g.fillStyle = 'rgba(0,0,0,.35)'; ell(g, 0, 8, 17, 8.5); g.fill(); }
  g.scale(1.15, 1.15);
  g.rotate(st.face);
  if(st.hurt > 0) g.translate(rand(-1.5, 1.5), rand(-1.5, 1.5));
  g.lineWidth = 1.1; g.strokeStyle = OL; g.lineJoin = 'round';
  // boots
  const step = st.moving ? Math.sin(st.ph) * 4.5 : 0;
  ell(g, 1 + step, -5, 4.6, 3); fo(g, '#3a2a1e');
  ell(g, 1 - step, 5, 4.6, 3); fo(g, '#3a2a1e');
  // cape
  if(lk.cape){
    const fl = Math.sin(t*7) * 2.5 * (st.moving ? 1.7 : 1);
    g.beginPath(); g.moveTo(-3, -9); g.quadraticCurveTo(-16, -13 - fl, -24, -9 + fl); g.lineTo(-25, 9 + fl); g.quadraticCurveTo(-16, 13 - fl, -3, 9); g.closePath(); fo(g, lk.cape);
    g.strokeStyle = 'rgba(0,0,0,.22)'; line(g, -8, -4, -22, -3 + fl*0.5); line(g, -8, 4, -22, 5 + fl*0.5); g.strokeStyle = OL;
  }
  // quiver on the back (ranger)
  if(lk.cls === 'ranger'){
    g.save(); g.translate(-7, -2); g.rotate(-0.5);
    rrp(g, -8, -2.8, 14, 5.6, 2); fo(g, '#7a4a22');
    for(const [y, c] of [[-1.5, '#f0f0f0'], [0.5, '#d94a4a'], [2, '#f0f0f0']]){ tri(g, -8, y - 1, -12, y, -8, y + 1); fo(g, c); }
    g.restore();
  }

  const w = WT[lk.weapon], sw = st.swing > 0 ? 1 - st.swing/0.22 : -1;
  g.save();

    const arc = Math.min(w.arc, 2.6);
    const a = sw < 0 ? 0.9 : (w.arc > 6 ? sw * Math.PI * 2 + 0.9 : arc/2 - sw * arc);
    g.translate(2, 0); g.rotate(a); g.translate(9, 0);

  circ(g, 0, 0, 2.9); fo(g, lk.armorType === 'plate' ? '#c9d2e8' : lk.skin);
  g.restore();
  if(lk.weapon === 'dagger'){ g.save(); g.translate(6, -11); g.rotate(-0.6 + (sw > 0 ? Math.sin(sw*Math.PI)*0.8 : 0)); drawWeapon(g, 'dagger', lk.weaponR, lk.weaponPlus); circ(g, 0, 0, 2.6); fo(g, lk.skin); g.restore(); }
  else drawOffhand(g, lk, t);
  // torso + head
  drawTorso(g, lk, t);
  circ(g, 2, 0, 6.6); fo(g, st.hurt > 0 ? '#ff9aa8' : lk.skin);
  if([1, 2, 3, 6, 7].includes(lk.head)){ g.fillStyle = '#1b1530'; circ(g, 6.4, -2.3, 1.1); g.fill(); circ(g, 6.4, 2.3, 1.1); g.fill(); }
  drawHead(g, lk, t);
  g.restore();
  if(st.immune > 0){ g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = 'rgba(255,230,140,.8)'; g.lineWidth = 2; circ(g, 0, 0, 22 + Math.sin(t*10)*1.5); g.stroke(); g.restore(); }
}

function eyesF(g, e, d, sp, er, col = '#fff', pupil = true){
  const fx = Math.cos(e.face), fy = Math.sin(e.face), px = -fy, py = fx;

    circ(g, fx*d + px*sp*s, fy*d + py*sp*s, er); g.fillStyle = col; g.fill(); if(pupil) g.stroke();
    if(pupil){ g.fillStyle = '#1b1530'; circ(g, fx*(d + er*0.4) + px*sp*s, fy*(d + er*0.4) + py*sp*s, er*0.5); g.fill(); }
  }
}
function feet(g, e, c, spread = 0.4, size = 1){

  ell(g, -s, r*spread, r*0.28*size, r*0.17*size); fo(g, c);
}

function skel(g, e, t, archer){

  for(const p of PW) if(p.cd && pw(p.id)) icons.push({icon:evo(p.id) ? p.eicon : p.icon, full:p.cd(pw(p.id)) * cdMul(), cd:R.cd[p.id], ev:evo(p.id), rage:(p.id === 'rage' && R.rage > 0) || (p.id === 'blood' && R.blood > 0), hold:p.id === 'rage' || p.id === 'blood'});
  for(const f of FUSIONS) if(f.cd && fz(f.id)) icons.push({icon:f.icon, full:f.cd * cdMul(), cd:R.cd['fz_' + f.id], fusion:true});
  for(const g of MEGAS) if(g.cd && mz(g.id)) icons.push({icon:g.icon, full:g.cd * cdMul(), cd:R.cd['mz_' + g.id], mega:true, hold:true});
  if(omegaLv()) icons.push({icon:OMEGA.icon, full:OMEGA.cd * cdMul(), cd:R.cd.omega, mega:true, hold:true});
  if(ultLv()) icons.unshift({icon:ULT.icon, full:Math.max(12, 30 - 0.4 * ultLv()) * cdMul(), cd:R.cd.ult, ult:true, hold:true});
  const Z = icons.length > 9 ? 22 : 30; iy = H - Z - 8;
  for(const ic of icons){
    const frac = Math.max(0, Math.min(1, (ic.cd ?? ic.full) / ic.full));
    ctx.fillStyle = '#000b'; rr(ix, iy, Z, Z, 7); ctx.fill();
    if(ic.ev || ic.sig || ic.fusion || ic.mega || ic.ult){ ctx.strokeStyle = ic.ult ? '#ffffff' : ic.mega ? '#ff6ad5' : ic.fusion ? '#5be3d8' : ic.sig ? '#a77bff' : '#ffcf4a'; ctx.lineWidth = 2; rr(ix, iy, Z, Z, 7); ctx.stroke(); }
    ctx.font = `${Math.round(Z*0.53)}px system-ui`; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(ic.icon, ix + Z/2, iy + Z/2 + 1);
    if(frac > 0){ ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(ix, iy + Z*(1 - frac), Z, Z*frac); }
    if(ic.hold && !R.unleash && !((ic.cd ?? ic.full) > 0)){ // ready but held in reserve
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(R.time * 5); ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 2.5; rr(ix - 1, iy - 1, Z + 2, Z + 2, 8); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffcf4a'; ctx.font = `900 ${Math.round(Z * 0.32)}px system-ui`; ctx.fillText('⏸', ix + Z - Z*0.18, iy + Z*0.2); }
    if(ic.rage){ ctx.strokeStyle = '#ff7a45'; ctx.lineWidth = 2; rr(ix, iy, Z, Z, 7); ctx.stroke(); }
    ix += Z + 3;
    if(ix > W - Z - 8){ ix = 8; iy -= Z + 3; }
  }
  ctx.textBaseline = 'alphabetic';
}

// tap to blast
cv.addEventListener('pointerdown', ev => {
  if(R.dead > 0) return;
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left - W*HERO_SX) / K, y = (ev.clientY - r.top - H*CY) / (K*TILT), rad = 30 * aoeMul();
  aoe(x, y, rad, tapDmg(), {color:'#9be7ff', kb:80, quiet:false});
  ring(x, y, 2, rad, 0.25, '#9be7ff', 5);
  burst(x, y, 10, '#9be7ff', 120, 3);
  document.getElementById('tapHint').style.display = 'none';
});

function buyPlan(u){
  const lvl = up(u.id), cap = u.max ?? Infinity;
  const want = S.buyAmt === 'max' ? Infinity : +S.buyAmt;
  let n = 0, cost = 0;
  while(n < want && lvl + n < cap && n < 1000){
    const c = upCost(u, lvl + n);
    if(S.buyAmt === 'max' && cost + c > S.gold) break;
    cost += c; n++;
  }
  if(S.buyAmt === 'max' && n === 0 && lvl < cap){ n = 1; cost = upCost(u, lvl); }
  return {n, cost, maxed: lvl >= cap};
}

function drawHeroPreview(){
  const c = $('lookCv'); if(!c) return;
  const g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = ZONES[zoneIdx(S.stage)].base; g.fillRect(0, 0, 300, 300);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, 0, 300, 300);
  const t = performance.now() / 1000;
  g.save(); g.translate(150, 130); g.scale(3.2, 3.2);
  const sw = (t % 1.6) < 0.22 ? 0.22 - (t % 1.6) : 0;
  drawHero(g, heroLook(), {face:Math.sin(t*0.8)*0.5, swing:sw, t, rage:false, immune:0, hurt:0, moving:false, ph:0});
  g.restore();
  if(S.pet){ g.save(); g.translate(62, 245); g.scale(2.2, 2.2); drawPet(g, S.pet, {x:0, y:0, face:0.3, ph:t*6, lunge:0, breath:0}, t); g.restore(); }
}

function soulGain(){ return S.maxStage < 25 ? 0 : Math.floor(Math.pow(S.maxStage / 10, 2.2)); }
function farmRate(){
  const st = enemyStats(S.stage, false);
  const dps = atk() * aps() * wtype().dmg * (1 + critCh() * (critMul() - 1)) * 2;
  const tpk = st.hp / dps + 0.3;
  return {gps: st.gold * goldMul() / tpk, xps: st.xp * xpMul() / tpk, kps: 1 / tpk};
}

function equip(uid){
  const i = S.inv.findIndex(x => x.uid === uid); if(i < 0) return;
  const it = S.inv[i], old = S.eq[it.slot], hpFrac = R.hp / maxHp();
  S.inv.splice(i, 1, old); S.eq[it.slot] = it;
  gearChanged(); R.hp = hpFrac * maxHp(); invVer++;
}
function setClass(id){
  const c = CLM[id]; if(!c || !unlocked(c.req) || S.cls === id) return;

  gearChanged(); R.hp = hpFrac * maxHp();
}

      S.ultLv = Math.max(1, S.ultLv || 0);
      showModal(`<h2>✴️ FUSION⁴ ✴️</h2><p>Every fusion has become one.</p><div class="reward" style="color:#fff;text-shadow:0 0 12px #ff6ad5">ULTIMATE: ${ULT.n}</div><p>${ULT.info(ultLv())}</p><button class="btn" data-close>Become a god</button>`);
      flash('#ffffff', 1); R.shake = 0.8; ring(R.hx, R.hy, 0, 260, 1.2, '#ff6ad5', 22);
    } else { toast(name); burst(R.hx, R.hy, 24, '#ff6ad5', 120, 3); }
    updatePanel(); persist(); return;
  }
  if(t.dataset.cfup || t.dataset.cf2up || t.dataset.cultup){
    const m = mast(), T = ctier(); if(m.pts < 1) return;
    const hadUlt = cultLv() > 0; let nn = 0, name = '';
    if(t.dataset.cfup){ const f = T.f.find(x => x.id === t.dataset.cfup); if(!f || !cfCanUp(f)) return; nn = spendN(Math.min(m.pts, CF_MAX - cfz(f))); m.cf = m.cf || {}; m.cf[f.id] = cfUp(f.id) + nn; name = `${f.icon} ${f.n} Lv ${cfz(f)}`; }
    else if(t.dataset.cf2up){ if(!cf2CanUp()) return; nn = spendN(Math.min(m.pts, CF2_MAX - cf2Lv())); m.cf2 = (m.cf2 || 0) + nn; name = `${T.f2.icon} ${T.f2.n} Lv ${cf2Lv()}`; }
    else { if(!cultLv()) return; nn = spendN(m.pts); m.cult = cultLv() + nn; name = `${T.ult.icon} ${T.ult.n} Lv ${cultLv()}`; }
    m.pts -= nn;
    if(!hadUlt && cultLv()){
      m.cult = Math.max(1, m.cult || 0);
      showModal(`<h2>✴️ ${cls().n.toUpperCase()} ULTIMATE ✴️</h2><p>Your class has reached its peak.</p><div class="reward" style="color:#fff;text-shadow:0 0 12px #ff6ad5">${T.ult.icon} ${T.ult.n}</div><p>${T.ult.info(cultLv())}</p><button class="btn" data-close>Unleash it</button>`);
      flash('#ffffff', 1); R.shake = 0.8; ring(R.hx, R.hy, 0, 260, 1.2, '#ff6ad5', 22);
    } else { toast(name); burst(R.hx, R.hy, 24, '#5be3d8', 120, 3); }
    renderPanel(); persist(); return;
  }
  if(t.dataset.fx){ S.lowFx = t.dataset.fx === 'low'; toast(S.lowFx ? '🎨 Graphics: Low' : '🎨 Graphics: High'); renderPanel(); persist(); return; }
  if(t.dataset.smart){ S.smartOff = t.dataset.smart === 'off'; toast(S.smartOff ? '🧠 Smart casting OFF' : '🧠 Smart casting ON: big skills saved for bosses & danger'); renderPanel(); persist(); return; }
  if(t.dataset.spend){ S.spendAmt = t.dataset.spend; renderPanel(); persist(); return; }
  if(t.dataset.paragon){
    const m = mast(); if(!classMaxed() || m.pts < 1) return;
    const nn = spendN(m.pts); m.pts -= nn; m.paragon = (m.paragon || 0) + nn; gearChanged(); toast(`♾️ ${cls().n} Paragon ${m.paragon}`); burst(R.hx, R.hy, 20, '#ffcf4a', 100, 3);
    renderPanel(); persist(); return;
  }
  if(t.dataset.overdrive){
    if(!powersMaxed() || S.sp < 1) return;
    const nn = spendN(S.sp); S.sp -= nn; S.overdrive = (S.overdrive || 0) + nn; toast(`♾️ Power Overdrive ${S.overdrive}`); burst(R.hx, R.hy, 20, '#ffcf4a', 100, 3);
    updatePanel(); persist(); return;
  }
  if(t.dataset.forge){
    const it = S.eq[t.dataset.forge], c = forgeCost(it);
    if(plusOf(it) >= FORGE_MAX) return;
    if(S.gold < c){ toast('🪙 Need ' + fmt(c) + ' gold'); return; }
    const hpFrac = R.hp / maxHp();
    S.gold -= c; it.plus = plusOf(it) + 1;
    let bonus = null;
    if(it.plus % 5 === 0) bonus = addBonusAffix(it);
    gearChanged(); R.hp = hpFrac * maxHp();
    flash('#ffe08a', 0.25); ring(R.hx, R.hy, 0, 60, 0.45, RAR[it.r].c, 8); burst(R.hx, R.hy, 30, '#ffcf4a', 140, 3);
    if(bonus) showModal(`<h2>⚒️ +${it.plus}!</h2><p>${it.name} gained a bonus stat:</p><div class="reward" style="color:var(--gold)">${AFX[bonus[0]].f(bonus[1] * afxMul(it))}</div><button class="btn" data-close>Nice!</button>`);
    else toast(`⚒️ ${it.name} is now +${it.plus}!`);
    invVer++; renderPanel(); persist(); return;
  }
  if(t.dataset.pet){ S.pet = t.dataset.pet; R.pet = null; toast(PTM[S.pet].icon + ' ' + PTM[S.pet].n + ' joins you!'); renderPanel(); persist(); return; }
  if(t.dataset.petup){
    const id = t.dataset.petup, c = petCost(id);
    if(S.gold < c){ toast('🪙 Need ' + fmt(c) + ' gold'); return; }
    S.gold -= c; S.petLv[id] = petLv(id) + 1; toast(PTM[id].icon + ' ' + PTM[id].n + ' Lv ' + petLv(id));
    renderPanel(); persist(); return;
  }
  if(t.dataset.equip){ equip(+t.dataset.equip); renderPanel(); persist(); return; }
  if(t.dataset.salv){
    const i = S.inv.findIndex(x => x.uid === +t.dataset.salv); if(i < 0) return;
    const g = salvageValue(S.inv[i]); S.gold += g; S.totalGold += g; S.inv.splice(i, 1); invVer++;
    toast('🪙 Salvaged for ' + fmt(g)); renderPanel(); persist(); return;
  }
  if(t.id === 'salvAll'){
    let g = 0;
    S.inv = S.inv.filter(it => { const worse = !plusOf(it) && it.r <= S.eq[it.slot].r && mainOf(it) <= mainOf(S.eq[it.slot]); if(worse) g += salvageValue(it); return !worse; });
    S.gold += g; S.totalGold += g; invVer++;
    toast('🪙 Salvaged for ' + fmt(g)); renderPanel(); persist(); return;
  }
  if(t.id === 'autoSalv'){ S.autoSalvage = S.autoSalvage >= 2 ? -1 : S.autoSalvage + 1; renderPanel(); persist(); return; }
  if(t.dataset.losave){ S.loadouts[+t.dataset.losave] = {w:S.eq.weapon.uid, a:S.eq.armor.uid, cls:S.cls, pet:S.pet}; toast('💾 Saved build ' + (+t.dataset.losave + 1)); renderPanel(); persist(); return; }
  if(t.dataset.loload){
    const lo = S.loadouts[+t.dataset.loload]; if(!lo) return;
    for(const uid of [lo.w, lo.a]) if(S.inv.some(x => x.uid === uid)) equip(uid);
    if(lo.cls) setClass(lo.cls);
    if(lo.pet && unlocked(PTM[lo.pet].req)){ S.pet = lo.pet; R.pet = null; }
    toast('⚔️ Loaded build ' + (+t.dataset.loload + 1) + (activeBuild() ? ': ' + activeBuild().n : ''));
    renderPanel(); persist(); return;
  }
  if(t.dataset.look){
    const key = t.dataset.look, val = +t.dataset.val, o = LOOK[key][key === 'dye' ? val + 1 : val];
    if(!unlocked(o)){ toast('🔒 ' + reqText(o)); return; }
    S.look[key] = val; renderPanel(); persist(); return;
  }
  if(t.id === 'farmBtn'){
    S.farm = !S.farm;
    toast(S.farm ? '🔁 Farming this stage' : '⏩ Auto-advance on');
    return;
  }
  if(t.id === 'giftBtn'){
    if(Date.now() < S.giftAt){ toast('🎁 Next free gift in ' + fmtTime((S.giftAt - Date.now())/1000)); return; }
    const g = Math.max(50, farmRate().gps * 900);
    S.gold += g; S.totalGold += g; S.giftAt = Date.now() + GIFT_EVERY;
    const it = rollDrop(true); collectLoot(it);
    showModal(`<h2>🎁 Free Gift!</h2><p>15 minutes of loot, on the house.</p><div class="reward" style="color:var(--gold)">+${fmt(g)} 🪙</div>
      <p>+ <b style="color:${RAR[it.r].c}">${itemIcon(it)} ${it.name}</b></p><button class="btn" data-close>Nice!</button>`);
    persist(); return;
  }
  if(t.id === 'ascBtn'){
    const g = soulGain();
    showModal(`<h2>👻 Ascend?</h2><p>Your stage, gold, upgrades, hero level and powers reset. Gear, classes, companions &amp; looks are kept.</p>
      <div class="reward" style="color:var(--soul)">+${fmt(g)} Souls</div>
      <p>Souls are permanent: +10% damage &amp; gold each.</p>
      <button class="btn" id="ascYes">Ascend!</button><button class="btn" style="background:var(--card)" data-close>Not yet</button>`);
    return;
  }
  if(t.id === 'ascYes'){
    const g = soulGain();
    Object.assign(S, {souls:S.souls + g, gold:0, stage:1, maxStage:1, kills:0, farm:false, heroLvl:1, xp:0, sp:0, up:{}, pw:{}, overdrive:0, fzUp:{}, mzUp:{}, omUp:0, ultLv:0, ascensions:S.ascensions + 1});
    Object.assign(R, {cd:{}, rage:0, dead:0, pendingStage:0, hx:0, hy:0});
    R.hp = maxHp(); startStage();
    closeModal(); renderPanel(); persist();
    toast('👻 Ascended! +' + fmt(g) + ' souls');
    return;
  }
  if(t.id === 'wipeBtn'){
    showModal(`<h2>Reset everything?</h2><p>This deletes ALL progress, souls and gear included. It can't be undone.</p>
      <button class="btn danger" id="wipeYes">Yes, wipe it</button><button class="btn" style="background:var(--card)" data-close>Cancel</button>`);
    return;
  }
  if(t.id === 'wipeYes'){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    location.reload(); return;
  }
  if('close' in t.dataset){ closeModal(); return; }
});

function updateHud(){
  $('gold').textContent = fmt(S.gold);
  $('souls').textContent = fmt(S.souls);
  const boss = isBoss(S.stage), bossEnt = E.find(e => e.boss);
  $('stageTxt').textContent = `Stage ${S.stage} · ${zoneName(S.stage)}`;
  $('stageFill').style.width = (boss ? (bossEnt ? (1 - Math.max(0, bossEnt.hp)/bossEnt.maxHp) : 0) : S.kills / ENEMIES_PER_STAGE) * 100 + '%';
  $('stageSub').textContent = boss ? `👑 ${BOSSES[zoneIdx(S.stage)].n}: beat it in 30s!` : `${S.kills}/${ENEMIES_PER_STAGE} enemies` + (S.farm ? ' · farming' : '');
  const fb = $('farmBtn');
  fb.className = S.farm ? 'off' : 'on';
  fb.textContent = S.farm ? (isBoss(S.stage + 1) ? '👑 Fight boss' : '🔁 Farming') : '⏩ Auto';
  refundCatchAll();
  $('lvl').textContent = S.heroLvl;
  if(Object.keys(S.pw).length) $('tapHint').style.display = 'none';
  $('xpFill').style.width = (S.xp / xpNeed(S.heroLvl) * 100) + '%';
  $('spBadge').textContent = S.sp ? `${S.sp} pt${S.sp > 1 ? 's' : ''}` : '';
  $('clsTag').textContent = cls().icon + ' ' + cls().n;
  const b = activeBuild(), bt = $('buildTag');
  bt.textContent = b ? b.icon + ' ' + b.n : 'No build'; bt.className = b ? 'on' : '';
  const giftReady = Date.now() >= S.giftAt;
  $('giftBtn').classList.toggle('ready', giftReady);
  $('giftTxt').textContent = giftReady ? 'Free!' : fmtTime((S.giftAt - Date.now())/1000);
  const tabs = document.querySelectorAll('#tabs button');
  tabs[0].classList.toggle('alert', UPG.some(u => !buyPlan(u).maxed && S.gold >= upCost(u, up(u.id))));
  tabs[1].classList.toggle('alert', S.sp > 0 && (PW.some(p => S.heroLvl >= p.req && pw(p.id) < PW_MAX) || powersMaxed()));
  tabs[2].classList.toggle('alert', mast().pts > 0);
  tabs[3].classList.toggle('alert', S.inv.some(it => it.r > S.eq[it.slot].r || mainOf(it) > mainOf(S.eq[it.slot])));
  tabs[4].classList.toggle('alert', soulGain() > 0 && soulGain() >= Math.max(1, S.souls * 0.5));
}

// =====================================================================
//  OFFLINE PROGRESS
// =====================================================================
function checkOffline(){
  const away = (Date.now() - S.last) / 1000;
  if(away < 60 || S.totalKills === 0){ S.last = Date.now(); return; }
  const t = Math.min(away, OFFLINE_CAP);
  const r = farmRate();
  const g = r.gps * t, x = r.xps * t, k = Math.floor(r.kps * t);
  const lvBefore = S.heroLvl;
  S.gold += g; S.totalGold += g; S.totalKills += k;
  addXp(x); addMastXp(x);
  const found = [];
  for(let i = 0; i < Math.min(5, Math.floor(k * 0.035)); i++){ const it = rollDrop(false); collectLoot(it); found.push(it); }
  S.last = Date.now();
  showModal(`<h2>🌙 Welcome back!</h2><p>Your hero kept fighting for <b>${fmtTime(t)}</b>${away > OFFLINE_CAP ? ' (12h max)' : ''}.</p>
    <div class="reward" style="color:var(--gold)">+${fmt(g)} 🪙</div>
    <p>${fmt(k)} enemies defeated${S.heroLvl > lvBefore ? ` · +${S.heroLvl - lvBefore} hero level${S.heroLvl - lvBefore > 1 ? 's' : ''}` : ''}</p>
    ${found.length ? `<p>Loot: ${found.map(it => `<span style="color:${RAR[it.r].c}">${itemIcon(it)}</span>`).join(' ')}</p>` : ''}
    <button class="btn" data-close>Collect</button>`);
  persist();
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
document.querySelectorAll('#buyRow button').forEach(b => b.classList.toggle('active', b.dataset.amt === S.buyAmt));
if(!CLM[S.cls] || !unlocked(CLM[S.cls].req)) S.cls = 'knight';
if(S.pet && !unlocked(PTM[S.pet]?.req)) S.pet = 'wolf';
resize();
R.hp = maxHp();
startStage();
renderPanel();
checkOffline();
if(S.catchup){ delete S.catchup; persist(); setTimeout(() => toast('🎁 Skill boost! Bonus skill & mastery points added'), 2600); }

let lastT = performance.now(), uiT = 0, saveT = 0;
function frame(now){
  let dt = (now - lastT) / 1000; lastT = now;
  if(dt > 1) dt = 1;          // big gaps are handled by offline progress
  if(R.hitstop > 0){ R.hitstop -= dt; dt *= 0.15; } // impact freeze on huge hits
  let steps = Math.ceil(dt / 0.02); const h = dt / steps;
  while(steps--) tick(h);
  render(now / 1000);
  if(tab === 'hero') drawHeroPreview();
  uiT += dt; saveT += dt;
  if(uiT > 0.2){ uiT = 0; updateHud(); updatePanel(); }
  if(saveT > 5){ saveT = 0; persist(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { lastT = t; resize(); frame(t); });

document.addEventListener('visibilitychange', () => {
  if(document.hidden) persist();
  else { checkOffline(); lastT = performance.now(); }
});
addEventListener('pagehide', persist);

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
