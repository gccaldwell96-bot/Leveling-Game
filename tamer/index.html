<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#181828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tamer's Trail">
<title>Tamer's Trail</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#404858;--paper:#f8f0d8;--bg:#181828}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);height:100%;overscroll-behavior:none}
  body{font-family:'Pixelify Sans',monospace;color:var(--ink);-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;padding-top:env(safe-area-inset-top)}
  #app{width:390px;max-width:100vw;margin:0 auto;position:relative}
  canvas{display:block;image-rendering:pixelated}
  #scr{position:relative;overflow:hidden;background:#0e0e18}
  .fr{background:var(--paper);box-shadow:0 -4px var(--ink),0 4px var(--ink),-4px 0 var(--ink),4px 0 var(--ink),inset 0 -4px #d8c8a0,inset 4px 0 #fff8e8;position:absolute}
  .box{background:#f8f8f8;box-shadow:0 -4px var(--ink),0 4px var(--ink),-4px 0 var(--ink),4px 0 var(--ink),inset 0 0 0 4px #b8c8e0;padding:13px 16px;font-size:19px;font-weight:700;color:var(--ink)}
  .nm{display:flex;justify-content:space-between;font-weight:700;font-size:18px;line-height:1}
  .hp{display:flex;align-items:center;gap:4px;margin-top:6px}
  .hp em{font-style:normal;font-weight:700;font-size:12px;background:var(--ink);color:#f8c040;padding:1px 4px 2px}
  .hp span{flex:1;height:10px;background:#506058;box-shadow:0 0 0 3px var(--ink);position:relative}
  .hp i{position:absolute;left:0;top:0;bottom:0}.hp i::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:#fff6}
  .xp{height:6px;background:#c8c0a0;margin-top:7px;box-shadow:0 0 0 2px var(--ink)}.xp i{display:block;height:100%;background:#48a8f8}
  .hpn{text-align:right;font-weight:700;font-size:16px;margin-top:5px;letter-spacing:1px}
  #msg{margin:12px 8px 0;min-height:84px;line-height:1.35;white-space:pre-line}
  #menu{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin:16px 8px 10px}
  .mb{background:#f8f8f8;box-shadow:0 -4px var(--ink),0 4px var(--ink),-4px 0 var(--ink),4px 0 var(--ink),inset 0 -5px #c8d0e0;padding:12px 12px 14px;font:700 19px 'Pixelify Sans',monospace;color:var(--ink);text-align:left;border:0;position:relative}
  .mb:active{transform:translateY(2px);box-shadow:0 -4px var(--ink),0 4px var(--ink),-4px 0 var(--ink),4px 0 var(--ink),inset 0 -2px #c8d0e0}
  .mb small{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:5px;opacity:.85}
  .mb.wide{grid-column:span 2;text-align:center}
  .mb:disabled{opacity:.4}
  .ty{display:inline-block;color:#fff;padding:0 6px 1px;font-size:12px;font-weight:700;text-shadow:0 1px 0 #0005}
  .pad{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 18px;background:#262640;border-top:4px solid #12121e}
  .dp{width:126px;height:126px;position:relative;touch-action:none}
  .dp b{position:absolute;width:42px;height:42px;background:#4a4a6a;box-shadow:inset 0 -5px #33334a,inset 0 4px #6a6a90}
  .dp b.on{background:#5c5c80;box-shadow:inset 0 -2px #33334a}
  .dp b.c{box-shadow:none}
  .ab{display:flex;gap:14px;align-items:flex-end}
  .ab button{width:62px;height:62px;border-radius:50%;border:0;color:#fff;font:700 24px 'Pixelify Sans',monospace;box-shadow:inset 0 -6px #0004,inset 0 5px #fff4,0 4px #0006}
  .ab button:active{transform:translateY(2px);box-shadow:inset 0 -3px #0004,0 2px #0006}
  .st{border:0;background:#4a4a6a;color:#c8c8e8;font:700 14px 'Pixelify Sans',monospace;padding:6px 10px;box-shadow:inset 0 -3px #33334a}
  .hud{position:absolute;font-weight:700;font-size:15px;pointer-events:none}
  #dlg{position:absolute;left:10px;right:10px;bottom:10px;padding:12px 14px 16px;font-size:18px;line-height:1.35;min-height:70px;white-space:pre-line}
  #dlg .more{position:absolute;right:12px;bottom:8px;border:6px solid transparent;border-top:8px solid var(--ink);animation:bob .6s infinite alternate}
  @keyframes bob{to{transform:translateY(3px)}}
  #ov{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 12px 20px;overflow:auto}
  #ov[hidden]{display:none}
  #ovb{width:366px;max-width:100%;background:var(--paper);box-shadow:0 -4px var(--ink),0 4px var(--ink),-4px 0 var(--ink),4px 0 var(--ink);padding:14px}
  #ovb h2{font-size:22px;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:3px dashed #d8c8a0}
  .row canvas{flex:none}
  .pbtn{border:0;background:var(--ink);color:#fff;font:700 15px 'Pixelify Sans',monospace;padding:8px 12px;margin:3px 2px}
  .pbtn.alt{background:#c8b890;color:var(--ink)}
  .pbtn:disabled{opacity:.4}
  #fade{position:absolute;inset:0;pointer-events:none;opacity:0;background:#000}
  .title{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:#fff;text-shadow:0 3px 0 #404858,3px 0 0 #404858,-3px 0 0 #404858,0 -3px 0 #404858,3px 3px 0 #282838}
</style>

<script>
'use strict';
// ============================================================================================
//  TAMER'S TRAIL: an original creature-taming adventure. Everything is drawn in code, pixel by pixel.
// ============================================================================================
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
const irand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function tween(ms, fn){ return new Promise(res => { const t0 = performance.now(); const step = now => { const t = Math.min(1, (now - t0) / ms); fn(t); if(t < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }); }

// ---------------------------------- pixel engine ----------------------------------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const toHex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const shade = (c, f) => toHex(hex(c).map(v => f < 0 ? v * (1 + f) : v + (255 - v) * f));
const tint = (c, f, t) => { const a = hex(c), b = hex(t); return toHex(a.map((v, i) => v + (b[i] - v) * f)); };
let G; // current 2D context for the pixel helpers
const px = (x, y, c) => { G.fillStyle = c; G.fillRect(Math.round(x), Math.round(y), 1, 1); };
const rect = (x, y, w, h, c) => { G.fillStyle = c; G.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function ell(cx, cy, rx, ry, c){ cx = Math.round(cx); cy = Math.round(cy); rx = Math.max(0, Math.round(rx)); ry = Math.max(0, Math.round(ry)); G.fillStyle = c;
  for(let y = -ry; y <= ry; y++){ const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y * y) / ((ry + 0.3) * (ry + 0.3))))); G.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
function ring(cx, cy, rx, ry, c){ cx = Math.round(cx); cy = Math.round(cy); const n = Math.max(12, Math.round((rx + ry) * 3)); for(let i = 0; i < n; i++){ const a = i / n * Math.PI * 2; px(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, c); } }
function line(x0, y0, x1, y1, c, w = 1){ x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  G.fillStyle = c; for(let i = 0; i < 400; i++){ G.fillRect(x0 - (w > 1 ? 1 : 0), y0 - (w > 1 ? 1 : 0), w, w); if(x0 === x1 && y0 === y1) break; const e2 = 2 * e; if(e2 >= dy){ e += dy; x0 += sx; } if(e2 <= dx){ e += dx; y0 += sy; } } }
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
function vgrad(x, y, w, h, stops){ for(let j = 0; j < h; j++){ const t = j / Math.max(1, h - 1) * (stops.length - 1), k = Math.min(stops.length - 2, Math.floor(t)), f = t - k;
  for(let i = 0; i < w; i++) px(x + i, y + j, f * 16 > BAYER[(y + j) & 3][(x + i) & 3] + 0.5 ? stops[k + 1] : stops[k]); } }
function canvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function withCtx(c, fn){ const old = G; G = c.getContext('2d'); fn(); G = old; return c; }

// ---------- creature sprites: vector shapes → snapped pixels → auto shading (lit top-left) → coloured outline ----------
function shapePath(g, s){ g.beginPath();
  if(s[0] === 'e') g.ellipse(s[2], s[3], s[4], s[5], s[6] || 0, 0, Math.PI * 2);
  else if(s[0] === 'p'){ s[2].forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
  else if(s[0] === 'f'){ const [, , x, y, w, h, l] = s; g.moveTo(x - w, y); g.bezierCurveTo(x - w * 2.2, y - h * 0.8, x - l - w, y - h * 1.4, x - l, y - h * 2.4); g.bezierCurveTo(x - l + w * 0.6, y - h * 1.2, x + w * 2.2, y - h * 0.6, x + w, y); g.closePath(); } }
function buildSprite(shapes, flip, N = 64){
  const c = canvas(N, N), g = c.getContext('2d'); if(flip){ g.translate(N, 0); g.scale(-1, 1); } g.scale(N / 64, N / 64);
  const pal = [...new Set(shapes.map(s => s[1]))], P = pal.map(hex), idOf = new Int16Array(N * N).fill(-1);
  shapes.forEach(s => { shapePath(g, s); g.fillStyle = s[1]; g.fill(); });
  const d = g.getImageData(0, 0, N, N).data;
  for(let i = 0; i < N * N; i++){ if(d[i * 4 + 3] < 120) continue; let b = 0, bd = 1e9; P.forEach((p, k) => { const dd = (p[0] - d[i * 4]) ** 2 + (p[1] - d[i * 4 + 1]) ** 2 + (p[2] - d[i * 4 + 2]) ** 2; if(dd < bd){ bd = dd; b = k; } }); idOf[i] = b; }
  const flat = pal.map(col => { const [r, gg, b] = hex(col); const L = 0.3 * r + 0.59 * gg + 0.11 * b; return L < 70 || L > 245; }); // eyes, noses, shines stay flat
  const id = (x, y) => x < 0 || y < 0 || x >= N || y >= N ? -1 : idOf[y * N + x];
  const same = (a, b) => a === b || (b >= 0 && flat[b]);
  const out = g.createImageData(N, N), o = out.data, put = (i, col) => { const [r, gg, b] = hex(col); o[i * 4] = r; o[i * 4 + 1] = gg; o[i * 4 + 2] = b; o[i * 4 + 3] = 255; };
  for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){ const k = id(x, y); if(k < 0) continue; const col = pal[k]; let c2 = col;
    if(!flat[k]){ const dn1 = !same(k, id(x, y + 1)) || !same(k, id(x + 1, y + 1)), dn2 = !same(k, id(x, y + 2)) || !same(k, id(x + 1, y + 2)) || !same(k, id(x + 2, y + 1)), up = !same(k, id(x, y - 1)) || !same(k, id(x - 1, y - 1)), up2 = !same(k, id(x - 1, y - 2)) || !same(k, id(x - 2, y - 1));
      if(dn1) c2 = tint(shade(col, -0.32), 0.18, '#302060'); else if(dn2) c2 = tint(shade(col, -0.16), 0.1, '#302060'); else if(up) c2 = tint(shade(col, 0.38), 0.12, '#fff0c0'); else if(up2) c2 = tint(shade(col, 0.16), 0.08, '#fff0c0'); }
    put(y * N + x, c2); }
  for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){ if(id(x, y) >= 0) continue; const nb = [id(x - 1, y), id(x + 1, y), id(x, y - 1), id(x, y + 1)].filter(k => k >= 0); if(!nb.length) continue;
    const k = nb.find(k => !flat[k]) ?? nb[0]; put(y * N + x, tint(shade(pal[k], -0.68), 0.25, '#201040')); } // outline tinted by the colour it borders
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, N, N); g.putImageData(out, 0, 0); return c; }
function silhouette(src, col = '#ffffff'){ const c = canvas(src.width, src.height), g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return c; }
const SPRC = {};
function spr(sp, flip, N = 64, white){ const k = sp + (flip ? 'F' : '') + N + (white ? 'W' : ''); if(!SPRC[k]) SPRC[k] = white ? silhouette(spr(sp, flip, N)) : buildSprite(SP[sp].art, flip, N); return SPRC[k]; }
